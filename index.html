<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1인1역 관리 시스템</title>
<style>
:root{
  --green:#1bb052;--green-d:#15803d;--green-l:#d7f7e3;--green-bg:#eafcf1;
  --bg:#f4faf6;--card:#fff;--elev2:#edf9f1;--text:#16201a;--dim:#7c8b81;
  --border:#e2f0e8;--danger:#ef4444;--warn:#f59e0b;--indigo:#4f46e5;
  --gray-soft:#eef1ee;--gray-text:#6b7280;
  --shadow:0 2px 12px rgba(27,176,82,.08);
  --radius:18px;
}
[data-theme=dark]{
  --bg:#0c1712;--card:#141f19;--elev2:#1a2721;--text:#eef4f0;--dim:#8ea79a;
  --border:#223129;--green-l:#123420;--green-bg:#0e2317;--gray-soft:#1a2721;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Auth ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.auth-box{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:28px 26px;box-shadow:var(--shadow);border:1px solid var(--border);}
.auth-box h1{text-align:center;font-size:18px;font-weight:800;margin-bottom:4px;}
.auth-box .sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:22px;}
.auth-logo{width:50px;height:50px;border-radius:16px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.auth-logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-bottom:5px;}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;min-height:14px;white-space:pre-wrap;}
.pw-bar-wrap{height:4px;border-radius:2px;margin-top:4px;background:var(--gray-soft);overflow:hidden;}
#setupPwBar{height:100%;width:0%;transition:width .3s;}

/* ── App ── */
.app{display:none;min-height:100vh;}
.app.active{display:flex;}
.sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:9px;padding:6px 4px 16px;}
.brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.brand-name{font-weight:800;font-size:14px;}
.nav-sec{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;padding:11px 10px 3px;opacity:.65;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;font-size:13px;font-weight:500;color:var(--dim);text-align:left;transition:background .12s;}
.nav-item:hover{background:var(--elev2);color:var(--text);}
.nav-item.active{background:var(--green);color:#fff;font-weight:700;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-badge{background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;margin-left:auto;}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px;}
.theme-toggle{display:flex;background:var(--elev2);border-radius:10px;padding:3px;gap:2px;}
.theme-toggle button{flex:1;padding:5px 0;border-radius:7px;font-size:11px;color:var(--dim);}
.theme-toggle button.active{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.user-chip{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:11px;background:var(--elev2);font-size:12px;font-weight:600;}
.user-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.main{flex:1;padding:22px 28px 80px;overflow-y:auto;max-height:100vh;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.topbar h1{font-size:19px;font-weight:800;}
.topbar .page-sub{font-size:12px;color:var(--dim);margin-top:2px;}

/* ── Cards / UI ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.card h2{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.btn{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--green);color:#fff;display:inline-flex;align-items:center;gap:5px;border-bottom:2px solid var(--green-d);position:relative;top:0;transition:top .08s,border-bottom-width .08s;}
.btn:active{top:1px;border-bottom-width:1px;}
.btn.ghost{background:var(--elev2);color:var(--text);border-bottom-color:var(--border);}
.btn.danger{background:var(--danger);color:#fff;border-bottom-color:#b91c1c;}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px;}
.btn.full{width:100%;justify-content:center;margin-top:4px;}
.row{display:flex;align-items:center;gap:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.ok{background:var(--green-l);color:var(--green-d);}
.badge.pending{background:var(--gray-soft);color:var(--gray-text);}
.badge.danger{background:#fde2e2;color:#b91c1c;}
.badge.admin{background:#e0e7ff;color:#3730a3;}
.empty{text-align:center;padding:24px 10px;color:var(--dim);font-size:13px;}
.info-banner{background:var(--green-bg);border:1px solid var(--green-l);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--green-d);margin-bottom:12px;line-height:1.5;}
[data-theme=dark] .info-banner{color:#6ee89a;border-color:var(--border);}
.list-item{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lname{font-size:13px;font-weight:700;flex:1;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:7px 8px;color:var(--dim);font-weight:700;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;}
td{padding:8px 8px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}

/* ── Hero / notice ── */
.hero-card{border-radius:22px;padding:20px 22px;margin-bottom:13px;color:#fff;background:linear-gradient(135deg,#1bb052,#15803d);}
.hero-card .hlabel{font-size:12px;opacity:.85;font-weight:600;margin-bottom:6px;}
.hero-card .hval{font-size:26px;font-weight:800;}
.notice-card{border-radius:22px;padding:14px 18px;margin-bottom:13px;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:flex;align-items:center;gap:12px;}
.notice-card .ntitle{font-weight:800;font-size:14px;margin-bottom:2px;}
.notice-card .nsub{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;}
.notice-card .npill{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;font-weight:700;font-size:11px;}

/* ── Tiles ── */
.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative;transition:transform .12s;}
.tile:hover{transform:translateY(-1px);}
.ticon{width:42px;height:42px;border-radius:12px;background:var(--green-l);display:flex;align-items:center;justify-content:center;}
.ticon svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tlabel{font-size:11.5px;font-weight:700;color:var(--text);}
.tbadge{position:absolute;top:8px;right:10px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;min-width:14px;height:14px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ── Vote / Peer ── */
.peer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px;}
.peer-card{border:2px solid var(--border);border-radius:14px;padding:11px 9px;text-align:center;background:var(--elev2);transition:border-color .15s;}
.peer-card.voted-O{border-color:var(--green);background:var(--green-bg);}
.peer-card.voted-X{border-color:var(--danger);background:#fde8e8;}
.peer-name{font-weight:800;font-size:13px;margin-bottom:8px;}
.ox-row{display:flex;gap:5px;}
.ox-btn{flex:1;padding:8px 0;border-radius:9px;font-size:16px;font-weight:900;border:2px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:all .12s;}
.ox-btn.o-sel{background:var(--green);color:#fff;border-color:var(--green);}
.ox-btn.x-sel{background:var(--danger);color:#fff;border-color:var(--danger);}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;gap:7px;max-height:48vh;overflow-y:auto;padding:4px 2px;margin-bottom:10px;}
.chat-mine{align-self:flex-end;max-width:78%;}
.chat-theirs{align-self:flex-start;max-width:78%;}
.chat-bubble-mine{background:var(--green);color:#fff;border-radius:15px 15px 4px 15px;padding:9px 13px;font-size:13.5px;line-height:1.5;}
.chat-bubble-theirs{background:var(--elev2);border-radius:4px 15px 15px 15px;padding:9px 13px;font-size:13.5px;line-height:1.5;}
.chat-sender{font-size:11px;color:var(--dim);margin-bottom:3px;font-weight:600;}
.chat-time{font-size:10px;color:var(--dim);margin-top:3px;}
.chat-sys{padding:7px 14px;border-radius:11px;font-size:12.5px;font-weight:700;text-align:center;align-self:center;max-width:90%;}
.chat-sys-conclude{background:var(--green-l);color:var(--green-d);}
.chat-sys-notice{background:#e0e7ff;color:#3730a3;}
.chat-sys-mention{background:#fef3c7;color:#92400e;}
.chat-sys-end{background:var(--gray-soft);color:var(--gray-text);}
.chat-poll-card{background:var(--elev2);border:1px solid var(--border);border-radius:13px;padding:10px 12px;align-self:center;max-width:90%;}

/* ── Modal / Toast ── */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,15,.45);display:none;align-items:center;justify-content:center;z-index:900;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:20px;border:1px solid var(--border);padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:800;margin-bottom:14px;}
.toast{position:fixed;bottom:84px;right:16px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* ── Bottom nav ── */
.bottom-nav{display:none;}
@media(max-width:768px){
  .sidebar{display:none;}
  .app.active{flex-direction:column;}
  .main{padding:13px 13px 88px;max-height:none;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .tile-grid{grid-template-columns:repeat(3,1fr);}
  .card{padding:15px 13px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:500;}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--dim);font-weight:600;padding:3px 0;position:relative;}
  .bottom-nav button.active{color:var(--green);}
  .bottom-nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .bn-badge{position:absolute;top:0;right:calc(50% - 16px);background:var(--danger);color:#fff;font-size:8.5px;font-weight:800;min-width:13px;height:13px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 2px;}
  .modal{border-radius:20px 20px 0 0;}
  .modal-bg{align-items:flex-end;}
}
@media(min-width:769px) and (max-width:1024px){
  .sidebar{width:60px;padding:11px 7px;overflow:hidden;}
  .brand-name,.nav-item>span:not(.nav-badge),.nav-sec,.sidebar-foot{display:none;}
  .nav-item{justify-content:center;padding:10px 0;}
  .nav-item svg{width:19px;height:19px;margin:0;}
}
.hidden{display:none!important;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
</style>
</head>
<body>

<!-- LOADING -->
<div class="auth-wrap" id="loadingScreen">
  <div style="text-align:center">
    <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div style="font-weight:800;font-size:17px;margin-bottom:8px">1인1역 관리 시스템</div>
    <div style="color:var(--dim);font-size:13px;margin-bottom:20px;white-space:pre-wrap;text-align:center" id="loadingMsg">연결 중...</div>
    <div style="width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div>
  </div>
</div>

<!-- LOGIN -->
<div class="auth-wrap hidden" id="loginScreen">
  <div class="auth-box">
    <div class="auth-logo"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>1인1역 관리 시스템</h1>
    <div class="sub">이름과 비밀번호로 로그인해줘</div>
    <div class="field"><label>이름</label><input id="loginName" placeholder="이름" onkeydown="if(event.key==='Enter')document.getElementById('loginPw').focus()"></div>
    <div class="field"><label>비밀번호</label><input id="loginPw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')handleLogin()"></div>
    <button class="btn full" id="loginBtn" onclick="handleLogin()">로그인</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- SETUP -->
<div class="auth-wrap hidden" id="setupScreen">
  <div class="auth-box" style="max-width:400px">
    <div class="auth-logo" style="background:#4f46e5"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div>
    <h1>관리자 계정 만들기</h1>
    <div class="sub">첫 관리자 계정을 만들어줘</div>
    <div class="field"><label>이름 *</label><input id="setupName" placeholder="실명"></div>
    <div class="field"><label>이메일 *</label><input id="setupEmail" type="email" placeholder="example@email.com"></div>
    <div class="field"><label>전화번호 *</label><input id="setupPhone" type="tel" placeholder="010-0000-0000" oninput="formatPhone(this)"></div>
    <div class="field"><label>비밀번호 * (6자 이상)</label>
      <input id="setupPw" type="password" oninput="checkPwStrength(this.value)">
      <div class="pw-bar-wrap"><div id="setupPwBar"></div></div>
    </div>
    <div class="field"><label>비밀번호 확인 *</label><input id="setupPw2" type="password" onkeydown="if(event.key==='Enter')handleSetup()"></div>
    <button class="btn full" onclick="handleSetup()">계정 만들기</button>
    <div class="err-msg" id="setupErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="brand-name">1인1역</div>
    </div>
    <div id="navItems"></div>
    <div class="sidebar-foot">
      <div class="theme-toggle">
        <button data-t="light" onclick="setTheme('light')">라이트</button>
        <button data-t="dark" onclick="setTheme('dark')">다크</button>
        <button data-t="system" onclick="setTheme('system')">시스템</button>
      </div>
      <div class="user-chip"><span class="user-dot"></span><span id="userChipName"></span></div>
      <button class="btn ghost small" style="width:100%;justify-content:center" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">대시보드</h1><div class="page-sub" id="pageSub"></div></div>
      <div id="topbarActions"></div>
    </div>
    <div id="pageContent"></div>
  </div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* =========================================================
   1인1역 관리 시스템 - app.js
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAbmpRUvrDbPdRASWNXv2N3DlDMWiUf7VA",
  authDomain: "theclaeyongkr.firebaseapp.com",
  databaseURL: "https://theclaeyongkr-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "theclaeyongkr",
  storageBucket: "theclaeyongkr.firebasestorage.app",
  messagingSenderId: "465244053974",
  appId: "1:465244053974:web:a24aa3e7defcb5b371c477"
};

let db = null, auth = null, dbReady = false;
try { firebase.initializeApp(firebaseConfig); db = firebase.database(); auth = firebase.auth(); dbReady = true; }
catch(e) { console.error('Firebase init failed', e); }

/* ── Cache ── */
const cache = {
  users:{}, duties:{}, completions:{},
  peerEvals:{}, peerEvalVotes:{},
  complaints:{}, notices:{}, polls:{}, pollVotes:{},
  memos:{}, groupSets:{}, meetings:{}, meetingMessages:{}, meetingModeratorVotes:{},
  settings:{ gradeThresholds:{ a:90, b:75, c:50 } }
};
let currentUser=null, currentPage='dashboard';
const expandedLists={};
let openMeetingId=null, activeMeetingListener=null;
let aiConversation=[];

/* ── Init ── */
window.addEventListener('DOMContentLoaded', init);

function init() {
  applyTheme(localStorage.getItem('theme')||'system');
  showScreen('loading');
  if (!dbReady) { setLoadMsg('Firebase 초기화 실패 — config를 확인해줘'); return; }
  const tout = setTimeout(() => setLoadMsg(
    '연결 초과. 확인:\n1) Firebase > Authentication > 익명 로그인 ON\n2) RTDB 규칙 ".read":true ".write":true\n3) 브라우저에서 직접 파일 열기 (클로드 미리보기 X)'), 12000);
  auth.signInAnonymously()
    .then(() => setLoadMsg('DB 로드 중...'))
    .catch(e => { clearTimeout(tout); setLoadMsg('익명 로그인 실패: ' + e.message + '\n→ Authentication > Sign-in method > 익명 켜줘'); });
  auth.onAuthStateChanged(user => {
    if (!user) return;
    clearTimeout(tout);
    db.ref('users').once('value').then(snap => {
      cache.users = snap.val() || {};
      const hasAdmin = Object.values(cache.users).some(u => u.systemRole === 'admin');
      const saved = JSON.parse(localStorage.getItem('session') || 'null');
      if (saved && saved.uid && cache.users[saved.uid]) {
        const u = cache.users[saved.uid];
        currentUser = { uid: saved.uid, name: u.name, systemRole: u.systemRole };
        startListeners(); enterApp(); return;
      }
      showScreen(hasAdmin ? 'login' : 'setup');
      startListeners();
    }).catch(e => { setLoadMsg('DB 읽기 실패: ' + e.message + '\n→ RTDB 규칙 ".read":"auth != null" 확인'); });
  });
}

function setLoadMsg(m) { const el=g('loadingMsg'); if(el) el.textContent=m; }
function showScreen(name) {
  ['loadingScreen','loginScreen','setupScreen'].forEach(id => {
    const el=g(id); if(el) el.classList.toggle('hidden', id !== name+'Screen');
  });

function startListeners() {
  const paths=['users','duties','completions','peerEvals','peerEvalVotes',
    'complaints','notices','polls','pollVotes','memos','groupSets',
    'meetings','meetingModeratorVotes','settings'];
  paths.forEach(path => db.ref(path).on('value', snap => {
    cache[path] = snap.val() || (path==='settings'?{gradeThresholds:{a:90,b:75,c:50}}:{});
    if (currentUser) { buildNav(); if(currentPage!=='ai') renderPage(currentPage); }
  }));
}
function subMeetingMsg(id) {
  if (activeMeetingListener) { db.ref('meetingMessages/'+activeMeetingListener).off(); activeMeetingListener=null; }
  if (!id) return;
  activeMeetingListener = id;
  db.ref('meetingMessages/'+id).on('value', snap => {
    cache.meetingMessages[id] = snap.val() || {};
    if (currentPage==='meetings' && openMeetingId===id) {
      const wrap=g('chatWrap');
      if (wrap && document.activeElement!==g('meetingInput')) {
        wrap.innerHTML = sortEntries(cache.meetingMessages[id]).map(([mid,m])=>chatMsgHtml(id,mid,m)).join('') || emptyDiv('메시지 없음');
        wrap.scrollTop = wrap.scrollHeight;
      }
    }
  });
}

/* ── Auth ── */
async function hashPw(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatPhone(el) {
  let v=el.value.replace(/\D/g,'').slice(0,11);
  el.value = v.length<=3?v:v.length<=7?v.slice(0,3)+'-'+v.slice(3):v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
}
function checkPwStrength(pw) {
  let s=0; if(pw.length>=6)s++; if(pw.length>=10)s++;
  if(/[A-Z]/.test(pw))s++; if(/[0-9]/.test(pw))s++; if(/[^A-Za-z0-9]/.test(pw))s++;
  const bar=g('setupPwBar');
  if(bar){bar.style.width=(s*20)+'%';bar.style.background=['#ef4444','#f59e0b','#eab308','#22c55e','#16a34a'][s-1]||'#ef4444';}
}
async function handleSetup() {
  const name=g('setupName').value.trim(), email=g('setupEmail').value.trim(),
        phone=g('setupPhone').value.trim(), pw=g('setupPw').value, pw2=g('setupPw2').value;
  const err=g('setupErr'); err.textContent='';
  if(!name){err.textContent='이름 입력';return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='이메일 형식 확인';return;}
  if(phone.replace(/\D/g,'').length<10){err.textContent='전화번호 확인';return;}
  if(pw.length<6){err.textContent='비밀번호 6자 이상';return;}
  if(pw!==pw2){err.textContent='비밀번호 불일치';return;}
  const hash=await hashPw(pw);
  const uid=db.ref('users').push().key;
  db.ref('users/'+uid).set({name,email,phone,password:hash,systemRole:'admin',createdAt:Date.now()})
    .then(()=>{currentUser={uid,name,systemRole:'admin'};localStorage.setItem('session',JSON.stringify({uid}));enterApp();})
    .catch(e=>{err.textContent='저장 실패: '+e.message;});
}
async function handleLogin() {
  const name=g('loginName').value.trim(), pw=g('loginPw').value;
  const err=g('loginErr'), btn=g('loginBtn'); err.textContent='';
  if(!name||!pw){err.textContent='이름과 비밀번호 입력';return;}
  if(btn) btn.textContent='확인 중...';
  const hash=await hashPw(pw);
  let users=cache.users;
  if(!Object.keys(users).length){const s=await db.ref('users').once('value');users=cache.users=s.val()||{};}
  let entry=Object.entries(users).find(([,u])=>u.name===name&&u.password===hash);
  if(!entry) entry=Object.entries(users).find(([,u])=>u.name===name&&u.password===pw);
  if(!entry){err.textContent='이름 또는 비밀번호 오류';if(btn)btn.textContent='로그인';return;}
  const [uid,u]=entry;
  if(u.password===pw) db.ref('users/'+uid+'/password').set(hash);
  currentUser={uid,name:u.name,systemRole:u.systemRole};
  localStorage.setItem('session',JSON.stringify({uid}));
  enterApp();
}
function handleLogout() {
  currentUser=null; localStorage.removeItem('session'); showScreen('login');
  g('loginName').value=''; g('loginPw').value='';
  const btn=g('loginBtn'); if(btn) btn.textContent='로그인';
}
function enterApp() {
  ['loadingScreen','loginScreen','setupScreen'].forEach(id=>{const el=g(id);if(el)el.classList.add('hidden');});
  g('app').classList.add('active');
  g('userChipName').textContent=currentUser.name+(isAdmin()?' · 관리자':'');
  syncThemeBtns(); buildNav(); renderPage('dashboard');
}

/* ── Theme ── */
function setTheme(m){localStorage.setItem('theme',m);applyTheme(m);syncThemeBtns();}
function applyTheme(m){
  const dark=m==='system'?window.matchMedia('(prefers-color-scheme: dark)').matches:m==='dark';
  dark?document.documentElement.setAttribute('data-theme','dark'):document.documentElement.removeAttribute('data-theme');
}
function syncThemeBtns(){
  const m=localStorage.getItem('theme')||'system';
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===m));
}

function renderExpandable(key,items,limit=5){
  const exp=expandedLists[key];
  const shown=exp?items:items.slice(0,limit);
  let out=shown.join('');
  if(!exp&&items.length>limit) out+=`<button class="btn ghost small" style="margin-top:8px" onclick="toggleExpand('${key}')">더보기 (+${items.length-limit})</button>`;
  else if(exp&&items.length>limit) out+=`<button class="btn ghost small" style="margin-top:8px" onclick="toggleExpand('${key}')">접기</button>`;
  return out;
}
function toggleExpand(key){expandedLists[key]=!expandedLists[key];renderPage(currentPage);}

function svgIcon(id){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||''}</svg>`;}
function navBadge(id){
  if(id==='memos') return Object.values(cache.memos||{}).filter(m=>m.toUid===currentUser.uid&&!m.read).length;
  if(id==='vote'){
    const u=Object.entries(cache.polls||{}).filter(([pid,p])=>p.approved&&!p.closed&&!(cache.pollVotes[pid]||{})[currentUser.uid]).length;
    const p=isAdmin()?Object.values(cache.polls||{}).filter(p=>!p.approved&&!p.closed).length+Object.values(cache.peerEvals||{}).filter(p=>!p.approved&&!p.closed).length:0;
    return u+p;
  }
  if(id==='checks') return myManagedDuties().reduce((s,[did,d])=>s+Object.keys(d.memberIds||{}).filter(uid=>!((cache.completions[did]||{})[uid]||{}).done).length,0);
  if(id==='apply') return isAdmin()?Object.values(cache.duties||{}).reduce((s,d)=>s+Object.values(d.applications||{}).filter(a=>a.status==='pending').length,0):0;
  if(id==='notices'){const seen=Number(localStorage.getItem('noticesSeen')||0);return Object.values(cache.notices||{}).filter(n=>(n.createdAt||0)>seen).length;}
  return 0;
}

function buildNav(){
  const items=navItems(); let lastSec='',html='';
  items.forEach(it=>{
    if(it.sec!==lastSec){html+=`<div class="nav-sec">${esc(it.sec)}</div>`;lastSec=it.sec;}
    const n=navBadge(it.id);
    html+=`<button class="nav-item${it.id===currentPage?' active':''}" onclick="renderPage('${it.id}')">
      ${svgIcon(it.id)}<span>${esc(it.label)}</span>${n>0?`<span class="nav-badge">${n}</span>`:''}
    </button>`;
  });
  g('navItems').innerHTML=html;
  const primary=items.slice(0,4), rest=items.slice(4);
  const restN=rest.reduce((s,it)=>s+navBadge(it.id),0);
  g('bottomNav').innerHTML=primary.map(it=>{const n=navBadge(it.id);return `<button class="${it.id===currentPage?'active':''}" onclick="renderPage('${it.id}')">${svgIcon(it.id)}${esc(it.label)}${n?`<span class="bn-badge">${n}</span>`:''}</button>`;}).join('')
    +(rest.length?`<button onclick="openMoreMenu()">${svgIcon('settings')}더보기${restN?`<span class="bn-badge">${restN}</span>`:''}</button>`:'');
}
function openMoreMenu(){

}

function renderDashboard(){
  const todo=navBadge('vote')+navBadge('checks')+(isAdmin()?navBadge('apply'):0);
  const tiles=['myDuties','vote','complaints','memos','meetings',
    ...(myManagedDuties().length?['checks']:[]),

  if(myManagedDuties().length){
    const rows=[];

/* ── Vote ── */
function renderVote(){
  const activePolls=Object.entries(cache.polls||{}).filter(([,p])=>p.approved&&!p.closed).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const pendingPolls=Object.entries(cache.polls||{}).filter(([,p])=>!p.approved&&!p.closed);
  const activePeer=Object.entries(cache.peerEvals||{}).filter(([,p])=>p.approved&&!p.closed);
  const pendingPeer=Object.entries(cache.peerEvals||{}).filter(([,p])=>!p.approved&&!p.closed);

  const pollsHtml=activePolls.map(([pid,p])=>{
    const votes=cache.pollVotes[pid]||{},my=votes[currentUser.uid];
    const tally={};Object.values(votes).forEach(v=>tally[v]=(tally[v]||0)+1);
    const total=Object.values(votes).length;
    let ui;
    if(p.type==='ox'){
      ui=`<div style="display:flex;gap:10px;max-width:250px">
        ${['O','X'].map(v=>`<button onclick="castPollVote('${pid}','${v}')" style="flex:1;padding:16px 0;border-radius:14px;font-size:22px;font-weight:900;border:3px solid ${my===v?(v==='O'?'var(--green)':'var(--danger)'):'var(--border)'};background:${my===v?(v==='O'?'var(--green)':'var(--danger)'):'var(--elev2)'};color:${my===v?'#fff':'var(--text)'};cursor:pointer">${v}<br><span style="font-size:11px">${tally[v]||0}표</span></button>`).join('')}
      </div>`;
    } else {
      ui=`<div style="display:flex;flex-direction:column;gap:7px">${(p.options||[]).map((opt,i)=>{
        const key=String(i),sel=my===key,cnt=tally[key]||0,pct=total?Math.round(cnt/total*100):0;
        return `<button onclick="castPollVote('${pid}','${key}')" style="text-align:left;padding:11px 13px;border-radius:13px;border:2px solid ${sel?'var(--green)':'var(--border)'};background:${sel?'var(--green-bg)':'var(--elev2)'};cursor:pointer;position:relative;overflow:hidden">
          <div style="position:absolute;inset:0;width:${pct}%;background:${sel?'var(--green-l)':'var(--gray-soft)'};opacity:.5"></div>
          <div style="position:relative;display:flex;justify-content:space-between"><span style="font-weight:700">${i+1}. ${esc(opt)}</span><span style="font-size:11.5px;color:var(--dim)">${cnt}표 (${pct}%)</span></div>
        </button>`;
      }).join('')}</div>`;
    }
    return `<div class="card"><h2>📋 ${esc(p.question)} <span style="color:var(--dim);font-size:12px">· ${total}표</span></h2>
      <div style="font-size:12px;color:var(--dim);margin-bottom:10px">작성자: ${esc(userName(p.createdBy))}</div>
      ${ui}
      ${isAdmin()?`<div style="margin-top:10px;display:flex;gap:6px"><button class="btn ghost small" onclick="closePoll('${pid}')">마감</button><button class="btn danger small" onclick="deletePoll('${pid}')">삭제</button></div>`:''}
    </div>`;
  }).join('');

  const peerHtml=activePeer.map(([eid,ev])=>{
    const others=Object.entries(cache.users||{}).filter(([uid])=>uid!==currentUser.uid);
    const myVotes=(cache.peerEvalVotes[eid]||{})[currentUser.uid]||{};
    const prog=others.filter(([uid])=>myVotes[uid]).length;
    return `<div class="card"><h2>🗳️ ${esc(ev.question)}</h2>
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px"><span>내 투표 진행</span><span>${prog}/${others.length}</span></div>
        <div style="height:7px;border-radius:99px;background:var(--gray-soft);overflow:hidden"><div style="height:100%;width:${others.length?Math.round(prog/others.length*100):0}%;background:var(--green)"></div></div>
      </div>
      <div class="peer-grid">${others.map(([uid,u])=>{
        const my=myVotes[uid];
        return `<div class="peer-card ${my==='O'?'voted-O':my==='X'?'voted-X':''}">
          <div class="peer-name">${esc(u.name)}</div>
          <div class="ox-row">
            <button class="ox-btn ${my==='O'?'o-sel':''}" onclick="castPeerVote('${eid}','${uid}','O')">O</button>
            <button class="ox-btn ${my==='X'?'x-sel':''}" onclick="castPeerVote('${eid}','${uid}','X')">X</button>
          </div></div>`;
      }).join('')}</div>
      ${isAdmin()?`<div style="margin-top:10px;display:flex;gap:6px"><button class="btn ghost small" onclick="closePeerEval('${eid}')">마감</button><button class="btn danger small" onclick="deletePeerEval('${eid}')">삭제</button></div>`:''}
    </div>`;
  }).join('');

  const approvalHtml=isAdmin()&&(pendingPolls.length||pendingPeer.length)?`
    <div class="card"><h2>📥 승인 대기 <span style="color:var(--dim);font-size:12px">· ${pendingPolls.length+pendingPeer.length}건</span></h2>
      ${[...pendingPolls.map(([id,p])=>({id,p,type:'poll'})),...pendingPeer.map(([id,p])=>({id,p,type:'peer'}))].map(({id,p,type})=>`
        <div class="list-item"><span class="ldot" style="background:#4f46e5"></span>
          <span class="lname">${esc(p.question)} <span style="color:var(--dim);font-size:11px">· ${type==='peer'?'동료평가':p.type==='ox'?'O/X':'객관식'} · ${esc(userName(p.createdBy))}</span></span>
          <button class="btn small" onclick="${type==='peer'?'approvePeer':'approvePoll'}('${id}')">승인</button>
          <button class="btn danger small" onclick="${type==='peer'?'deletePeerEval':'deletePoll'}('${id}')">거절</button>
        </div>`).join('')}
    </div>`:'' ;

  g('pageContent').innerHTML=`
    <div class="info-banner">📊 투표에 참여하거나 새 투표를 만들 수 있어. 관리자 승인 후 공개돼.</div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="openCreatePollModal()">+ 투표 만들기</button>
      ${isAdmin()?`<button class="btn ghost small" onclick="openCreatePeerModal()">+ 동료평가 (관리자)</button>`:''}
    </div></div>
    ${approvalHtml}
    ${pollsHtml||peerHtml?pollsHtml+peerHtml:`<div class="card">${emptyDiv('진행 중인 투표 없음. 위에서 만들어봐!')}</div>`}`;
}
function castPollVote(pid,ans){db.ref(`pollVotes/${pid}/${currentUser.uid}`).set(ans).then(()=>toast('투표했어'));}
function castPeerVote(eid,uid,val){db.ref(`peerEvalVotes/${eid}/${currentUser.uid}/${uid}`).set(val).then(()=>toast('투표했어'));}
function approvePoll(id){if(!isAdmin())return;db.ref(`polls/${id}/approved`).set(true).then(()=>toast('승인했어'));}
function approvePeer(id){if(!isAdmin())return;db.ref(`peerEvals/${id}/approved`).set(true).then(()=>toast('승인했어'));}
function closePoll(id){if(!isAdmin())return;db.ref(`polls/${id}/closed`).set(true).then(()=>toast('마감했어'));}
function deletePoll(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('polls/'+id).remove().then(()=>db.ref('pollVotes/'+id).remove()).then(()=>toast('삭제했어'));}
function closePeerEval(id){if(!isAdmin())return;db.ref(`peerEvals/${id}/closed`).set(true).then(()=>toast('마감했어'));}
function deletePeerEval(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('peerEvals/'+id).remove().then(()=>db.ref('peerEvalVotes/'+id).remove()).then(()=>toast('삭제했어'));}
function openCreatePollModal(){
  openModal(`<h3>투표 만들기</h3>
    <div class="field"><label>질문</label><input id="mPQ" placeholder="예: 행사 장소는?"></div>
    <div class="field"><label>형식</label>
      <select id="mPT" onchange="g('mPOptWrap').classList.toggle('hidden',this.value==='ox')">
        <option value="ox">O / X</option><option value="choice">객관식</option>
      </select></div>
    <div id="mPOptWrap" class="field hidden"><label>선택지 (한 줄에 하나)</label><textarea id="mPOpts" rows="3" placeholder="선택지1&#10;선택지2"></textarea></div>
    <div class="err-msg" id="mPErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitCreatePoll()">만들기</button></div>`);
}
async function submitCreatePoll(){
  const q=g('mPQ').value.trim(),type=g('mPT').value,err=g('mPErr');err.textContent='';
  if(!q){err.textContent='질문 입력';return;}
  let options=[];
  if(type==='choice'){options=g('mPOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);if(options.length<2){err.textContent='선택지 2개 이상';return;}}
  db.ref('polls/'+newKey('polls')).set({question:q,type,options,createdBy:currentUser.uid,createdAt:Date.now(),closed:false,approved:isAdmin()})
    .then(()=>{toast(isAdmin()?'투표 만들었어':'신청했어. 관리자 승인 후 공개돼.');closeModal();});
}
function openCreatePeerModal(){
  if(!isAdmin()){toast('권한 없어');return;}
  openModal(`<h3>동료평가 만들기</h3>
    <div class="field"><label>질문</label><input id="mPeerQ" placeholder="예: 이번 달 역할 수행도"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitCreatePeer()">만들고 활성화</button></div>`);
}
function submitCreatePeer(){
  if(!isAdmin())return;
  const q=g('mPeerQ').value.trim();if(!q){toast('질문 입력');return;}
  db.ref('peerEvals/'+newKey('peerEvals')).set({question:q,createdBy:currentUser.uid,createdAt:Date.now(),approved:true,closed:false})
    .then(()=>{toast('동료평가 만들었어');closeModal();});
}

/* ── Checks ── */
function renderChecks(){
  const managed=myManagedDuties();
  if(!managed.length){g('pageContent').innerHTML=`<div class="info-banner">관리 중인 1인1역이 없어요.</div>`;return;}
  let td=0,tc=0;
  managed.forEach(([did,d])=>Object.keys(d.memberIds||{}).forEach(uid=>{tc++;if(((cache.completions[did]||{})[uid]||{}).done)td++;}));
  const pct=tc?Math.round(td/tc*100):0;
  g('pageContent').innerHTML=`
    <div class="info-banner">✅ 멤버 임무 완료 여부를 체크해줘.</div>
    <div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px"><span>전체 완료율</span><span style="color:var(--green)">${td}/${tc} (${pct}%)</span></div>
      <div style="height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--green);transition:width .4s"></div></div>
    </div>
    ${managed.map(([did,d])=>{
      const members=Object.keys(d.memberIds||{});
      const dc=members.filter(uid=>((cache.completions[did]||{})[uid]||{}).done).length;
      return `<div class="card"><h2><span style="width:12px;height:12px;border-radius:4px;background:${d.color||'var(--green)'};display:inline-block;margin-right:6px;vertical-align:-1px"></span>${esc(d.title)}<span style="color:var(--dim);font-size:12px;margin-left:auto">${dc}/${members.length}</span></h2>
        ${members.length?`<div style="display:flex;flex-direction:column;gap:7px">${members.map(uid=>{
          const c=((cache.completions[did]||{})[uid])||{};
          return `<div style="display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;background:${c.done?'var(--green-bg)':'var(--elev2)'};border:2px solid ${c.done?'var(--green-l)':'var(--border)'}">
            <div style="font-size:20px">${c.done?'✅':'⬜'}</div>
            <div style="flex:1;font-weight:700;font-size:13.5px">${esc(userName(uid))}</div>
            <button class="btn ${c.done?'ghost':''} small" onclick="toggleCompletion('${did}','${uid}',${!c.done})">${c.done?'↩ 취소':'완료 처리'}</button>
          </div>`;
        }).join('')}</div>`:emptyDiv('멤버 없음')}
      </div>`;
    }).join('')}`;
}
function toggleCompletion(did,uid,done){
  db.ref(`completions/${did}/${uid}`).set(done?{done:true,checkedBy:currentUser.uid,checkedAt:Date.now()}:null)
    .then(()=>toast(done?'완료 처리했어 🎉':'미완료로 변경했어'));
}

/* ── Apply ── */
function renderApply(){
  const duties=Object.entries(cache.duties||{});
  const applicable=duties.filter(([id,d])=>!d.memberIds?.[currentUser.uid]&&!dutyApps(id)[currentUser.uid]);
  const mine=duties.filter(([id])=>dutyApps(id)[currentUser.uid]);
  const adminPending=isAdmin()?duties.flatMap(([did,d])=>Object.entries(dutyApps(did)).filter(([,a])=>a.status==='pending').map(([uid])=>({did,d,uid}))):[];
  g('pageContent').innerHTML=`
    <div class="info-banner">📝 역할을 신청하면 관리자가 검토 후 승인해줘.</div>
    <div class="card"><h2>신청 가능한 1인1역</h2>
      ${applicable.length?`<div class="tile-grid">${applicable.map(([id,d])=>`
        <button class="tile" onclick="applyForDuty('${id}')">
          <span class="ticon" style="background:${d.color||'var(--green)'}22"><span style="width:16px;height:16px;border-radius:5px;background:${d.color||'var(--green)'};display:inline-block"></span></span>
          <span class="tlabel">${esc(d.title)}</span>
        </button>`).join('')}</div>`:emptyDiv('신청 가능한 역할 없음')}
    </div>
    <div class="card"><h2>내 신청 현황</h2>
      ${mine.length?mine.map(([id,d])=>{
        const a=dutyApps(id)[currentUser.uid];
        const [sc,label]={pending:['pending','검토 중'],approved:['ok','✅ 승인'],rejected:['danger','❌ 거절']}[a.status]||['pending','검토 중'];
        return `<div class="list-item"><span class="ldot" style="background:${d.color||'var(--green)'}"></span>
          <span class="lname">${esc(d.title)}</span><span class="badge ${sc}">${label}</span>
          ${a.status==='pending'?`<button class="btn ghost small" onclick="withdrawApp('${id}')">취소</button>`:''}
        </div>`;
      }).join(''):emptyDiv('신청 없음')}
    </div>
    ${isAdmin()&&adminPending.length?`<div class="card"><h2>승인 대기 · ${adminPending.length}건</h2>
      ${adminPending.map(({did,d,uid})=>`<div class="list-item"><span class="ldot" style="background:${d.color||'var(--green)'}"></span>
        <span class="lname"><b>${esc(userName(uid))}</b> <span style="color:var(--dim);font-size:11.5px">→ ${esc(d.title)}</span></span>
        <button class="btn small" onclick="approveApp('${did}','${uid}')">승인</button>
        <button class="btn ghost small" onclick="rejectApp('${did}','${uid}')">거절</button>
      </div>`).join('')}</div>`:''}`;
}
function applyForDuty(did){db.ref(`duties/${did}/applications/${currentUser.uid}`).set({appliedAt:Date.now(),status:'pending'}).then(()=>toast('신청했어! 관리자 검토 후 승인돼.'));}
function withdrawApp(did){if(!confirm('취소?'))return;db.ref(`duties/${did}/applications/${currentUser.uid}`).remove().then(()=>toast('취소했어'));}
function approveApp(did,uid){if(!isAdmin())return;db.ref(`duties/${did}/memberIds/${uid}`).set(true).then(()=>db.ref(`duties/${did}/applications/${uid}/status`).set('approved')).then(()=>toast('승인했어'));}
function rejectApp(did,uid){if(!isAdmin())return;db.ref(`duties/${did}/applications/${uid}/status`).set('rejected').then(()=>toast('거절했어'));}

/* ── Complaints ── */

        <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${esc(c.title)}</div>
          <div style="font-size:11.5px;color:var(--dim);margin-top:2px">${esc(userName(c.submittedBy))}${c.targetUid?` · 대상: ${esc(userName(c.targetUid))}`:''}  </div></div>

function openSubmitComplaintModal(){

    <div class="field"><label>제목</label><input id="mCplTitle"></div>
    <div class="field"><label>내용</label><textarea id="mCplContent" rows="3"></textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitComplaint()">제출</button></div>`);
}
function submitComplaint(){
  const targetUid=g('mCplTarget').value||null,title=g('mCplTitle').value.trim(),content=g('mCplContent').value.trim();
  if(!title||!content){toast('제목과 내용 입력');return;}
  db.ref('complaints/'+newKey('complaints')).set({title,content,targetUid,submittedBy:currentUser.uid,status:'pending',createdAt:Date.now()})

function resolveComplaint(id){if(!isAdmin())return;db.ref(`complaints/${id}/status`).set('resolved').then(()=>toast('해결처리했어'));}

function submitNotice(){

function togglePin(id,p){if(!isAdmin())return;db.ref(`notices/${id}/pinned`).set(p).then(()=>toast(p?'고정했어':'해제했어'));}
function deleteNotice(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('notices/'+id).remove().then(()=>toast('삭제했어'));}

function openSendMemoModal(){

function submitSendMemo(){

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function submitCreateGroup(){
  if(!isAdmin())return;
  const title=g('mGTitle').value.trim(),count=Number(g('mGCount').value);
  if(!title){toast('제목 입력');return;}if(count<2||count>20){toast('2~20');return;}
  const groups={};for(let i=1;i<=count;i++)groups[String(i)]={name:`${i}모둠`,memberIds:{}};
  const shuffled=shuffle(Object.keys(cache.users||{}));
  shuffled.forEach((uid,idx)=>{groups[String((idx%count)+1)].memberIds[uid]=true;});
  db.ref('groupSets/'+newKey('groupSets')).set({title,createdAt:Date.now(),createdBy:currentUser.uid,groups})
    .then(()=>{toast('모둠 만들었어');closeModal();});

function reshuffleGroup(sid){
  if(!isAdmin())return;const s=cache.groupSets[sid];if(!s)return;
  const gids=Object.keys(s.groups||{});if(!gids.length)return;
  const newGrps={};gids.forEach(gid=>newGrps[gid]={name:s.groups[gid].name,memberIds:{}});
  shuffle(Object.keys(cache.users||{})).forEach((uid,i)=>newGrps[gids[i%gids.length]].memberIds[uid]=true);
  db.ref(`groupSets/${sid}/groups`).set(newGrps).then(()=>toast('다시 섞었어'));
}
function deleteGroup(sid){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('groupSets/'+sid).remove().then(()=>toast('삭제했어'));}

function submitCreateMeeting(){

}
function renderMeetingDetail(id){
  const m=cache.meetings[id];if(!m){leaveMeeting();return;}
  const isMod=m.moderatorUid===currentUser.uid;
  const isPart=m.participantIds?.[currentUser.uid];
  const parts=Object.keys(m.participantIds||{});
  let setupHtml='';
  if(m.status==='setup'){
    if(m.moderatorMode==='admin'){
      setupHtml=`<div class="card"><h2>사회자 지정</h2>
        ${isAdmin()?`<div class="field"><select id="mModSel">${parts.map(uid=>`<option value="${uid}">${esc(userName(uid))}</option>`).join('')}</select></div>
          <button class="btn small" onclick="assignModerator('${id}',g('mModSel').value)">지정하고 시작</button>`
        :`<div class="empty">관리자가 지정하면 시작돼요</div>`}
      </div>`;
    } else {
      const votes=cache.meetingModeratorVotes[id]||{},myV=votes[currentUser.uid];
      const tally={};Object.values(votes).forEach(c=>tally[c]=(tally[c]||0)+1);
      setupHtml=`<div class="card"><h2>사회자 투표</h2>
        ${isPart?`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px">
          ${parts.map(uid=>`<button class="btn ${myV===uid?'':'ghost'} small" onclick="castModVote('${id}','${uid}')">${esc(userName(uid))} (${tally[uid]||0})</button>`).join('')}
        </div>`:''}
        ${isAdmin()?`<button class="btn small" onclick="finalizeModVote('${id}')">투표 마감하고 확정</button>`:''}
      </div>`;
    }
  }
  const msgs=sortEntries(cache.meetingMessages[id]||{});
  const chatHtml=(m.status==='active'||m.status==='ended')?`<div class="card">
    <h2>💬 채팅${m.moderatorUid?` · 사회자: ${esc(userName(m.moderatorUid))}`:''}</h2>
    ${m.conclusion?`<div style="background:var(--green-l);color:var(--green-d);padding:8px 13px;border-radius:11px;font-weight:700;margin-bottom:10px">✅ 결론: ${esc(m.conclusion.text)}</div>`:''}
    <div class="chat-wrap" id="chatWrap">${msgs.map(([mid,msg])=>chatMsgHtml(id,mid,msg)).join('')||emptyDiv('메시지 없음')}</div>
    ${m.status==='active'&&isPart?`
      ${isMod?`<div style="font-size:11px;color:var(--dim);margin-bottom:5px">사회자 명령어: @결론 @공지 @투표 @지목 @종료</div>`:''}
      <div class="row"><input id="meetingInput" placeholder="메시지..." style="flex:1" onkeydown="if(event.key==='Enter'){sendMsg('${id}');event.preventDefault();}"><button class="btn small" onclick="sendMsg('${id}')">전송</button></div>`
    :`<div class="empty">${m.status==='ended'?'회의 종료':'참가자만 채팅 가능'}</div>`}
  </div>`:'';
  g('pageContent').innerHTML=`
    <button class="btn ghost small" style="margin-bottom:11px" onclick="leaveMeeting()">← 목록</button>
    <div class="card"><h2>${esc(m.title)} <span class="badge ${m.status==='active'?'ok':'pending'}" style="margin-left:auto">${m.status==='setup'?'준비중':m.status==='active'?'진행중':'종료'}</span></h2>
      <div style="font-size:12px;color:var(--dim)">참가자: ${parts.map(uid=>esc(userName(uid))).join(', ')}</div>
    </div>${setupHtml}${chatHtml}`;
  const wrap=g('chatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
}
function chatMsgHtml(mid,msgId,msg){
  const mine=msg.uid===currentUser.uid;
  const time=msg.createdAt?new Date(msg.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  if(msg.type==='system'){
    const cls={결론:'chat-sys-conclude',공지:'chat-sys-notice',지목:'chat-sys-mention',종료:'chat-sys-end'}[msg.command]||'chat-sys-end';
    const em={결론:'✅',공지:'📢',지목:'👋',종료:'🔚'}[msg.command]||'💬';
    return `<div class="chat-sys ${cls}">${em} ${esc(msg.text)}</div>`;
  }
  if(msg.type==='poll'){
    const votes=msg.pollVotes||{},my=votes[currentUser.uid];
    const oC=Object.values(votes).filter(v=>v==='O').length,xC=Object.values(votes).filter(v=>v==='X').length;
    return `<div class="chat-poll-card">
      <div style="font-weight:700;margin-bottom:7px">📊 ${esc(msg.text)}</div>
      <div style="display:flex;gap:8px;max-width:200px">
        <button class="ox-btn ${my==='O'?'o-sel':''}" onclick="castMeetingPollVote('${mid}','${msgId}','O')">O (${oC})</button>
        <button class="ox-btn ${my==='X'?'x-sel':''}" onclick="castMeetingPollVote('${mid}','${msgId}','X')">X (${xC})</button>
      </div></div>`;
  }
  if(mine) return `<div class="chat-mine"><div class="chat-bubble-mine">${esc(msg.text)}</div><div class="chat-time" style="text-align:right">${time}</div></div>`;
  return `<div class="chat-theirs"><div><div class="chat-sender">${esc(userName(msg.uid))}</div><div class="chat-bubble-theirs">${esc(msg.text)}</div><div class="chat-time">${time}</div></div></div>`;
}
function assignModerator(mid,uid){if(!isAdmin())return;db.ref(`meetings/${mid}`).update({moderatorUid:uid,status:'active'}).then(()=>toast('사회자 지정, 시작!'));}
function castModVote(mid,uid){db.ref(`meetingModeratorVotes/${mid}/${currentUser.uid}`).set(uid).then(()=>toast('투표했어'));}
function finalizeModVote(mid){
  if(!isAdmin())return;
  const votes=cache.meetingModeratorVotes[mid]||{};
  const tally={};Object.values(votes).forEach(c=>tally[c]=(tally[c]||0)+1);
  const entries=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){toast('투표 없음');return;}
  db.ref(`meetings/${mid}`).update({moderatorUid:entries[0][0],status:'active'}).then(()=>toast(userName(entries[0][0])+'님 사회자 확정!'));
}
const MEETING_CMDS=['결론','공지','종료','지목','투표'];
function sendMsg(mid){
  const inp=g('meetingInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  const m=cache.meetings[mid];if(!m||m.status!=='active'){toast('종료된 회의');return;}
  const isMod=m.moderatorUid===currentUser.uid;
  const match=text.match(/^@(\S+)\s*([\s\S]*)$/);
  if(isMod&&match&&MEETING_CMDS.includes(match[1])){handleMeetingCmd(mid,match[1],match[2].trim());}
  else{db.ref(`meetingMessages/${mid}/`+newKey(`meetingMessages/${mid}`)).set({uid:currentUser.uid,text,type:'message',createdAt:Date.now()});}
  inp.value='';inp.focus();
}
function handleMeetingCmd(mid,cmd,payload){
  const id=newKey(`meetingMessages/${mid}`);
  if(cmd==='결론'){if(!payload){toast('@결론 뒤에 내용');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'system',command:'결론',createdAt:Date.now()});
    db.ref(`meetings/${mid}`).update({conclusion:{text:payload,decidedAt:Date.now()},status:'ended'});}
  else if(cmd==='공지'){if(!payload){toast('@공지 뒤에 내용');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'system',command:'공지',createdAt:Date.now()});}
  else if(cmd==='종료'){
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:'회의가 종료됐어요',type:'system',command:'종료',createdAt:Date.now()});
    db.ref(`meetings/${mid}/status`).set('ended');}
  else if(cmd==='지목'){
    const target=Object.entries(cache.users||{}).find(([,u])=>u.name===payload);
    if(!target){toast('참가자를 못 찾았어');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:`${esc(userName(target[0]))}님, 발언해주세요`,type:'system',command:'지목',createdAt:Date.now()});}
  else if(cmd==='투표'){if(!payload){toast('@투표 뒤에 질문');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'poll',command:'투표',pollVotes:{},createdAt:Date.now()});}
}
function castMeetingPollVote(mid,msgId,val){db.ref(`meetingMessages/${mid}/${msgId}/pollVotes/${currentUser.uid}`).set(val);}

  db.ref('duties/'+id).update({title,color}).then(()=>{toast('저장했어');closeModal();});

function deleteDuty(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('duties/'+id).remove().then(()=>toast('삭제했어'));}
function openAddMemberModal(id){
  const d=cache.duties[id];const already=d.memberIds||{};
  const opts=Object.entries(cache.users||{}).filter(([uid])=>!already[uid]);
  if(!opts.length){toast('추가할 멤버 없음');return;}
  openModal(`<h3>멤버 추가</h3>
    <select id="mAddMember">${opts.map(([uid,u])=>`<option value="${uid}">${esc(u.name)}</option>`).join('')}</select>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="addMember('${id}')">추가</button></div>`);
}
function addMember(id){if(!isAdmin())return;db.ref(`duties/${id}/memberIds/${g('mAddMember').value}`).set(true).then(()=>{toast('추가했어');closeModal();});}
function removeMember(id,uid){if(!isAdmin())return;db.ref(`duties/${id}/memberIds/${uid}`).remove().then(()=>toast('제거했어'));}

/* ── Settings ── */
function renderSettings(){
  if(!isAdmin()){g('pageContent').innerHTML=`<div class="card">${emptyDiv('관리자만 접근')}</div>`;return;}
  const polls=Object.entries(cache.polls||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const th=(cache.settings?.gradeThresholds)||{a:90,b:75,c:50};
  g('pageContent').innerHTML=`
    <div class="card"><h2>설문/투표 관리</h2>
      <table><thead><tr><th>질문</th><th>형식</th><th>참여</th><th>상태</th><th></th></tr></thead>
      <tbody>${polls.length?polls.map(([id,p])=>{
        const total=Object.keys(cache.pollVotes[id]||{}).length;
        return `<tr><td>${esc(p.question)}</td><td>${p.type==='ox'?'O/X':'객관식'}</td><td>${total}표</td>
          <td>${p.approved?(p.closed?'<span class="badge pending">마감</span>':'<span class="badge ok">진행중</span>'):'<span class="badge danger">대기</span>'}</td>
          <td>${!p.closed&&p.approved?`<button class="btn ghost small" onclick="closePoll('${id}')">마감</button>`:''} <button class="btn danger small" onclick="deletePoll('${id}')">삭제</button></td></tr>`;
      }).join(''):`<tr><td colspan="5" class="empty">없음</td></tr>`}</tbody></table>
    </div>
    <div class="card"><h2>⚙️ 고급 설정</h2>
      <div style="font-size:12px;color:var(--dim);margin-bottom:11px">O 득표율 기준 등급 경계값 (%)</div>
      <div class="grid3">
        <div class="field"><label>A 기준</label><input id="mThA" type="number" min="0" max="100" value="${th.a}"></div>
        <div class="field"><label>B 기준</label><input id="mThB" type="number" min="0" max="100" value="${th.b}"></div>
        <div class="field"><label>C 기준</label><input id="mThC" type="number" min="0" max="100" value="${th.c}"></div>
      </div>
      <div class="err-msg" id="mThErr"></div>
      <button class="btn small" onclick="submitThresholds()">저장</button>
    </div>`;
}
function submitThresholds(){
  if(!isAdmin())return;
  const a=Number(g('mThA').value),b=Number(g('mThB').value),c=Number(g('mThC').value),err=g('mThErr');err.textContent='';
  if([a,b,c].some(v=>isNaN(v)||v<0||v>100)){err.textContent='0~100 숫자';return;}
  if(!(a>b&&b>c)){err.textContent='A>B>C 순서';return;}
  db.ref('settings/gradeThresholds').set({a,b,c}).then(()=>toast('저장했어'));
}

/* ── AI ── */
const AI_INTENTS=[
  {keys:['안녕','hello','hi'],fn:()=>aiProse([`👋 ${esc(currentUser.name)}님! 뭐가 궁금해?`])},
  {keys:['요약','브리핑','전체','오늘'],fn:aiFullSummary},
  {keys:['민원'],fn:aiComplaints},
  {keys:['신청','승인'],fn:aiApplications},
  {keys:['임무','완료','체크'],fn:aiChecks},
  {keys:['투표','설문','동료'],fn:aiVoteStatus},
  {keys:['멤버','인원','명단'],fn:aiMembers},
  {keys:['공지'],fn:aiNotices},
  {keys:['회의'],fn:aiMeetings},
  {keys:['모둠'],fn:aiGroups},
  {keys:['도움','help','사용법'],fn:aiHelp},
];
function aiProse(lines){return `<div style="line-height:1.8;font-size:13.5px">${lines.join('<br>')}</div>`;}
function aiAnswer(text){
  const t=text.toLowerCase();
  const matched=AI_INTENTS.filter(i=>i.keys.some(k=>t.includes(k)));
  if(!matched.length)return aiProse([`"${esc(text)}"에 대한 정보를 못 찾았어. "도움말"을 입력해봐.`]);
  if(matched.length===1)return matched[0].fn();
  return matched.map(m=>m.fn()).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">');
}
function aiFullSummary(){
  const pCom=Object.values(cache.complaints||{}).filter(c=>c.status==='pending').length;
  const pApp=Object.values(cache.duties||{}).reduce((s,d)=>s+Object.values(d.applications||{}).filter(a=>a.status==='pending').length,0);
  const pPoll=Object.values(cache.polls||{}).filter(p=>!p.approved&&!p.closed).length;
  return aiProse([`📊 <b>전체 요약</b>`,`멤버 ${Object.keys(cache.users||{}).length}명 · 1인1역 ${Object.keys(cache.duties||{}).length}개`,
    pCom?`⚠️ 미처리 민원 <b>${pCom}건</b>`:'✅ 미처리 민원 없음',
    pApp?`📋 신청 승인 대기 <b>${pApp}건</b>`:'✅ 대기 신청 없음',
    pPoll?`📥 투표 승인 대기 <b>${pPoll}건</b>`:'✅ 대기 없음']);
}
function aiComplaints(){
  const p=Object.values(cache.complaints||{}).filter(c=>c.status==='pending');
  if(!p.length)return aiProse(['✅ 대기 중인 민원 없어.']);
  return aiProse([`⚠️ 대기 민원 <b>${p.length}건</b>`,...p.slice(0,5).map(c=>`· <b>${esc(c.title)}</b> — ${esc(userName(c.submittedBy))}`)]);
}
function aiApplications(){
  const rows=[];
  Object.entries(cache.duties||{}).forEach(([,d])=>Object.entries(d.applications||{}).filter(([,a])=>a.status==='pending').forEach(([uid])=>rows.push(`· <b>${esc(userName(uid))}</b> → ${esc(d.title)}`)));
  if(!rows.length)return aiProse(['📋 승인 대기 신청 없어.']);
  return aiProse([`📋 승인 대기 <b>${rows.length}건</b>`,...rows.slice(0,6)]);
}
function aiChecks(){
  const undone=[];
  myManagedDuties().forEach(([did,d])=>Object.keys(d.memberIds||{}).forEach(uid=>{if(!((cache.completions[did]||{})[uid]||{}).done)undone.push(`${esc(userName(uid))}(${esc(d.title)})`);}));
  if(!undone.length)return aiProse(['✅ 모든 임무 완료됨.']);
  return aiProse([`📝 미완료 <b>${undone.length}건</b>: ${undone.slice(0,5).join(', ')}${undone.length>5?` 외 ${undone.length-5}명`:''}`]);
}
function aiVoteStatus(){
  const active=Object.values(cache.polls||{}).filter(p=>p.approved&&!p.closed).length;
  const peer=Object.values(cache.peerEvals||{}).filter(p=>p.approved&&!p.closed).length;
  if(!active&&!peer)return aiProse(['현재 진행 중인 투표 없어.']);
  return aiProse([`🗳️ 진행 중: 설문 ${active}개, 동료평가 ${peer}개`]);
}
function aiMembers(){
  const total=Object.keys(cache.users||{}).length;
  const admins=Object.values(cache.users||{}).filter(u=>u.systemRole==='admin');
  return aiProse([`👥 전체 <b>${total}명</b> (관리자 ${admins.length}명)`]);
}
function aiNotices(){
  const list=Object.values(cache.notices||{});
  if(!list.length)return aiProse(['공지사항 없어.']);
  return aiProse([`📢 공지 <b>${list.length}건</b>`,...list.slice(0,3).map(n=>`· <b>${esc(n.title)}</b>`)]);
}
function aiMeetings(){
  const active=Object.values(cache.meetings||{}).filter(m=>m.status==='active');
  return aiProse([`💬 진행중 ${active.length}개`,...active.map(m=>`· <b>${esc(m.title)}</b>`)]);
}
function aiGroups(){
  const sets=Object.entries(cache.groupSets||{});
  if(!sets.length)return aiProse(['모둠 없어.']);
  return aiProse([`👥 모둠 <b>${sets.length}개</b>`,...sets.slice(0,3).map(([,s])=>`· ${esc(s.title)}`)]);
}
function aiHelp(){
  return aiProse(['💡 이런 걸 물어볼 수 있어:','· "오늘 요약해줘" — 전체 현황','· "민원 있어?" — 대기 민원','· "신청 현황" — 1인1역 신청','· "임무 완료율" — 체크 현황','· "투표 현황" — 진행중 투표']);
}
function aiSend(){
  const inp=g('aiChatInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  aiConversation.push({role:'user',text,ts:Date.now()});
  renderPage('ai');
  setTimeout(()=>{aiConversation.push({role:'ai',html:aiAnswer(text),ts:Date.now()});renderPage('ai');const wrap=g('aiChatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;},300);
}
function aiClear(){aiConversation=[];renderPage('ai');}
function renderAI(){
  if(!isAdmin()){g('pageContent').innerHTML=`<div class="card">${emptyDiv('관리자만 접근')}</div>`;return;}
  const chatHtml=aiConversation.map(m=>m.role==='user'
    ?`<div style="display:flex;justify-content:flex-end;margin-bottom:9px"><div style="background:var(--green);color:#fff;border-radius:15px 15px 4px 15px;padding:9px 13px;max-width:78%;font-size:13.5px">${esc(m.text)}</div></div>`
    :`<div style="display:flex;gap:8px;margin-bottom:9px"><div style="width:28px;height:28px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;flex-shrink:0">🤖</div><div style="background:var(--elev2);border:1px solid var(--border);border-radius:4px 15px 15px 15px;padding:9px 13px;max-width:82%;font-size:13.5px;line-height:1.7">${m.html||esc(m.text)}</div></div>`
  ).join('');
  g('pageContent').innerHTML=`
    <div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 170px);padding:0">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px">
        <div style="width:34px;height:34px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:16px">🤖</div>
        <div><div style="font-weight:800;font-size:14.5px">AI 브리핑</div><div style="font-size:11px;color:var(--green)">● 온라인</div></div>
        ${aiConversation.length?`<button class="btn ghost small" style="margin-left:auto" onclick="aiClear()">초기화</button>`:''}
      </div>
      <div id="aiChatWrap" style="flex:1;overflow-y:auto;padding:16px 14px">
        ${!aiConversation.length?`<div style="text-align:center;padding:30px 10px">
          <div style="font-size:30px;margin-bottom:10px">🤖</div>
          <div style="font-weight:800;font-size:15px;margin-bottom:6px">안녕! 뭐가 궁금해?</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
            ${['오늘 요약','민원 있어?','신청 현황','투표 현황','도움말'].map(q=>`<button class="btn ghost small" onclick="g('aiChatInput').value='${q}';aiSend()">${q}</button>`).join('')}
          </div></div>`:chatHtml}
      </div>
      <div style="padding:11px 14px;border-top:1px solid var(--border)">
        <div class="row"><input id="aiChatInput" placeholder="질문을 입력해봐..." style="flex:1" onkeydown="if(event.key==='Enter'){aiSend();}"><button class="btn small" onclick="aiSend()">전송</button></div>
      </div>
    </div>`;
  const wrap=g('aiChatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
}

/* ── Me ── */
function renderMe(){
  const u=cache.users[currentUser.uid]||{};
  g('pageContent').innerHTML=`
    <div class="card"><h2>내 정보</h2>
      <table><tbody>
        <tr><td style="width:90px;color:var(--dim)">이름</td><td>${esc(u.name)}</td></tr>
        <tr><td style="color:var(--dim)">이메일</td><td>${esc(u.email||'-')}</td></tr>
        <tr><td style="color:var(--dim)">전화</td><td>${esc(u.phone||'-')}</td></tr>
        <tr><td style="color:var(--dim)">권한</td><td>${u.systemRole==='admin'?'전체관리자':'멤버'}</td></tr>
      </tbody></table>
    </div>
    <div class="card"><h2>비밀번호 변경</h2>
      <div class="field"><label>현재 비밀번호</label><input id="mePwCur" type="password"></div>
      <div class="field"><label>새 비밀번호 (6자 이상)</label><input id="mePwNew" type="password"></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="mePwNew2" type="password"></div>
      <div class="err-msg" id="mePwErr"></div>
      <button class="btn small" onclick="submitChangePw()">변경</button>
    </div>`;
}
async function submitChangePw(){
  const cur=g('mePwCur').value,next=g('mePwNew').value,next2=g('mePwNew2').value,err=g('mePwErr');
  err.textContent='';
  const u=cache.users[currentUser.uid]||{};
  const curHash=await hashPw(cur);
  if(curHash!==u.password&&cur!==u.password){err.textContent='현재 비밀번호 오류';return;}
  if(next.length<6){err.textContent='6자 이상';return;}
  if(next!==next2){err.textContent='불일치';return;}
  const nextHash=await hashPw(next);
  db.ref('users/'+currentUser.uid+'/password').set(nextHash).then(()=>toast('변경했어'));
}

</script>
</body>
</html>
