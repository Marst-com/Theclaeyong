<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>1인1역</title>
<style>
/* ── 컬러 토큰 ── */
:root{
  --g0:#eafcf1; --g1:#d0f5e2; --g2:#1bb052; --g3:#15803d; --g4:#0f5c2b;
  --bg:#f0f4f2; --surface:#ffffff; --surface2:#f7faf8; --surface3:#edf3ef;
  --text:#111815; --text2:#4a5c52; --text3:#8fa898;
  --border:rgba(0,0,0,.07); --border2:rgba(0,0,0,.04);
  --red:#ff3b30; --red-bg:#fff1f0; --red-dim:#ffccc9;
  --orange:#ff9500; --blue:#007aff; --purple:#5856d6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.07);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sidebar-w:260px;
}
[data-theme=dark]{
  --bg:#0a0f0c; --surface:#141a16; --surface2:#1c2420; --surface3:#232e28;
  --text:#f0f5f2; --text2:#8fa898; --text3:#4a5c52;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,.3); --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --g0:#0d2218; --g1:#0f3020;
}

/* ── 리셋 ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);height:100%;overflow:hidden;
  font-size:14px;line-height:1.5;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r-sm);
  padding:11px 13px;font-size:14px;width:100%;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--g2);
  box-shadow:0 0 0 3px rgba(27,176,82,.15);
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* ── Auth 화면 ── */
.auth-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e8f8ef 0%,#d5f2e3 40%,#eef7f2 100%);
  padding:20px;z-index:100;
}
[data-theme=dark] .auth-screen{background:linear-gradient(135deg,#060d09,#0c1a12,#080f0b);}
.auth-card{
  width:100%;max-width:390px;
  background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  overflow:hidden;
  animation:slideUp .35s cubic-bezier(.22,.68,0,1.2);
}
.auth-header{
  padding:32px 28px 0;text-align:center;
}
.auth-icon{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,var(--g2),var(--g3));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  box-shadow:0 8px 24px rgba(27,176,82,.35);
}
.auth-icon svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.auth-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;}
.auth-sub{font-size:13.5px;color:var(--text2);margin-bottom:0;}
.auth-body{padding:24px 28px 28px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.2px;text-transform:uppercase;}
.err-msg{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px;white-space:pre-wrap;}
.pw-bar-wrap{height:3px;border-radius:2px;margin-top:5px;background:var(--surface3);overflow:hidden;}
#setupPwBar{height:100%;width:0%;transition:width .3s;}

/* ── 앱 레이아웃 ── */
.app{display:none;height:100vh;overflow:hidden;}
.app.active{display:flex;}

/* ── 사이드바 ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;overflow-x:hidden;
}
.sidebar-top{padding:20px 16px 12px;}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:10px 10px 16px;
}
.brand-icon{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--g2),var(--g3));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(27,176,82,.3);
}
.brand-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;}
.brand-sub{font-size:11px;color:var(--text3);font-weight:500;}
.nav-section{padding:18px 10px 4px;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-md);
  font-size:13.5px;font-weight:500;color:var(--text2);
  transition:all .15s;position:relative;
  margin:1px 6px;
}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{
  background:linear-gradient(135deg,var(--g2),var(--g3));
  color:#fff;font-weight:700;
  box-shadow:0 4px 12px rgba(27,176,82,.3);
}
.nav-item svg{
  width:17px;height:17px;flex-shrink:0;
  fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.nav-badge{
  background:var(--red);color:#fff;
  font-size:10px;font-weight:800;
  min-width:17px;height:17px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;margin-left:auto;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.3);color:#fff;}
.sidebar-foot{
  margin-top:auto;padding:12px 14px;
  border-top:1px solid var(--border);
}
.theme-toggle{
  display:flex;background:var(--surface2);border-radius:var(--r-sm);
  padding:3px;gap:2px;margin-bottom:10px;
}
.theme-toggle button{
  flex:1;padding:6px 0;border-radius:8px;
  font-size:11.5px;color:var(--text2);font-weight:500;
  transition:all .15s;
}
.theme-toggle button.active{
  background:var(--surface);color:var(--text);
  font-weight:700;box-shadow:var(--shadow-sm);
}
.user-chip{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:var(--r-md);
  background:var(--surface2);margin-bottom:8px;
}
.user-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--g2),var(--g3));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
}
.user-info .user-name{font-size:13px;font-weight:700;}
.user-info .user-role{font-size:11px;color:var(--text3);}

/* ── 메인 콘텐츠 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  padding:16px 28px 0;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.topbar-left h1{font-size:22px;font-weight:800;letter-spacing:-.4px;}
.topbar-left .page-sub{font-size:12.5px;color:var(--text3);margin-top:2px;}
.content{
  flex:1;overflow-y:auto;padding:16px 28px 40px;
}
.content > *{animation:fadeIn .2s ease;}

/* ── 카드 ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px 22px;
  margin-bottom:14px;box-shadow:var(--shadow-sm);
}
.card h2{
  font-size:14px;font-weight:700;
  color:var(--text2);text-transform:uppercase;letter-spacing:.3px;
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card h2 .h2-count{
  background:var(--surface2);color:var(--text3);
  font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:99px;
}

/* ── 버튼 ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 16px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:700;
  background:linear-gradient(135deg,var(--g2),var(--g3));
  color:#fff;border:none;
  box-shadow:0 2px 8px rgba(27,176,82,.3);
  transition:all .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(27,176,82,.4);}
.btn:active{transform:translateY(0);box-shadow:0 1px 4px rgba(27,176,82,.2);}
.btn.ghost{
  background:var(--surface2);color:var(--text);
  box-shadow:none;border:1px solid var(--border);
}
.btn.ghost:hover{background:var(--surface3);box-shadow:var(--shadow-sm);}
.btn.danger{
  background:linear-gradient(135deg,#ff4444,#cc2222);
  box-shadow:0 2px 8px rgba(255,59,48,.3);
}
.btn.danger:hover{box-shadow:0 4px 14px rgba(255,59,48,.4);}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn.full{width:100%;justify-content:center;}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;}

/* ── 배지 ── */
.badge{
  display:inline-flex;align-items:center;
  padding:3px 10px;border-radius:99px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.badge.ok{background:var(--g1);color:var(--g4);}
.badge.pending{background:var(--surface2);color:var(--text2);}
.badge.danger{background:var(--red-bg);color:var(--red);}
.badge.admin{background:#ede9ff;color:var(--purple);}
[data-theme=dark] .badge.admin{background:#1e1a3a;color:#a89cf7;}

/* ── 폼 요소 ── */
.row{display:flex;align-items:center;gap:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

/* ── 목록 아이템 ── */
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 4px;border-bottom:1px solid var(--border2);
}
.list-item:last-child{border-bottom:none;}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lname{font-size:13.5px;font-weight:600;flex:1;}
.empty{text-align:center;padding:32px 10px;color:var(--text3);font-size:13.5px;}

/* ── 테이블 ── */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);}
td{padding:10px 10px;border-bottom:1px solid var(--border2);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}

/* ── 정보 배너 ── */
.info-banner{
  background:linear-gradient(135deg,#eafcf1,#d5f2e3);
  border:1px solid var(--g1);border-radius:var(--r-md);
  padding:12px 16px;font-size:13px;color:var(--g4);
  margin-bottom:14px;line-height:1.6;
}
[data-theme=dark] .info-banner{background:var(--g0);color:#6ee89a;border-color:rgba(27,176,82,.2);}

/* ── 히어로 카드 ── */
.hero-card{
  border-radius:var(--r-xl);padding:24px 26px;margin-bottom:14px;
  background:linear-gradient(135deg,var(--g2) 0%,var(--g3) 60%,var(--g4) 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(27,176,82,.3);
}
.hero-card::before{
  content:'';position:absolute;top:-30px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero-card::after{
  content:'';position:absolute;bottom:-20px;right:40px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.hero-label{font-size:12px;font-weight:600;opacity:.8;margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase;}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.hero-sub{font-size:13px;opacity:.75;}

/* ── 알림 카드 ── */
.alert-card{
  border-radius:var(--r-lg);padding:16px 20px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-sm);
}
.alert-card.purple{background:linear-gradient(135deg,#7c3aed,var(--purple));color:#fff;}
.alert-card.green{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;}
.alert-card.warn{background:linear-gradient(135deg,#ff9f0a,#e67e00);color:#fff;}
.alert-icon{font-size:26px;flex-shrink:0;}
.alert-title{font-weight:800;font-size:14.5px;margin-bottom:2px;}
.alert-sub{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:7px;}
.alert-pill{background:rgba(255,255,255,.25);padding:2px 9px;border-radius:99px;font-weight:700;font-size:11.5px;}

/* ── 타일 그리드 ── */
.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.tile{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-align:center;position:relative;
  transition:all .18s cubic-bezier(.22,.68,0,1.2);
  box-shadow:var(--shadow-sm);
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.tile:active{transform:translateY(0);}
.tile-icon{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--g1),#c8f0d8);
}
[data-theme=dark] .tile-icon{background:linear-gradient(135deg,var(--g0),#0f2a1a);}
.tile-icon svg{width:22px;height:22px;stroke:var(--g2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tile-label{font-size:12px;font-weight:700;color:var(--text);letter-spacing:-.1px;}
.tile-badge{
  position:absolute;top:9px;right:11px;
  background:var(--red);color:#fff;
  font-size:9.5px;font-weight:800;
  min-width:16px;height:16px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;box-shadow:0 2px 6px rgba(255,59,48,.4);
}

/* ── 투표 카드 ── */
.peer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.peer-card{
  border:2px solid var(--border);border-radius:var(--r-md);
  padding:14px 10px;text-align:center;background:var(--surface);
  transition:all .15s;box-shadow:var(--shadow-sm);
}
.peer-card.voted-O{border-color:var(--g2);background:linear-gradient(135deg,#eafcf1,#d5f2e3);}
.peer-card.voted-X{border-color:var(--red);background:var(--red-bg);}
.peer-name{font-weight:700;font-size:13px;margin-bottom:10px;}
.ox-row{display:flex;gap:6px;}
.ox-btn{
  flex:1;padding:10px 0;border-radius:10px;
  font-size:18px;font-weight:900;
  border:2px solid var(--border);background:var(--surface2);
  color:var(--text);cursor:pointer;transition:all .15s;
}
.ox-btn:hover{transform:scale(1.05);}
.ox-btn.o-sel{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border-color:var(--g2);box-shadow:0 4px 12px rgba(27,176,82,.3);}
.ox-btn.x-sel{background:linear-gradient(135deg,#ff4444,#cc2222);color:#fff;border-color:var(--red);box-shadow:0 4px 12px rgba(255,59,48,.3);}

/* ── 채팅 ── */
.chat-wrap{
  display:flex;flex-direction:column;gap:8px;
  max-height:50vh;overflow-y:auto;
  padding:6px 2px;margin-bottom:12px;
}
.chat-mine{align-self:flex-end;max-width:76%;}
.chat-theirs{align-self:flex-start;max-width:76%;}
.chat-bubble-mine{
  background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;
  border-radius:18px 18px 5px 18px;padding:10px 14px;
  font-size:14px;line-height:1.5;
  box-shadow:0 2px 8px rgba(27,176,82,.25);
}
.chat-bubble-theirs{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
  border-radius:5px 18px 18px 18px;padding:10px 14px;
  font-size:14px;line-height:1.5;
}
.chat-sender{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600;}
.chat-time{font-size:10px;color:var(--text3);margin-top:4px;}
.chat-sys{
  padding:7px 16px;border-radius:99px;font-size:12.5px;font-weight:700;
  text-align:center;align-self:center;max-width:90%;
}
.chat-sys-conclude{background:var(--g1);color:var(--g4);}
.chat-sys-notice{background:#ede9ff;color:var(--purple);}
.chat-sys-mention{background:#fff3cd;color:#a0680a;}
.chat-sys-end{background:var(--surface2);color:var(--text2);}
.chat-poll-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px 14px;
  align-self:center;max-width:92%;
}
.chat-input-wrap{
  display:flex;gap:8px;align-items:center;
  background:var(--surface2);border-radius:var(--r-md);
  border:1px solid var(--border);padding:6px 6px 6px 12px;
}
.chat-input-wrap input{
  background:none;border:none;box-shadow:none;padding:4px 0;
  font-size:14px;
}
.chat-input-wrap input:focus{box-shadow:none;}

/* ── 모달 ── */
.modal-bg{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;
  z-index:900;padding:16px;
}
.modal-bg.show{display:flex;}
.modal{
  background:var(--surface);border-radius:var(--r-xl);
  border:1px solid var(--border);padding:24px;
  width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:slideUp .25s cubic-bezier(.22,.68,0,1.2);
}
.modal h3{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px;}
.modal-divider{height:1px;background:var(--border);margin:14px 0;}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:100px;right:20px;
  background:rgba(20,30,25,.92);backdrop-filter:blur(10px);
  color:#fff;padding:11px 18px;border-radius:var(--r-md);
  font-size:13.5px;font-weight:600;z-index:999;
  opacity:0;transform:translateY(8px) scale(.95);
  transition:all .22s cubic-bezier(.22,.68,0,1.2);
  pointer-events:none;border:1px solid rgba(255,255,255,.1);
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateY(0) scale(1);}

/* ── 하단 탭바 ── */
.bottom-nav{display:none;}

/* ── 반응형 ── */
@media(max-width:768px){
  .sidebar{display:none;}
  .app.active{flex-direction:column;}
  .topbar{padding:14px 16px 0;}
  .content{padding:12px 14px 100px;max-height:none;overflow-y:auto;}
  .tile-grid{grid-template-columns:repeat(3,1fr);}
  .grid2,.grid3{grid-template-columns:1fr;}
  .card{padding:16px 15px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(var(--surface),0.9);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:500;backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  .bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;color:var(--text3);font-weight:600;padding:2px 0;position:relative;
    transition:color .15s;
  }
  .bottom-nav button.active{color:var(--g2);}

/* ── 추가 UI polish ── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}

        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>

<!-- APP -->
<div class="app" id="app">
  <!-- 사이드바 -->
  <div class="sidebar">

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* =========================================================
   1인1역 관리 시스템 - app.js
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAbmpRUvrDbPdRASWNXv2N3DlDMWiUf7VA",
  authDomain: "theclaeyongkr.firebaseapp.com",
  databaseURL: "https://theclaeyongkr-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "theclaeyongkr",
  storageBucket: "theclaeyongkr.firebasestorage.app",
  messagingSenderId: "465244053974",
  appId: "1:465244053974:web:a24aa3e7defcb5b371c477"
};

let db = null, auth = null, dbReady = false;
try { firebase.initializeApp(firebaseConfig); db = firebase.database(); auth = firebase.auth(); dbReady = true; }
catch(e) { console.error('Firebase init failed', e); }

/* ── Cache ── */
const cache = {
  users:{}, duties:{}, completions:{},
  peerEvals:{}, peerEvalVotes:{},
  complaints:{}, notices:{}, polls:{}, pollVotes:{},
  memos:{}, groupSets:{}, meetings:{}, meetingMessages:{}, meetingModeratorVotes:{},
  settings:{ gradeThresholds:{ a:90, b:75, c:50 } }
};
let currentUser=null, currentPage='dashboard';
const expandedLists={};
let openMeetingId=null, activeMeetingListener=null;
let aiConversation=[];

/* ── Init ── */
window.addEventListener('DOMContentLoaded', init);

function init() {
  applyTheme(localStorage.getItem('theme')||'system');
  showScreen('loading');
  if (!dbReady) { setLoadMsg('Firebase 초기화 실패 — config를 확인해줘'); return; }
  const tout = setTimeout(() => setLoadMsg(
    '연결 초과. 확인:\n1) Firebase > Authentication > 익명 로그인 ON\n2) RTDB 규칙 ".read":true ".write":true\n3) 브라우저에서 직접 파일 열기 (클로드 미리보기 X)'), 12000);
  auth.signInAnonymously()
    .then(() => setLoadMsg('DB 로드 중...'))
    .catch(e => { clearTimeout(tout); setLoadMsg('익명 로그인 실패: ' + e.message + '\n→ Authentication > Sign-in method > 익명 켜줘'); });
  auth.onAuthStateChanged(user => {
    if (!user) return;
    clearTimeout(tout);
    db.ref('users').once('value').then(snap => {
      cache.users = snap.val() || {};
      const hasAdmin = Object.values(cache.users).some(u => u.systemRole === 'admin');
      const saved = JSON.parse(localStorage.getItem('session') || 'null');
      if (saved && saved.uid && cache.users[saved.uid]) {
        const u = cache.users[saved.uid];
        currentUser = { uid: saved.uid, name: u.name, systemRole: u.systemRole };
        startListeners(); enterApp(); return;
      }
      showScreen(hasAdmin ? 'login' : 'setup');
      startListeners();
    }).catch(e => { setLoadMsg('DB 읽기 실패: ' + e.message + '\n→ RTDB 규칙 ".read":"auth != null" 확인'); });
  });
}

function setLoadMsg(m) { const el=g('loadingMsg'); if(el) el.textContent=m; }
function showScreen(name) {
  ['loadingScreen','loginScreen','setupScreen'].forEach(id => {
    const el=g(id);
    if(!el) return;
    const show = id === name+'Screen';
    el.classList.toggle('hidden', !show);
    el.style.display = show ? '' : 'none';
  });
  g('app').classList.remove('active');
}
function enterApp() {
  // 모든 auth 화면 완전히 숨기기
  ['loadingScreen','loginScreen','setupScreen'].forEach(id=>{
    const el=g(id);
    if(el){ el.classList.add('hidden'); el.style.display='none'; }
  });
  g('app').classList.add('active');
  g('userChipName').textContent=currentUser.name;
  g('userChipRole').textContent=isAdmin()?'전체관리자':'멤버';
  const av=g('userAvatar'); if(av) av.textContent=currentUser.name.slice(0,1);
  syncThemeBtns(); buildNav(); renderPage('dashboard');
}
function startListeners() {
  const paths=['users','duties','completions','peerEvals','peerEvalVotes',
    'complaints','notices','polls','pollVotes','memos','groupSets',
    'meetings','meetingModeratorVotes','settings'];
  paths.forEach(path => db.ref(path).on('value', snap => {
    cache[path] = snap.val() || (path==='settings'?{gradeThresholds:{a:90,b:75,c:50}}:{});
    if (currentUser) { buildNav(); if(currentPage!=='ai') renderPage(currentPage); }
  }));
}
function subMeetingMsg(id) {
  if (activeMeetingListener) { db.ref('meetingMessages/'+activeMeetingListener).off(); activeMeetingListener=null; }
  if (!id) return;
  activeMeetingListener = id;
  db.ref('meetingMessages/'+id).on('value', snap => {
    cache.meetingMessages[id] = snap.val() || {};
    if (currentPage==='meetings' && openMeetingId===id) {
      const wrap=g('chatWrap');
      if (wrap && document.activeElement!==g('meetingInput')) {
        wrap.innerHTML = sortEntries(cache.meetingMessages[id]).map(([mid,m])=>chatMsgHtml(id,mid,m)).join('') || emptyDiv('메시지 없음');
        wrap.scrollTop = wrap.scrollHeight;
      }
    }
  });
}

/* ── Auth ── */
async function hashPw(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatPhone(el) {
  let v=el.value.replace(/\D/g,'').slice(0,11);
  el.value = v.length<=3?v:v.length<=7?v.slice(0,3)+'-'+v.slice(3):v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
}
function checkPwStrength(pw) {
  let s=0; if(pw.length>=6)s++; if(pw.length>=10)s++;
  if(/[A-Z]/.test(pw))s++; if(/[0-9]/.test(pw))s++; if(/[^A-Za-z0-9]/.test(pw))s++;
  const bar=g('setupPwBar');
  if(bar){bar.style.width=(s*20)+'%';bar.style.background=['#ef4444','#f59e0b','#eab308','#22c55e','#16a34a'][s-1]||'#ef4444';}
}
async function handleSetup() {
  const name=g('setupName').value.trim(), email=g('setupEmail').value.trim(),
        phone=g('setupPhone').value.trim(), pw=g('setupPw').value, pw2=g('setupPw2').value;
  const err=g('setupErr'); err.textContent='';
  if(!name){err.textContent='이름 입력';return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='이메일 형식 확인';return;}
  if(phone.replace(/\D/g,'').length<10){err.textContent='전화번호 확인';return;}
  if(pw.length<6){err.textContent='비밀번호 6자 이상';return;}
  if(pw!==pw2){err.textContent='비밀번호 불일치';return;}
  const hash=await hashPw(pw);
  const uid=db.ref('users').push().key;
  db.ref('users/'+uid).set({name,email,phone,password:hash,systemRole:'admin',createdAt:Date.now()})
    .then(()=>{currentUser={uid,name,systemRole:'admin'};localStorage.setItem('session',JSON.stringify({uid}));enterApp();})
    .catch(e=>{err.textContent='저장 실패: '+e.message;});
}
async function handleLogin() {
  const name=g('loginName').value.trim(), pw=g('loginPw').value;
  const err=g('loginErr'), btn=g('loginBtn'); err.textContent='';
  if(!name||!pw){err.textContent='이름과 비밀번호 입력';return;}
  if(btn) btn.textContent='확인 중...';
  const hash=await hashPw(pw);
  let users=cache.users;
  if(!Object.keys(users).length){const s=await db.ref('users').once('value');users=cache.users=s.val()||{};}
  let entry=Object.entries(users).find(([,u])=>u.name===name&&u.password===hash);
  if(!entry) entry=Object.entries(users).find(([,u])=>u.name===name&&u.password===pw);
  if(!entry){err.textContent='이름 또는 비밀번호 오류';if(btn)btn.textContent='로그인';return;}
  const [uid,u]=entry;
  if(u.password===pw) db.ref('users/'+uid+'/password').set(hash);
  currentUser={uid,name:u.name,systemRole:u.systemRole};
  localStorage.setItem('session',JSON.stringify({uid}));
  enterApp();
}
function handleLogout() {
  currentUser=null; localStorage.removeItem('session'); showScreen('login');
  g('loginName').value=''; g('loginPw').value='';
  const btn=g('loginBtn'); if(btn) btn.textContent='로그인';
}
/* ── Theme ── */
function setTheme(m){localStorage.setItem('theme',m);applyTheme(m);syncThemeBtns();}
function applyTheme(m){
  const dark=m==='system'?window.matchMedia('(prefers-color-scheme: dark)').matches:m==='dark';
  dark?document.documentElement.setAttribute('data-theme','dark'):document.documentElement.removeAttribute('data-theme');
}
function syncThemeBtns(){
  const m=localStorage.getItem('theme')||'system';
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===m));
}

/* ── Helpers ── */
const g=id=>document.getElementById(id);
const isAdmin=()=>currentUser?.systemRole==='admin';
const esc=s=>(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=msg=>{const t=g('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);};
const newKey=path=>db.ref(path).push().key;
const userName=uid=>(cache.users[uid]?.name)||'(삭제됨)';
const sortEntries=obj=>Object.entries(obj||{}).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
const emptyDiv=txt=>`<div class="empty">${esc(txt)}</div>`;
function myManagedDuties(){
  return isAdmin()?Object.entries(cache.duties||{}):
    Object.entries(cache.duties||{}).filter(([,d])=>d.managerIds?.[currentUser.uid]);
}
function dutyApps(did){return cache.duties[did]?.applications||{};}
function openModal(html){g('modalBody').innerHTML=html;g('modalBg').classList.add('show');}
function closeModal(){g('modalBg').classList.remove('show');}
document.addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function renderExpandable(key,items,limit=5){
  const exp=expandedLists[key];
  const shown=exp?items:items.slice(0,limit);
  let out=shown.join('');
  if(!exp&&items.length>limit) out+=`<button class="btn ghost small" style="margin-top:8px" onclick="toggleExpand('${key}')">더보기 (+${items.length-limit})</button>`;
  else if(exp&&items.length>limit) out+=`<button class="btn ghost small" style="margin-top:8px" onclick="toggleExpand('${key}')">접기</button>`;
  return out;
}
function toggleExpand(key){expandedLists[key]=!expandedLists[key];renderPage(currentPage);}

/* ── Nav ── */
const ICONS={
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  myDuties:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  vote:'<circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>',
  complaints:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  memos:'<path d="M4 4h16v12H7l-3 3V4z"/><path d="M8 9h8M8 12h5"/>',
  notices:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  apply:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4"/><path d="M19 8v6M22 11h-6"/>',
  groups:'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20v-1a5 5 0 0 1 5-5h2"/><path d="M14 14h2a5 5 0 0 1 5 5v1"/>',
  meetings:'<path d="M8 4H5a2 2 0 0 0-2 2v14l4-4h11a2 2 0 0 0 2-2V9"/>',
  checks:'<path d="M12 20v-6M6 20V10M18 20V4"/>',
  ai:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M3 12h3M18 12h3"/>',
  accounts:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>',
  duties:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v-1M16 4v-1"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>'
};
function svgIcon(id){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||''}</svg>`;}
function navBadge(id){
  if(id==='memos') return Object.values(cache.memos||{}).filter(m=>m.toUid===currentUser.uid&&!m.read).length;
  if(id==='vote'){
    const u=Object.entries(cache.polls||{}).filter(([pid,p])=>p.approved&&!p.closed&&!(cache.pollVotes[pid]||{})[currentUser.uid]).length;
    const p=isAdmin()?Object.values(cache.polls||{}).filter(p=>!p.approved&&!p.closed).length+Object.values(cache.peerEvals||{}).filter(p=>!p.approved&&!p.closed).length:0;
    return u+p;
  }
  if(id==='checks') return myManagedDuties().reduce((s,[did,d])=>s+Object.keys(d.memberIds||{}).filter(uid=>!((cache.completions[did]||{})[uid]||{}).done).length,0);
  if(id==='apply') return isAdmin()?Object.values(cache.duties||{}).reduce((s,d)=>s+Object.values(d.applications||{}).filter(a=>a.status==='pending').length,0):0;
  if(id==='notices'){const seen=Number(localStorage.getItem('noticesSeen')||0);return Object.values(cache.notices||{}).filter(n=>(n.createdAt||0)>seen).length;}
  return 0;
}
function navItems(){
  const all=[
    {id:'dashboard',label:'대시보드',sec:'메인'},
    {id:'myDuties',label:'내 1인1역',sec:'활동'},
    {id:'vote',label:'투표',sec:'활동'},
    {id:'complaints',label:'민원',sec:'활동'},
    {id:'memos',label:'메모함',sec:'활동'},
    {id:'notices',label:'공지사항',sec:'활동'},
    {id:'apply',label:'1인1역 신청',sec:'더보기'},
    {id:'groups',label:'모둠',sec:'더보기'},
    {id:'meetings',label:'회의',sec:'더보기'},
  ];
  if(myManagedDuties().length) all.push({id:'checks',label:'임무 확인',sec:'더보기'});
  if(isAdmin()) all.push(
    {id:'ai',label:'AI 브리핑',sec:'관리자'},
    {id:'accounts',label:'계정 관리',sec:'관리자'},
    {id:'duties',label:'1인1역 관리',sec:'관리자'},
    {id:'settings',label:'설정',sec:'관리자'}
  );
  all.push({id:'me',label:'내 정보',sec:'계정'});
  return all;
}
function buildNav(){
  const items=navItems(); let lastSec='',html='';
  items.forEach(it=>{
    if(it.sec!==lastSec){html+=`<div class="nav-sec">${esc(it.sec)}</div>`;lastSec=it.sec;}
    const n=navBadge(it.id);
    html+=`<button class="nav-item${it.id===currentPage?' active':''}" onclick="renderPage('${it.id}')">
      ${svgIcon(it.id)}<span>${esc(it.label)}</span>${n>0?`<span class="nav-badge">${n}</span>`:''}
    </button>`;
  });
  g('navItems').innerHTML=html;
  const primary=items.slice(0,4), rest=items.slice(4);
  const restN=rest.reduce((s,it)=>s+navBadge(it.id),0);
  g('bottomNav').innerHTML=primary.map(it=>{const n=navBadge(it.id);return `<button class="${it.id===currentPage?'active':''}" onclick="renderPage('${it.id}')">${svgIcon(it.id)}${esc(it.label)}${n?`<span class="bn-badge">${n}</span>`:''}</button>`;}).join('')
    +(rest.length?`<button onclick="openMoreMenu()">${svgIcon('settings')}더보기${restN?`<span class="bn-badge">${restN}</span>`:''}</button>`:'');
}
function openMoreMenu(){
  openModal(`<h3>더보기</h3><div style="display:flex;flex-direction:column;gap:6px">
    ${navItems().slice(4).map(it=>`<button class="nav-item" style="background:var(--surface2)" onclick="closeModal();renderPage('${it.id}')">${svgIcon(it.id)}<span>${esc(it.label)}</span>${navBadge(it.id)?`<span class="nav-badge">${navBadge(it.id)}</span>`:''}</button>`).join('')}
  </div>`);
}

/* ── Router ── */
const PAGE_TITLES={
  dashboard:['대시보드','전체 현황'],myDuties:['내 1인1역','맡은 역할'],
  vote:['투표','투표 참여/생성'],complaints:['민원','민원 제기/관리'],
  memos:['메모함','받은 메모'],notices:['공지사항','전체 공지'],
  apply:['1인1역 신청','역할 신청'],groups:['모둠','모둠 편성'],
  meetings:['회의','회의 진행'],checks:['임무 확인','완료 체크'],
  ai:['AI 브리핑','현황 질의'],accounts:['계정 관리','멤버 계정'],
  duties:['1인1역 관리','역할 관리'],settings:['설정','시스템 설정'],me:['내 정보','계정']
};
function renderPage(id){
  currentPage=id; buildNav();
  g('topbarActions').innerHTML='';
  const [title,sub]=PAGE_TITLES[id]||[id,''];
  g('pageTitle').textContent=title; g('pageSub').textContent=sub;
  ({dashboard:renderDashboard,myDuties:renderMyDuties,vote:renderVote,complaints:renderComplaints,
    memos:renderMemos,notices:renderNotices,apply:renderApply,groups:renderGroups,
    meetings:renderMeetings,checks:renderChecks,ai:renderAI,accounts:renderAccounts,
    duties:renderDuties,settings:renderSettings,me:renderMe}[id]||renderDashboard)();
}

/* ── Dashboard ── */

  const tiles=['myDuties','vote','complaints','memos','meetings',

    <div style="padding:11px 0;border-bottom:1px solid var(--border2);cursor:pointer" onclick="renderPage('notices')">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        ${n.pinned?`<span style="font-size:10px;background:var(--g1);color:var(--g4);padding:1px 6px;border-radius:99px;font-weight:700">📌 고정</span>`:''}
        <span style="font-weight:700;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.title)}</span>
      </div>
      <div style="font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.content)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">${n.createdAt?new Date(n.createdAt).toLocaleDateString('ko-KR'):''}</div>
    </div>`).join(''):`<div class="empty" style="padding:20px 0">공지사항 없음</div>`;

  const totalMembers=Object.keys(cache.users||{}).length;
  const totalDuties=Object.keys(cache.duties||{}).length;
  const pendingComplaints=Object.values(cache.complaints||{}).filter(c=>c.status==='pending').length;

  g('pageContent').innerHTML=`
    <div class="dash-grid" style="display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start">
      <!-- 왼쪽: 메인 콘텐츠 -->
      <div>
        <!-- 히어로 -->
        <div class="hero-card" style="margin-bottom:14px">
          <div class="hero-label">1인1역 관리 시스템</div>
          <div class="hero-name" style="margin-bottom:8px">👋 ${esc(currentUser.name)}님</div>
          <div style="font-size:13px;opacity:.75">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>
        </div>

        <!-- 통계 -->
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-label">전체 멤버</div>
            <div class="stat-val">${totalMembers}</div>
            <div class="stat-sub">명 등록됨</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">1인1역</div>
            <div class="stat-val">${totalDuties}</div>
            <div class="stat-sub">개 운영 중</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">미처리 민원</div>
            <div class="stat-val" style="color:${pendingComplaints>0?'var(--red)':'var(--g2)'}">${pendingComplaints}</div>
            <div class="stat-sub">${pendingComplaints>0?'처리 필요':'모두 완료'}</div>
          </div>
        </div>

        ${todo>0
          ?`<div class="alert-card purple" style="margin-bottom:14px"><span class="alert-icon">📌</span><div><div class="alert-title">할 일이 있어요!</div><div class="alert-sub">확인 필요 항목 <span class="alert-pill">${todo}개</span></div></div></div>`
          :`<div class="alert-card green" style="margin-bottom:14px"><span class="alert-icon">🎉</span><div><div class="alert-title">오늘 할 일 완료!</div><div class="alert-sub">수고했어요</div></div></div>`}

        <!-- 타일 -->
        <div class="tile-grid" style="margin-bottom:14px">${tiles.map(id=>{
          const n=navBadge(id),[label]=PAGE_TITLES[id]||[id];
          return `<button class="tile" onclick="renderPage('${id}')">
            ${n?`<span class="tile-badge">${n}</span>`:''}
            <span class="tile-icon">${svgIcon(id)}</span>
            <span class="tile-label">${esc(label)}</span>

        <!-- 임무 현황 -->
        ${listTitle?`<div class="card"><h2>${esc(listTitle)}</h2>${listHtml}</div>`:''}

          </h2>

/* ── Vote ── */
function renderVote(){
  const activePolls=Object.entries(cache.polls||{}).filter(([,p])=>p.approved&&!p.closed).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const pendingPolls=Object.entries(cache.polls||{}).filter(([,p])=>!p.approved&&!p.closed);
  const activePeer=Object.entries(cache.peerEvals||{}).filter(([,p])=>p.approved&&!p.closed);
  const pendingPeer=Object.entries(cache.peerEvals||{}).filter(([,p])=>!p.approved&&!p.closed);

  const pollsHtml=activePolls.map(([pid,p])=>{
    const votes=cache.pollVotes[pid]||{},my=votes[currentUser.uid];
    const tally={};Object.values(votes).forEach(v=>tally[v]=(tally[v]||0)+1);
    const total=Object.values(votes).length;
    let ui;
    if(p.type==='ox'){
      ui=`<div style="display:flex;gap:10px;max-width:250px">
        ${['O','X'].map(v=>`<button onclick="castPollVote('${pid}','${v}')" style="flex:1;padding:16px 0;border-radius:14px;font-size:22px;font-weight:900;border:3px solid ${my===v?(v==='O'?'var(--g2)':'var(--red)'):'var(--border)'};background:${my===v?(v==='O'?'var(--g2)':'var(--red)'):'var(--surface2)'};color:${my===v?'#fff':'var(--text)'};cursor:pointer">${v}<br><span style="font-size:11px">${tally[v]||0}표</span></button>`).join('')}
      </div>`;
    } else {
      ui=`<div style="display:flex;flex-direction:column;gap:7px">${(p.options||[]).map((opt,i)=>{
        const key=String(i),sel=my===key,cnt=tally[key]||0,pct=total?Math.round(cnt/total*100):0;
        return `<button onclick="castPollVote('${pid}','${key}')" style="text-align:left;padding:11px 13px;border-radius:13px;border:2px solid ${sel?'var(--g2)':'var(--border)'};background:${sel?'var(--g0)':'var(--surface2)'};cursor:pointer;position:relative;overflow:hidden">
          <div style="position:absolute;inset:0;width:${pct}%;background:${sel?'var(--g1)':'var(--surface3)'};opacity:.5"></div>
          <div style="position:relative;display:flex;justify-content:space-between"><span style="font-weight:700">${i+1}. ${esc(opt)}</span><span style="font-size:11.5px;color:var(--text2)">${cnt}표 (${pct}%)</span></div>
        </button>`;
      }).join('')}</div>`;
    }
    return `<div class="card"><h2>📋 ${esc(p.question)} <span style="color:var(--text2);font-size:12px">· ${total}표</span></h2>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">작성자: ${esc(userName(p.createdBy))}</div>
      ${ui}
      ${isAdmin()?`<div style="margin-top:10px;display:flex;gap:6px"><button class="btn ghost small" onclick="closePoll('${pid}')">마감</button><button class="btn danger small" onclick="deletePoll('${pid}')">삭제</button></div>`:''}
    </div>`;
  }).join('');

  const peerHtml=activePeer.map(([eid,ev])=>{
    const others=Object.entries(cache.users||{}).filter(([uid])=>uid!==currentUser.uid);
    const myVotes=(cache.peerEvalVotes[eid]||{})[currentUser.uid]||{};
    const prog=others.filter(([uid])=>myVotes[uid]).length;
    return `<div class="card"><h2>🗳️ ${esc(ev.question)}</h2>
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px"><span>내 투표 진행</span><span>${prog}/${others.length}</span></div>
        <div style="height:7px;border-radius:99px;background:var(--surface3);overflow:hidden"><div style="height:100%;width:${others.length?Math.round(prog/others.length*100):0}%;background:var(--g2)"></div></div>
      </div>
      <div class="peer-grid">${others.map(([uid,u])=>{
        const my=myVotes[uid];
        return `<div class="peer-card ${my==='O'?'voted-O':my==='X'?'voted-X':''}">
          <div class="peer-name">${esc(u.name)}</div>
          <div class="ox-row">
            <button class="ox-btn ${my==='O'?'o-sel':''}" onclick="castPeerVote('${eid}','${uid}','O')">O</button>
            <button class="ox-btn ${my==='X'?'x-sel':''}" onclick="castPeerVote('${eid}','${uid}','X')">X</button>
          </div></div>`;
      }).join('')}</div>
      ${isAdmin()?`<div style="margin-top:10px;display:flex;gap:6px"><button class="btn ghost small" onclick="closePeerEval('${eid}')">마감</button><button class="btn danger small" onclick="deletePeerEval('${eid}')">삭제</button></div>`:''}
    </div>`;
  }).join('');

  const approvalHtml=isAdmin()&&(pendingPolls.length||pendingPeer.length)?`
    <div class="card"><h2>📥 승인 대기 <span style="color:var(--text2);font-size:12px">· ${pendingPolls.length+pendingPeer.length}건</span></h2>
      ${[...pendingPolls.map(([id,p])=>({id,p,type:'poll'})),...pendingPeer.map(([id,p])=>({id,p,type:'peer'}))].map(({id,p,type})=>`
        <div class="list-item"><span class="ldot" style="background:#4f46e5"></span>
          <span class="lname">${esc(p.question)} <span style="color:var(--text2);font-size:11px">· ${type==='peer'?'동료평가':p.type==='ox'?'O/X':'객관식'} · ${esc(userName(p.createdBy))}</span></span>
          <button class="btn small" onclick="${type==='peer'?'approvePeer':'approvePoll'}('${id}')">승인</button>
          <button class="btn danger small" onclick="${type==='peer'?'deletePeerEval':'deletePoll'}('${id}')">거절</button>
        </div>`).join('')}
    </div>`:'' ;

  g('pageContent').innerHTML=`
    <div class="info-banner">📊 투표에 참여하거나 새 투표를 만들 수 있어. 관리자 승인 후 공개돼.</div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="openCreatePollModal()">+ 투표 만들기</button>
      ${isAdmin()?`<button class="btn ghost small" onclick="openCreatePeerModal()">+ 동료평가 (관리자)</button>`:''}
    </div></div>
    ${approvalHtml}
    ${pollsHtml||peerHtml?pollsHtml+peerHtml:`<div class="card">${emptyDiv('진행 중인 투표 없음. 위에서 만들어봐!')}</div>`}`;
}
function castPollVote(pid,ans){db.ref(`pollVotes/${pid}/${currentUser.uid}`).set(ans).then(()=>toast('투표했어'));}
function castPeerVote(eid,uid,val){db.ref(`peerEvalVotes/${eid}/${currentUser.uid}/${uid}`).set(val).then(()=>toast('투표했어'));}
function approvePoll(id){if(!isAdmin())return;db.ref(`polls/${id}/approved`).set(true).then(()=>toast('승인했어'));}
function approvePeer(id){if(!isAdmin())return;db.ref(`peerEvals/${id}/approved`).set(true).then(()=>toast('승인했어'));}
function closePoll(id){if(!isAdmin())return;db.ref(`polls/${id}/closed`).set(true).then(()=>toast('마감했어'));}
function deletePoll(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('polls/'+id).remove().then(()=>db.ref('pollVotes/'+id).remove()).then(()=>toast('삭제했어'));}
function closePeerEval(id){if(!isAdmin())return;db.ref(`peerEvals/${id}/closed`).set(true).then(()=>toast('마감했어'));}
function deletePeerEval(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('peerEvals/'+id).remove().then(()=>db.ref('peerEvalVotes/'+id).remove()).then(()=>toast('삭제했어'));}
function openCreatePollModal(){
  openModal(`<h3>투표 만들기</h3>
    <div class="field"><label>질문</label><input id="mPQ" placeholder="예: 행사 장소는?"></div>
    <div class="field"><label>형식</label>
      <select id="mPT" onchange="g('mPOptWrap').classList.toggle('hidden',this.value==='ox')">
        <option value="ox">O / X</option><option value="choice">객관식</option>
      </select></div>
    <div id="mPOptWrap" class="field hidden"><label>선택지 (한 줄에 하나)</label><textarea id="mPOpts" rows="3" placeholder="선택지1&#10;선택지2"></textarea></div>
    <div class="err-msg" id="mPErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitCreatePoll()">만들기</button></div>`);
}
async function submitCreatePoll(){
  const q=g('mPQ').value.trim(),type=g('mPT').value,err=g('mPErr');err.textContent='';
  if(!q){err.textContent='질문 입력';return;}
  let options=[];
  if(type==='choice'){options=g('mPOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);if(options.length<2){err.textContent='선택지 2개 이상';return;}}
  db.ref('polls/'+newKey('polls')).set({question:q,type,options,createdBy:currentUser.uid,createdAt:Date.now(),closed:false,approved:isAdmin()})
    .then(()=>{toast(isAdmin()?'투표 만들었어':'신청했어. 관리자 승인 후 공개돼.');closeModal();});
}
function openCreatePeerModal(){
  if(!isAdmin()){toast('권한 없어');return;}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  g('topbarActions').innerHTML=isAdmin()?`<button class="btn small" onclick="openCreateGroupModal()">+ 모둠 만들기</button>`:'';
  g('pageContent').innerHTML=sets.length?sets.map(([sid,s])=>`

      ${isAdmin()?`<span style="margin-left:auto;display:flex;gap:5px">
        <button class="btn ghost small" onclick="reshuffleGroup('${sid}')">다시 섞기</button>
        <button class="btn danger small" onclick="deleteGroup('${sid}')">삭제</button>
      </span>`:''}
    </h2>
    <div class="grid3">${Object.entries(s.groups||{}).map(([,grp])=>{
      const members=Object.keys(grp.memberIds||{});const iAm=members.includes(currentUser.uid);
      return `<div style="border:1px solid var(--border);border-radius:13px;padding:11px;${iAm?'background:var(--g0)':''}">
        <div style="font-weight:800;font-size:13px;margin-bottom:7px">${esc(grp.name)}${iAm?' · 내 모둠':''}</div>
        ${members.map(uid=>`<div style="font-size:12.5px;margin-bottom:3px">${esc(userName(uid))}</div>`).join('')||'<div style="color:var(--text2);font-size:12px">없음</div>'}
      </div>`;
    }).join('')}</div></div>`).join(''):`<div class="card">${emptyDiv('모둠 없음')}</div>`;
}
function openCreateGroupModal(){
  openModal(`<h3>모둠 만들기</h3>
    <div class="field"><label>제목</label><input id="mGTitle" placeholder="예: 체육대회 모둠"></div>
    <div class="field"><label>모둠 개수</label><input id="mGCount" type="number" min="2" max="20" value="4"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitCreateGroup()">만들고 자동 배정</button></div>`);
}
function submitCreateGroup(){
  if(!isAdmin())return;
  const title=g('mGTitle').value.trim(),count=Number(g('mGCount').value);
  if(!title){toast('제목 입력');return;}if(count<2||count>20){toast('2~20');return;}
  const groups={};for(let i=1;i<=count;i++)groups[String(i)]={name:`${i}모둠`,memberIds:{}};
  const shuffled=shuffle(Object.keys(cache.users||{}));
  shuffled.forEach((uid,idx)=>{groups[String((idx%count)+1)].memberIds[uid]=true;});
  db.ref('groupSets/'+newKey('groupSets')).set({title,createdAt:Date.now(),createdBy:currentUser.uid,groups})
    .then(()=>{toast('모둠 만들었어');closeModal();});
}
function reshuffleGroup(sid){
  if(!isAdmin())return;const s=cache.groupSets[sid];if(!s)return;
  const gids=Object.keys(s.groups||{});if(!gids.length)return;
  const newGrps={};gids.forEach(gid=>newGrps[gid]={name:s.groups[gid].name,memberIds:{}});
  shuffle(Object.keys(cache.users||{})).forEach((uid,i)=>newGrps[gids[i%gids.length]].memberIds[uid]=true);
  db.ref(`groupSets/${sid}/groups`).set(newGrps).then(()=>toast('다시 섞었어'));
}
function deleteGroup(sid){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('groupSets/'+sid).remove().then(()=>toast('삭제했어'));}

function renderMeetingDetail(id){

  const isPart=m.participantIds?.[currentUser.uid];

      </div>`;
    } else {
      const votes=cache.meetingModeratorVotes[id]||{},myV=votes[currentUser.uid];

      setupHtml=`<div class="card"><h2>사회자 투표</h2>
        ${isPart?`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px">
          ${parts.map(uid=>`<button class="btn ${myV===uid?'':'ghost'} small" onclick="castModVote('${id}','${uid}')">${esc(userName(uid))} (${tally[uid]||0})</button>`).join('')}

      </div>`;
    }
  }
  const msgs=sortEntries(cache.meetingMessages[id]||{});
  const chatHtml=(m.status==='active'||m.status==='ended')?`<div class="card">
    <h2>💬 채팅${m.moderatorUid?` · 사회자: ${esc(userName(m.moderatorUid))}`:''}</h2>
    ${m.conclusion?`<div style="background:var(--g1);color:var(--g3);padding:8px 13px;border-radius:11px;font-weight:700;margin-bottom:10px">✅ 결론: ${esc(m.conclusion.text)}</div>`:''}

    ${m.status==='active'&&isPart?`
      ${isMod?`<div style="font-size:11px;color:var(--text2);margin-bottom:5px">사회자 명령어: @결론 @공지 @투표 @지목 @종료</div>`:''}
      <div class="row"><input id="meetingInput" placeholder="메시지..." style="flex:1" onkeydown="if(event.key==='Enter'){sendMsg('${id}');event.preventDefault();}"><button class="btn small" onclick="sendMsg('${id}')">전송</button></div>`
    :`<div class="empty">${m.status==='ended'?'회의 종료':'참가자만 채팅 가능'}</div>`}
  </div>`:'';
  g('pageContent').innerHTML=`
    <button class="btn ghost small" style="margin-bottom:11px" onclick="leaveMeeting()">← 목록</button>
    <div class="card"><h2>${esc(m.title)} <span class="badge ${m.status==='active'?'ok':'pending'}" style="margin-left:auto">${m.status==='setup'?'준비중':m.status==='active'?'진행중':'종료'}</span></h2>
      <div style="font-size:12px;color:var(--text2)">참가자: ${parts.map(uid=>esc(userName(uid))).join(', ')}</div>
    </div>${setupHtml}${chatHtml}`;
  const wrap=g('chatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
}
function chatMsgHtml(mid,msgId,msg){
  const mine=msg.uid===currentUser.uid;
  const time=msg.createdAt?new Date(msg.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  if(msg.type==='system'){
    const cls={결론:'chat-sys-conclude',공지:'chat-sys-notice',지목:'chat-sys-mention',종료:'chat-sys-end'}[msg.command]||'chat-sys-end';
    const em={결론:'✅',공지:'📢',지목:'👋',종료:'🔚'}[msg.command]||'💬';
    return `<div class="chat-sys ${cls}">${em} ${esc(msg.text)}</div>`;
  }
  if(msg.type==='poll'){
    const votes=msg.pollVotes||{},my=votes[currentUser.uid];
    const oC=Object.values(votes).filter(v=>v==='O').length,xC=Object.values(votes).filter(v=>v==='X').length;
    return `<div class="chat-poll-card">
      <div style="font-weight:700;margin-bottom:7px">📊 ${esc(msg.text)}</div>
      <div style="display:flex;gap:8px;max-width:200px">
        <button class="ox-btn ${my==='O'?'o-sel':''}" onclick="castMeetingPollVote('${mid}','${msgId}','O')">O (${oC})</button>
        <button class="ox-btn ${my==='X'?'x-sel':''}" onclick="castMeetingPollVote('${mid}','${msgId}','X')">X (${xC})</button>
      </div></div>`;
  }
  if(mine) return `<div class="chat-mine"><div class="chat-bubble-mine">${esc(msg.text)}</div><div class="chat-time" style="text-align:right">${time}</div></div>`;
  return `<div class="chat-theirs"><div><div class="chat-sender">${esc(userName(msg.uid))}</div><div class="chat-bubble-theirs">${esc(msg.text)}</div><div class="chat-time">${time}</div></div></div>`;
}
function assignModerator(mid,uid){if(!isAdmin())return;db.ref(`meetings/${mid}`).update({moderatorUid:uid,status:'active'}).then(()=>toast('사회자 지정, 시작!'));}
function castModVote(mid,uid){db.ref(`meetingModeratorVotes/${mid}/${currentUser.uid}`).set(uid).then(()=>toast('투표했어'));}
function finalizeModVote(mid){
  if(!isAdmin())return;
  const votes=cache.meetingModeratorVotes[mid]||{};
  const tally={};Object.values(votes).forEach(c=>tally[c]=(tally[c]||0)+1);
  const entries=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){toast('투표 없음');return;}
  db.ref(`meetings/${mid}`).update({moderatorUid:entries[0][0],status:'active'}).then(()=>toast(userName(entries[0][0])+'님 사회자 확정!'));
}
const MEETING_CMDS=['결론','공지','종료','지목','투표'];
function sendMsg(mid){
  const inp=g('meetingInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  const m=cache.meetings[mid];if(!m||m.status!=='active'){toast('종료된 회의');return;}
  const isMod=m.moderatorUid===currentUser.uid;
  const match=text.match(/^@(\S+)\s*([\s\S]*)$/);
  if(isMod&&match&&MEETING_CMDS.includes(match[1])){handleMeetingCmd(mid,match[1],match[2].trim());}
  else{db.ref(`meetingMessages/${mid}/`+newKey(`meetingMessages/${mid}`)).set({uid:currentUser.uid,text,type:'message',createdAt:Date.now()});}
  inp.value='';inp.focus();
}
function handleMeetingCmd(mid,cmd,payload){
  const id=newKey(`meetingMessages/${mid}`);
  if(cmd==='결론'){if(!payload){toast('@결론 뒤에 내용');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'system',command:'결론',createdAt:Date.now()});
    db.ref(`meetings/${mid}`).update({conclusion:{text:payload,decidedAt:Date.now()},status:'ended'});}
  else if(cmd==='공지'){if(!payload){toast('@공지 뒤에 내용');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'system',command:'공지',createdAt:Date.now()});}
  else if(cmd==='종료'){
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:'회의가 종료됐어요',type:'system',command:'종료',createdAt:Date.now()});
    db.ref(`meetings/${mid}/status`).set('ended');}
  else if(cmd==='지목'){
    const target=Object.entries(cache.users||{}).find(([,u])=>u.name===payload);
    if(!target){toast('참가자를 못 찾았어');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:`${esc(userName(target[0]))}님, 발언해주세요`,type:'system',command:'지목',createdAt:Date.now()});}
  else if(cmd==='투표'){if(!payload){toast('@투표 뒤에 질문');return;}
    db.ref(`meetingMessages/${mid}/${id}`).set({uid:currentUser.uid,text:payload,type:'poll',command:'투표',pollVotes:{},createdAt:Date.now()});}
}
function castMeetingPollVote(mid,msgId,val){db.ref(`meetingMessages/${mid}/${msgId}/pollVotes/${currentUser.uid}`).set(val);}

function switchAccTab(tab){
  document.getElementById('accTabSingle').className = tab==='single'?'btn small':'btn ghost small';

  document.getElementById('accPanelSingle').classList.toggle('hidden', tab!=='single');
  document.getElementById('accPanelBulk').classList.toggle('hidden', tab!=='bulk');
}

function updateBulkPreview(){
  const prefix = (document.getElementById('mBulkPrefix')?.value||'').trim();
  const start = Number(document.getElementById('mBulkStart')?.value||1);
  const end = Number(document.getElementById('mBulkEnd')?.value||24);
  const pad = Number(document.getElementById('mBulkPad')?.value||2);
  const preview = document.getElementById('mBulkPreview');
  if(!preview) return;
  if(!prefix){ preview.textContent='접두사를 입력해줘'; return; }
  if(start>end){ preview.textContent='시작 번호가 끝 번호보다 클 수 없어'; return; }
  if(end-start>99){ preview.textContent=`계정이 ${end-start+1}개야. 100개 이하로 해줘`; return; }
  const names = [];
  for(let i=start;i<=end;i++) names.push(prefix + String(i).padStart(pad,'0'));
  const shown = names.slice(0,3);
  const more = names.length>3 ? ` ... ${names[names.length-1]}` : '';
  preview.innerHTML = `✅ ${names.length}개 계정 생성 예정<br>${shown.join(', ')}${more}<br><span style="opacity:.7">비밀번호: 계정명과 동일 (예: ${shown[0]})</span>`;
}

async function submitBulkAccounts(){
  if(!isAdmin()){toast('권한 없어');return;}
  const prefix=(document.getElementById('mBulkPrefix')?.value||'').trim();
  const start=Number(document.getElementById('mBulkStart')?.value||1);
  const end=Number(document.getElementById('mBulkEnd')?.value||24);
  const pad=Number(document.getElementById('mBulkPad')?.value||2);
  const role=document.getElementById('mBulkRole')?.value||'user';
  const err=document.getElementById('mBulkErr'); err.textContent='';
  if(!prefix){err.textContent='접두사 입력해줘';return;}
  if(start>end){err.textContent='시작 번호 확인';return;}
  if(end-start>99){err.textContent='100개 이하로 해줘';return;}
  const btn=document.querySelector('#accPanelBulk .btn:not(.ghost)');
  if(btn) btn.textContent='생성 중...';
  const names=[];
  for(let i=start;i<=end;i++) names.push(prefix+String(i).padStart(pad,'0'));
  let ok=0;
  for(const name of names){
    if(Object.values(cache.users).some(u=>u.name===name)) continue;
    const hash=await hashPw(name);
    await db.ref('users/'+newKey('users')).set({name,password:hash,systemRole:role,createdAt:Date.now()});
    ok++;
  }
  toast(`${ok}개 계정 만들었어! (중복 ${names.length-ok}개 제외)`);
  closeModal();
}

async function submitCreateAccount(){

  const name=g('mAccName').value.trim(),pw=g('mAccPw').value,role=g('mAccRole').value,err=g('mAccErr');

  db.ref('users/'+newKey('users')).set({name,password:hash,systemRole:role,createdAt:Date.now()})
    .then(()=>{toast('계정 만들었어');closeModal();});
}

    <div class="field"><label>타이틀</label><input id="mDTitle" placeholder="예: 칠판 관리"></div>
    <div class="field"><label>색상</label><input id="mDColor" type="color" value="#1bb052"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitCreateDuty()">만들기</button></div>`);
}
function submitCreateDuty(){
  if(!isAdmin())return;
  const title=g('mDTitle').value.trim(),color=g('mDColor').value;
  if(!title){toast('제목 입력');return;}
  db.ref('duties/'+newKey('duties')).set({title,color,memberIds:{},managerIds:{},applications:{}})
    .then(()=>{toast('만들었어');closeModal();});
}
function openEditDutyModal(id){
  const d=cache.duties[id];
  openModal(`<h3>역할 편집</h3>
    <div class="field"><label>타이틀</label><input id="mDTitle2" value="${esc(d.title)}"></div>
    <div class="field"><label>색상</label><input id="mDColor2" type="color" value="${d.color||'#1bb052'}"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitEditDuty('${id}')">저장</button></div>`);
}
function submitEditDuty(id){
  if(!isAdmin())return;const title=g('mDTitle2').value.trim(),color=g('mDColor2').value;
  if(!title){toast('제목 입력');return;}
  db.ref('duties/'+id).update({title,color}).then(()=>{toast('저장했어');closeModal();});
}
function deleteDuty(id){if(!isAdmin())return;if(!confirm('삭제?'))return;db.ref('duties/'+id).remove().then(()=>toast('삭제했어'));}
function openAddMemberModal(id){
  const d=cache.duties[id];const already=d.memberIds||{};
  const opts=Object.entries(cache.users||{}).filter(([uid])=>!already[uid]);
  if(!opts.length){toast('추가할 멤버 없음');return;}
  openModal(`<h3>멤버 추가</h3>
    <select id="mAddMember">${opts.map(([uid,u])=>`<option value="${uid}">${esc(u.name)}</option>`).join('')}</select>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="addMember('${id}')">추가</button></div>`);
}
function addMember(id){if(!isAdmin())return;db.ref(`duties/${id}/memberIds/${g('mAddMember').value}`).set(true).then(()=>{toast('추가했어');closeModal();});}
function removeMember(id,uid){if(!isAdmin())return;db.ref(`duties/${id}/memberIds/${uid}`).remove().then(()=>toast('제거했어'));}

/* ── Settings ── */
function renderSettings(){
  if(!isAdmin()){g('pageContent').innerHTML=`<div class="card">${emptyDiv('관리자만 접근')}</div>`;return;}
  const polls=Object.entries(cache.polls||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const th=(cache.settings?.gradeThresholds)||{a:90,b:75,c:50};
  g('pageContent').innerHTML=`
    <div class="card"><h2>설문/투표 관리</h2>
      <table><thead><tr><th>질문</th><th>형식</th><th>참여</th><th>상태</th><th></th></tr></thead>
      <tbody>${polls.length?polls.map(([id,p])=>{
        const total=Object.keys(cache.pollVotes[id]||{}).length;
        return `<tr><td>${esc(p.question)}</td><td>${p.type==='ox'?'O/X':'객관식'}</td><td>${total}표</td>
          <td>${p.approved?(p.closed?'<span class="badge pending">마감</span>':'<span class="badge ok">진행중</span>'):'<span class="badge danger">대기</span>'}</td>
          <td>${!p.closed&&p.approved?`<button class="btn ghost small" onclick="closePoll('${id}')">마감</button>`:''} <button class="btn danger small" onclick="deletePoll('${id}')">삭제</button></td></tr>`;
      }).join(''):`<tr><td colspan="5" class="empty">없음</td></tr>`}</tbody></table>
    </div>
    <div class="card"><h2>⚙️ 고급 설정</h2>
      <div style="font-size:12px;color:var(--text2);margin-bottom:11px">O 득표율 기준 등급 경계값 (%)</div>
      <div class="grid3">
        <div class="field"><label>A 기준</label><input id="mThA" type="number" min="0" max="100" value="${th.a}"></div>
        <div class="field"><label>B 기준</label><input id="mThB" type="number" min="0" max="100" value="${th.b}"></div>
        <div class="field"><label>C 기준</label><input id="mThC" type="number" min="0" max="100" value="${th.c}"></div>
      </div>
      <div class="err-msg" id="mThErr"></div>
      <button class="btn small" onclick="submitThresholds()">저장</button>
    </div>`;
}
function submitThresholds(){
  if(!isAdmin())return;
  const a=Number(g('mThA').value),b=Number(g('mThB').value),c=Number(g('mThC').value),err=g('mThErr');err.textContent='';
  if([a,b,c].some(v=>isNaN(v)||v<0||v>100)){err.textContent='0~100 숫자';return;}
  if(!(a>b&&b>c)){err.textContent='A>B>C 순서';return;}
  db.ref('settings/gradeThresholds').set({a,b,c}).then(()=>toast('저장했어'));
}

/* ── AI ── */
const AI_INTENTS=[
  {keys:['안녕','hello','hi'],fn:()=>aiProse([`👋 ${esc(currentUser.name)}님! 뭐가 궁금해?`])},
  {keys:['요약','브리핑','전체','오늘'],fn:aiFullSummary},
  {keys:['민원'],fn:aiComplaints},
  {keys:['신청','승인'],fn:aiApplications},
  {keys:['임무','완료','체크'],fn:aiChecks},
  {keys:['투표','설문','동료'],fn:aiVoteStatus},
  {keys:['멤버','인원','명단'],fn:aiMembers},
  {keys:['공지'],fn:aiNotices},
  {keys:['회의'],fn:aiMeetings},
  {keys:['모둠'],fn:aiGroups},
  {keys:['도움','help','사용법'],fn:aiHelp},
];
function aiProse(lines){return `<div style="line-height:1.8;font-size:13.5px">${lines.join('<br>')}</div>`;}
function aiAnswer(text){
  const t=text.toLowerCase();
  const matched=AI_INTENTS.filter(i=>i.keys.some(k=>t.includes(k)));
  if(!matched.length)return aiProse([`"${esc(text)}"에 대한 정보를 못 찾았어. "도움말"을 입력해봐.`]);
  if(matched.length===1)return matched[0].fn();
  return matched.map(m=>m.fn()).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">');
}
function aiFullSummary(){
  const pCom=Object.values(cache.complaints||{}).filter(c=>c.status==='pending').length;
  const pApp=Object.values(cache.duties||{}).reduce((s,d)=>s+Object.values(d.applications||{}).filter(a=>a.status==='pending').length,0);
  const pPoll=Object.values(cache.polls||{}).filter(p=>!p.approved&&!p.closed).length;
  return aiProse([`📊 <b>전체 요약</b>`,`멤버 ${Object.keys(cache.users||{}).length}명 · 1인1역 ${Object.keys(cache.duties||{}).length}개`,
    pCom?`⚠️ 미처리 민원 <b>${pCom}건</b>`:'✅ 미처리 민원 없음',
    pApp?`📋 신청 승인 대기 <b>${pApp}건</b>`:'✅ 대기 신청 없음',
    pPoll?`📥 투표 승인 대기 <b>${pPoll}건</b>`:'✅ 대기 없음']);
}
function aiComplaints(){
  const p=Object.values(cache.complaints||{}).filter(c=>c.status==='pending');
  if(!p.length)return aiProse(['✅ 대기 중인 민원 없어.']);
  return aiProse([`⚠️ 대기 민원 <b>${p.length}건</b>`,...p.slice(0,5).map(c=>`· <b>${esc(c.title)}</b> — ${esc(userName(c.submittedBy))}`)]);
}
function aiApplications(){
  const rows=[];
  Object.entries(cache.duties||{}).forEach(([,d])=>Object.entries(d.applications||{}).filter(([,a])=>a.status==='pending').forEach(([uid])=>rows.push(`· <b>${esc(userName(uid))}</b> → ${esc(d.title)}`)));
  if(!rows.length)return aiProse(['📋 승인 대기 신청 없어.']);
  return aiProse([`📋 승인 대기 <b>${rows.length}건</b>`,...rows.slice(0,6)]);
}
function aiChecks(){
  const undone=[];
  myManagedDuties().forEach(([did,d])=>Object.keys(d.memberIds||{}).forEach(uid=>{if(!((cache.completions[did]||{})[uid]||{}).done)undone.push(`${esc(userName(uid))}(${esc(d.title)})`);}));
  if(!undone.length)return aiProse(['✅ 모든 임무 완료됨.']);
  return aiProse([`📝 미완료 <b>${undone.length}건</b>: ${undone.slice(0,5).join(', ')}${undone.length>5?` 외 ${undone.length-5}명`:''}`]);
}
function aiVoteStatus(){
  const active=Object.values(cache.polls||{}).filter(p=>p.approved&&!p.closed).length;
  const peer=Object.values(cache.peerEvals||{}).filter(p=>p.approved&&!p.closed).length;
  if(!active&&!peer)return aiProse(['현재 진행 중인 투표 없어.']);
  return aiProse([`🗳️ 진행 중: 설문 ${active}개, 동료평가 ${peer}개`]);
}
function aiMembers(){
  const total=Object.keys(cache.users||{}).length;
  const admins=Object.values(cache.users||{}).filter(u=>u.systemRole==='admin');
  return aiProse([`👥 전체 <b>${total}명</b> (관리자 ${admins.length}명)`]);
}
function aiNotices(){
  const list=Object.values(cache.notices||{});
  if(!list.length)return aiProse(['공지사항 없어.']);
  return aiProse([`📢 공지 <b>${list.length}건</b>`,...list.slice(0,3).map(n=>`· <b>${esc(n.title)}</b>`)]);
}
function aiMeetings(){
  const active=Object.values(cache.meetings||{}).filter(m=>m.status==='active');
  return aiProse([`💬 진행중 ${active.length}개`,...active.map(m=>`· <b>${esc(m.title)}</b>`)]);
}
function aiGroups(){
  const sets=Object.entries(cache.groupSets||{});
  if(!sets.length)return aiProse(['모둠 없어.']);
  return aiProse([`👥 모둠 <b>${sets.length}개</b>`,...sets.slice(0,3).map(([,s])=>`· ${esc(s.title)}`)]);
}
function aiHelp(){
  return aiProse(['💡 이런 걸 물어볼 수 있어:','· "오늘 요약해줘" — 전체 현황','· "민원 있어?" — 대기 민원','· "신청 현황" — 1인1역 신청','· "임무 완료율" — 체크 현황','· "투표 현황" — 진행중 투표']);
}
function aiSend(){
  const inp=g('aiChatInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  aiConversation.push({role:'user',text,ts:Date.now()});
  renderPage('ai');
  setTimeout(()=>{aiConversation.push({role:'ai',html:aiAnswer(text),ts:Date.now()});renderPage('ai');const wrap=g('aiChatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;},300);
}
function aiClear(){aiConversation=[];renderPage('ai');}
function renderAI(){
  if(!isAdmin()){g('pageContent').innerHTML=`<div class="card">${emptyDiv('관리자만 접근')}</div>`;return;}
  const chatHtml=aiConversation.map(m=>m.role==='user'
    ?`<div style="display:flex;justify-content:flex-end;margin-bottom:9px"><div style="background:var(--g2);color:#fff;border-radius:15px 15px 4px 15px;padding:9px 13px;max-width:78%;font-size:13.5px">${esc(m.text)}</div></div>`
    :`<div style="display:flex;gap:8px;margin-bottom:9px"><div style="width:28px;height:28px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;flex-shrink:0">🤖</div><div style="background:var(--surface2);border:1px solid var(--border);border-radius:4px 15px 15px 15px;padding:9px 13px;max-width:82%;font-size:13.5px;line-height:1.7">${m.html||esc(m.text)}</div></div>`
  ).join('');
  g('pageContent').innerHTML=`
    <div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 170px);padding:0">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px">
        <div style="width:34px;height:34px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:16px">🤖</div>
        <div><div style="font-weight:800;font-size:14.5px">AI 브리핑</div><div style="font-size:11px;color:var(--g2)">● 온라인</div></div>
        ${aiConversation.length?`<button class="btn ghost small" style="margin-left:auto" onclick="aiClear()">초기화</button>`:''}
      </div>
      <div id="aiChatWrap" style="flex:1;overflow-y:auto;padding:16px 14px">
        ${!aiConversation.length?`<div style="text-align:center;padding:30px 10px">
          <div style="font-size:30px;margin-bottom:10px">🤖</div>
          <div style="font-weight:800;font-size:15px;margin-bottom:6px">안녕! 뭐가 궁금해?</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
            ${['오늘 요약','민원 있어?','신청 현황','투표 현황','도움말'].map(q=>`<button class="btn ghost small" onclick="g('aiChatInput').value='${q}';aiSend()">${q}</button>`).join('')}
          </div></div>`:chatHtml}
      </div>
      <div style="padding:11px 14px;border-top:1px solid var(--border)">
        <div class="row"><input id="aiChatInput" placeholder="질문을 입력해봐..." style="flex:1" onkeydown="if(event.key==='Enter'){aiSend();}"><button class="btn small" onclick="aiSend()">전송</button></div>
      </div>
    </div>`;
  const wrap=g('aiChatWrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
}

/* ── Me ── */
function renderMe(){
  const u=cache.users[currentUser.uid]||{};
  g('pageContent').innerHTML=`
    <div class="card"><h2>내 정보</h2>
      <table><tbody>
        <tr><td style="width:90px;color:var(--text2)">이름</td><td>${esc(u.name)}</td></tr>
        <tr><td style="color:var(--text2)">이메일</td><td>${esc(u.email||'-')}</td></tr>
        <tr><td style="color:var(--text2)">전화</td><td>${esc(u.phone||'-')}</td></tr>
        <tr><td style="color:var(--text2)">권한</td><td>${u.systemRole==='admin'?'전체관리자':'멤버'}</td></tr>
      </tbody></table>
    </div>
    <div class="card"><h2>비밀번호 변경</h2>
      <div class="field"><label>현재 비밀번호</label><input id="mePwCur" type="password"></div>
      <div class="field"><label>새 비밀번호 (6자 이상)</label><input id="mePwNew" type="password"></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="mePwNew2" type="password"></div>
      <div class="err-msg" id="mePwErr"></div>
      <button class="btn small" onclick="submitChangePw()">변경</button>
    </div>`;
}
async function submitChangePw(){
  const cur=g('mePwCur').value,next=g('mePwNew').value,next2=g('mePwNew2').value,err=g('mePwErr');
  err.textContent='';
  const u=cache.users[currentUser.uid]||{};
  const curHash=await hashPw(cur);
  if(curHash!==u.password&&cur!==u.password){err.textContent='현재 비밀번호 오류';return;}
  if(next.length<6){err.textContent='6자 이상';return;}
  if(next!==next2){err.textContent='불일치';return;}
  const nextHash=await hashPw(next);
  db.ref('users/'+currentUser.uid+'/password').set(nextHash).then(()=>toast('변경했어'));
}

</script>
</body>
</html>
