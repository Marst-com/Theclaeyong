<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1인1역 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green-50:#eafcf1; --green-100:#d7f7e3; --green-200:#a9edc4;
  --green-500:#1bb052; --green-600:#159244; --green-700:#0f7536;
  --bg:#eafcf1; --bg-elev:#ffffff; --bg-elev2:#eafaf0;
  --text:#16201a; --text-dim:#7c8b81; --border:#e6f4ec;
  --danger:#ef4444; --danger-soft:#fde8e8; --warn:#f59e0b;
  --gray-soft:#eef1ee; --gray-text:#6b7280;
  --indigo-a:#8b7cf6; --indigo-b:#4f46e5;
  --radius:20px; --radius-sm:14px;
  --shadow:0 10px 26px -8px rgba(27,176,82,.22), 0 3px 10px -2px rgba(27,176,82,.10);
}
[data-theme="dark"]{
  --bg:#0c1712; --bg-elev:#141f19; --bg-elev2:#1a2721;
  --text:#eef4f0; --text-dim:#8ea79a; --border:#223129;
  --green-50:#0e2317; --green-100:#123420; --gray-soft:#1a2721; --gray-text:#8ea79a;
  --shadow:0 10px 26px -8px rgba(0,0,0,.35), 0 3px 10px -2px rgba(27,176,82,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; transition:background .2s, color .2s;
}
button, input, select, textarea{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; }
input, select, textarea{
  background:var(--bg-elev); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px; font-size:14px; width:100%;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--green-500); outline-offset:-1px; }

/* ---------- Layout ---------- */
.app{ display:none; min-height:100vh; }
.app.active{ display:flex; }
.sidebar{
  width:230px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; gap:4px;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 6px 20px; }
.icon-badge{
  width:36px; height:36px; border-radius:12px; background:var(--green-600);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-badge svg{ width:18px; height:18px; stroke:#fff; }
.icon-badge.soft{ background:var(--green-100); }
.icon-badge.soft svg{ stroke:var(--green-600); }
.brand-text{ font-weight:800; font-size:15px; letter-spacing:-.2px; }
.nav-section-label{
  font-size:10.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px;
  padding:14px 12px 4px; opacity:.75;
}
.nav-section-label:first-child{ padding-top:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:14px;
  font-size:14px; font-weight:500; color:var(--text-dim); text-align:left;
}
.nav-item:hover{ background:var(--bg-elev2); color:var(--text); }
.nav-item.active{ background:var(--green-600); color:#fff; font-weight:700; }
.nav-item svg{ width:17px; height:17px; flex-shrink:0; }
.sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
.user-chip{
  display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:var(--bg-elev2);
  font-size:13px; font-weight:600;
}
.user-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--green-500); }

.main{ flex:1; padding:26px 34px 90px; overflow-y:auto; max-height:100vh; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
.topbar h1{ font-size:21px; font-weight:800; letter-spacing:-.3px; }
.topbar .sub{ font-size:13px; color:var(--text-dim); margin-top:2px; }

.theme-toggle{ display:flex; background:var(--bg-elev2); border-radius:12px; padding:3px; gap:2px; }
.theme-toggle button{ padding:6px 10px; border-radius:9px; font-size:12px; color:var(--text-dim); }
.theme-toggle button.active{ background:var(--bg-elev); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); font-weight:600; }

.card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);
}
.card h2{ font-size:15px; font-weight:800; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media(max-width:760px){ .grid2,.grid3{ grid-template-columns:1fr; } }

/* ---------- Hero / notice cards (앱 스타일) ---------- */
.hero-card{
  border-radius:24px; padding:22px 24px; margin-bottom:14px; color:#fff;
  background:linear-gradient(135deg,var(--green-500),var(--green-700));
  box-shadow:var(--shadow);
}
.hero-card .hlabel{ font-size:12px; opacity:.85; font-weight:600; margin-bottom:8px; }
.hero-card .hval{ font-size:32px; font-weight:800; display:flex; align-items:center; gap:10px; }
.hero-card .hicon{
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.22);
  display:inline-flex; align-items:center; justify-content:center; font-size:14px;
}
.notice-card{
  border-radius:24px; padding:18px 22px; margin-bottom:14px; color:#fff;
  background:linear-gradient(135deg,var(--indigo-a),var(--indigo-b));
  display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
}
.notice-card .nemoji{ font-size:22px; }
.notice-card .ntitle{ font-weight:800; font-size:15px; margin-bottom:2px; }
.notice-card .nsub{ font-size:12px; opacity:.85; display:flex; align-items:center; gap:8px; }
.notice-card .npill{ background:rgba(255,255,255,.25); padding:2px 9px; border-radius:99px; font-weight:700; font-size:11px; }

.tile-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
@media(max-width:760px){ .tile-grid{ grid-template-columns:repeat(3,1fr); } }
.tile{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:20px; padding:18px 10px;
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; position:relative;
  box-shadow:var(--shadow);
}
.tile:hover{ transform:translateY(-1px); }
.tile .ticon{
  width:46px; height:46px; border-radius:14px; background:var(--green-100);
  display:flex; align-items:center; justify-content:center;
}
.tile .ticon svg{ width:22px; height:22px; stroke:var(--green-600); }
.tile .tlabel{ font-size:12.5px; font-weight:700; }
.tile .tbadge{
  position:absolute; top:10px; right:14px; background:var(--danger); color:#fff; font-size:10px; font-weight:800;
  min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 4px;
}

.list-item{
  display:flex; align-items:center; gap:10px; padding:13px 6px; border-bottom:1px solid var(--border);
}
.list-item:last-child{ border-bottom:none; }
.list-item .ldot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.list-item .lname{ font-size:13.5px; font-weight:800; color:var(--text); flex:1; }

.btn{
  padding:10px 16px 12px; border-radius:14px; font-size:13px; font-weight:800;
  background:var(--green-500); color:#fff; display:inline-flex; align-items:center; gap:6px;
  border-bottom:3px solid var(--green-700); position:relative; top:0; transition:top .08s, border-bottom-width .08s;
}
.btn:hover{ background:var(--green-500); }
.btn:active{ top:2px; border-bottom-width:1px; }
.btn.ghost{ background:var(--bg-elev2); color:var(--text); border-bottom:3px solid var(--border); }
.btn.ghost:hover{ background:var(--bg-elev2); }
.btn.danger{ background:#f4574f; border-bottom:3px solid #b8362f; }
.btn.small{ padding:6px 10px 8px; font-size:12px; border-radius:11px; border-bottom-width:2px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.row{ display:flex; align-items:center; gap:10px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; padding:8px 10px; color:var(--text-dim); font-weight:600; border-bottom:1px solid var(--border); font-size:12px;}
td{ padding:10px 10px; border-bottom:1px solid var(--border); }
tr:last-child td{ border-bottom:none; }

/* ---------- Pill badges (대기/완료 스타일) ---------- */
.badge{ display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:800; }
.badge.grade-A{ background:#dcf7e6; color:#0f6b30; } .badge.grade-B{ background:#dbeafe; color:#1d4ed8; }
.badge.grade-C{ background:#fef3c7; color:#b45309; } .badge.grade-D{ background:#fde2e2; color:#b91c1c; }
.badge.grade-null{ background:var(--gray-soft); color:var(--gray-text); }
.badge.pending{ background:var(--gray-soft); color:var(--gray-text); }
.badge.resolved{ background:var(--green-100); color:#0f6b30; }
.badge.solid{ color:#fff; }
.badge.solid.grade-A{ background:#16a34a; color:#fff; }

td:first-child{ font-weight:700; color:var(--text); }

.chip-color{ width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:6px; vertical-align:-1px;}

.empty{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px; }

.toast{
  position:fixed; bottom:88px; right:20px; background:var(--text); color:var(--bg);
  padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:999;
  opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateY(0); }

.modal-bg{
  position:fixed; inset:0; background:rgba(20,40,30,.45); display:none; align-items:center; justify-content:center; z-index:900; padding:20px;
}
.modal-bg.show{ display:flex; }
.modal{
  background:var(--bg-elev); border-radius:22px; border:1px solid var(--border); padding:22px; width:100%; max-width:420px;
  max-height:86vh; overflow-y:auto;
}
.modal h3{ font-size:16px; font-weight:800; margin-bottom:16px; }

.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
.login-box{ width:100%; max-width:360px; background:var(--bg-elev); padding:32px 28px; border-radius:24px; box-shadow:var(--shadow); border:1px solid var(--border); }
.login-box .icon-badge{ width:52px; height:52px; border-radius:18px; margin:0 auto 16px; }
.login-box .icon-badge svg{ width:26px; height:26px; }
.login-box h1{ text-align:center; font-size:19px; font-weight:800; margin-bottom:4px; }
.login-box .sub{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:24px; }
.err-msg{ color:var(--danger); font-size:12px; margin-top:6px; min-height:14px; }

.vote-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.chat-wrap{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; padding:6px 2px; margin-bottom:12px; }
.chat-row{ display:flex; flex-direction:column; max-width:78%; }
.chat-row.mine{ align-self:flex-end; align-items:flex-end; }
.chat-row.theirs{ align-self:flex-start; align-items:flex-start; }
.chat-sender{ font-size:11px; color:var(--text-dim); margin-bottom:3px; padding:0 4px; font-weight:600; }
.chat-bubble{ padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.5; word-break:break-word; }
.chat-row.mine .chat-bubble{ background:var(--green-600); color:#fff; border-bottom-right-radius:4px; }
.chat-row.theirs .chat-bubble{ background:var(--bg-elev2); color:var(--text); border-bottom-left-radius:4px; }
.chat-time{ font-size:10px; color:var(--text-dim); margin-top:3px; padding:0 4px; }
.chat-system{ align-self:center; max-width:90%; text-align:center; padding:8px 14px; border-radius:12px; font-size:12.5px; font-weight:700; }
.chat-system.conclude{ background:var(--green-100); color:#0f6b30; }
.chat-system.notice{ background:#e6e2fd; color:var(--indigo-b); }
.chat-system.end{ background:var(--gray-soft); color:var(--gray-text); }
.chat-system.mention{ background:#fef3c7; color:#b45309; }
.chat-poll{ background:var(--bg-elev2); border:1px solid var(--border); border-radius:14px; padding:10px 12px; align-self:center; max-width:90%; }
.vote-card{ border:1px solid var(--border); border-radius:16px; padding:12px 14px; width:170px; background:var(--bg-elev2); }
.vote-card .name{ font-weight:700; font-size:13px; margin-bottom:8px; }
.ox-btns{ display:flex; gap:6px; }
.ox-btns button{ flex:1; padding:8px 0; border-radius:10px; font-weight:800; font-size:13px; border:1px solid var(--border); background:var(--bg-elev); }
.ox-btns button.o.sel{ background:var(--green-600); color:#fff; border-color:var(--green-600); }
.ox-btns button.x.sel{ background:var(--danger); color:#fff; border-color:var(--danger); }

/* ---------- Bottom tab bar (모바일) ---------- */
.bottom-nav{ display:none; }
@media(max-width:760px){
  .sidebar{ display:none; }
  .main{ padding:20px 16px 96px; }
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg-elev);
    border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:500; box-shadow:0 -4px 14px rgba(0,0,0,.05);
  }
  .bottom-nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px;
    color:var(--gray-text); font-weight:600; padding:4px 0; position:relative;
  }
  .bottom-nav button.active{ color:var(--green-600); }
  .bottom-nav button svg{ width:20px; height:20px; }
  .bottom-nav .bnbadge{
    position:absolute; top:-1px; right:calc(50% - 16px); background:var(--danger); color:#fff; font-size:9px; font-weight:800;
    min-width:14px; height:14px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
}

.hidden{ display:none !important; }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 id="loginTitle">1인1역 관리 시스템</h1>
    <div class="sub" id="loginSub">이름과 비밀번호로 로그인하세요</div>
    <div class="field"><label>이름</label><input id="loginName" placeholder="이름 입력"></div>
    <div class="field"><label>비밀번호</label><input id="loginPw" type="password" placeholder="비밀번호 입력"></div>
    <button class="btn" style="width:100%; justify-content:center;" id="loginBtn" onclick="handleLogin()">로그인</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- ============ SETUP (최초 관리자 생성) ============ -->
<div class="login-wrap hidden" id="setupScreen">
  <div class="login-box">
    <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <h1>최초 전체관리자 계정 생성</h1>
    <div class="sub">아직 계정이 없어요. 첫 관리자 계정을 만들어주세요</div>
    <div class="field"><label>이름</label><input id="setupName" placeholder="이름 입력"></div>
    <div class="field"><label>비밀번호</label><input id="setupPw" type="password" placeholder="비밀번호 입력"></div>
    <button class="btn" style="width:100%; justify-content:center;" onclick="handleSetup()">관리자 계정 만들기</button>
    <div class="err-msg" id="setupErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="brand-text">1인1역</div>
    </div>
    <div id="navItems"></div>
    <div class="sidebar-foot">
      <div class="theme-toggle">
        <button data-theme-btn="light" onclick="setTheme('light')">라이트</button>
        <button data-theme-btn="dark" onclick="setTheme('dark')">다크</button>
        <button data-theme-btn="system" onclick="setTheme('system')">시스템</button>
      </div>
      <div class="user-chip"><span class="dot"></span><span id="userChipName"></span></div>
      <button class="btn ghost small" style="width:100%; justify-content:center;" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">대시보드</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div id="topbarActions"></div>
    </div>
    <div id="pageContent"></div>
  </div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* =========================================================
   1인1역 관리 시스템 - app.js
   ---------------------------------------------------------
   ⚠️ firebaseConfig 는 플레이스홀더입니다.
   Firebase 콘솔 > 프로젝트 설정 > 일반 탭에서 config 복사해서
   아래 firebaseConfig 객체를 교체하세요. (Realtime Database 사용)
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAbmpRUvrDbPdRASWNXv2N3DlDMWiUf7VA",
  authDomain: "theclaeyongkr.firebaseapp.com",
  databaseURL: "https://theclaeyongkr-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "theclaeyongkr",
  storageBucket: "theclaeyongkr.firebasestorage.app",
  messagingSenderId: "465244053974",
  appId: "1:465244053974:web:a24aa3e7defcb5b371c477",
  measurementId: "G-NDQN8313JV"
};

let db = null;
let auth = null;
let dbReady = false;
let firebaseInitError = null;

try {
  if (typeof firebase === 'undefined') {
    throw new Error('firebase SDK가 로드되지 않았어 (스크립트 태그가 차단됐거나 네트워크 문제일 수 있어)');
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  auth = firebase.auth();
  dbReady = true;
} catch (e) {
  firebaseInitError = e && e.message ? e.message : String(e);
  console.error("Firebase 초기화 실패:", e);
}

/* ---------------- 로컬 캐시 (실시간 동기화 됨) ---------------- */
const cache = {
  users: {},               // uid -> {name, password, systemRole, createdAt}
  duties: {},              // dutyId -> {title, color, memberIds:{}, managerIds:{}}
  periods: {},             // periodId -> {label, type, active, createdAt}
  completions: {},         // periodId -> dutyId -> uid -> {done, checkedBy, checkedAt}
  votes: {},               // periodId -> targetUid -> voterUid -> 'O'|'X'
  grades: {},              // periodId -> uid -> {autoGrade, finalGrade, overridden}
  complaintCategories: {}, // catId -> {title, color}
  complaints: {},          // id -> {categoryId, title, content, targetUid, submittedBy, status, createdAt}
  applicationVotes: {},    // dutyId -> applicantUid -> voterUid -> 'O'|'X'
  polls: {},               // pollId -> {question, type:'ox'|'choice', options:[], createdBy, createdAt, closed}
  pollVotes: {},           // pollId -> voterUid -> answer
  memos: {},                // id -> {toUid, message, sentBy, sentAt, read}
  groupSets: {},            // setId -> {title, createdAt, groups:{groupId:{name, memberIds:{}}}}
  meetings: {},             // meetingId -> {title, participantIds:{}, moderatorMode, moderatorUid, status, conclusion, createdAt, createdBy}
  meetingModeratorVotes: {}, // meetingId -> voterUid -> candidateUid
  meetingMessages: {},      // meetingId -> msgId -> {uid, text, type, command, pollVotes:{}, createdAt}
  settings: { currentPeriodId: null, voteCycle: 'weekly', gradeThresholds: { a: 90, b: 75, c: 50 } }
};

let currentUser = null;   // {uid, name, systemRole}
let currentPage = 'dashboard';

/* ================= INIT ================= */
window.addEventListener('DOMContentLoaded', init);

function init() {
  applyTheme(localStorage.getItem('theme') || 'system');

  if (!dbReady) {
    document.getElementById('loginErr').textContent =
      'Firebase 초기화 실패: ' + (firebaseInitError || '알 수 없는 오류') + ' — 이 메시지를 그대로 복사해서 알려줘.';
    return;
  }

  // RTDB 규칙이 "auth != null"을 요구하므로, 접속하자마자 익명 로그인부터 진행
  auth.signInAnonymously().catch(e => {
    console.error('익명 로그인 실패:', e);
    document.getElementById('loginErr').textContent =
      '익명 로그인 실패: ' + (e && e.message ? e.message : e) +
      ' — Authentication > Sign-in method에서 "익명" 로그인이 켜져 있는지, Realtime Database가 실제로 만들어져 있는지 확인해줘.';
  });

  auth.onAuthStateChanged(user => {
    if (user) {
      attachRealtimeListeners();
      tryRestoreSession();
    }
  });
}

function attachRealtimeListeners() {
  if (!dbReady) return;
  const paths = ['users', 'duties', 'periods', 'completions', 'votes', 'grades', 'complaintCategories', 'complaints', 'applicationVotes', 'polls', 'pollVotes', 'memos', 'groupSets', 'meetings', 'meetingModeratorVotes', 'meetingMessages', 'settings'];
  paths.forEach(path => {
    db.ref(path).on('value', snap => {
      const val = snap.val() || (path === 'settings' ? { currentPeriodId: null, voteCycle: 'weekly', gradeThresholds: { a: 90, b: 75, c: 50 } } : {});
      cache[path] = val;
      afterCacheUpdate(path);
    });
  });
}

function afterCacheUpdate(path) {
  // 최초 로드 후 setup/login 화면 여부 판단
  if (path === 'users') {
    const hasUsers = Object.keys(cache.users || {}).length > 0;
    if (!currentUser) {
      document.getElementById('setupScreen').classList.toggle('hidden', hasUsers);
      document.getElementById('loginScreen').classList.toggle('hidden', !hasUsers);
    }
  }
  if (currentUser) renderPage(currentPage);
}

function tryRestoreSession() {
  const saved = JSON.parse(localStorage.getItem('session') || 'null');
  if (saved && saved.uid) {
    // users 로드를 약간 기다렸다가 검증
    setTimeout(() => {
      const u = cache.users[saved.uid];
      if (u) {
        currentUser = { uid: saved.uid, name: u.name, systemRole: u.systemRole };
        enterApp();
      }
    }, 400);
  }
}

/* ================= AUTH ================= */
function handleSetup() {
  const name = document.getElementById('setupName').value.trim();
  const pw = document.getElementById('setupPw').value;
  const errEl = document.getElementById('setupErr');
  errEl.textContent = '';
  if (!dbReady) { errEl.textContent = 'Firebase 설정이 필요해요 (app.js 상단 참고)'; return; }
  if (!name || !pw) { errEl.textContent = '이름과 비밀번호를 모두 입력해줘'; return; }
  if (pw.length < 4) { errEl.textContent = '비밀번호는 4자 이상으로 해줘'; return; }

  const uid = db.ref('users').push().key;
  db.ref('users/' + uid).set({
    name, password: pw, systemRole: 'admin', createdAt: Date.now()
  }).then(() => {
    currentUser = { uid, name, systemRole: 'admin' };
    localStorage.setItem('session', JSON.stringify({ uid }));
    enterApp();
  }).catch(e => errEl.textContent = '생성 실패: ' + e.message);
}

function handleLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!dbReady) { errEl.textContent = 'Firebase 설정이 필요해요 (app.js 상단 참고)'; return; }
  if (!name || !pw) { errEl.textContent = '이름과 비밀번호를 입력해줘'; return; }

  const entry = Object.entries(cache.users || {}).find(([id, u]) => u.name === name && u.password === pw);
  if (!entry) { errEl.textContent = '이름 또는 비밀번호가 맞지 않아'; return; }

  const [uid, u] = entry;
  currentUser = { uid, name: u.name, systemRole: u.systemRole };
  localStorage.setItem('session', JSON.stringify({ uid }));
  enterApp();
}

function handleLogout() {
  currentUser = null;
  localStorage.removeItem('session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginName').value = '';
  document.getElementById('loginPw').value = '';
}

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  document.getElementById('userChipName').textContent =
    currentUser.name + (currentUser.systemRole === 'admin' ? ' · 전체관리자' : '');
  syncThemeButtons();
  buildNav();
  renderPage('dashboard');
}

/* ================= THEME ================= */
function setTheme(mode) {
  localStorage.setItem('theme', mode);
  applyTheme(mode);
  syncThemeButtons();
}
function applyTheme(mode) {
  let actual = mode;
  if (mode === 'system') {
    actual = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (actual === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function syncThemeButtons() {
  const mode = localStorage.getItem('theme') || 'system';
  document.querySelectorAll('[data-theme-btn]').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === mode);
  });
}

/* ================= HELPERS ================= */
function isAdmin() { return currentUser && currentUser.systemRole === 'admin'; }
function isManagerOfAny() {
  if (isAdmin()) return Object.keys(cache.duties || {}).length > 0;
  return Object.values(cache.duties || {}).some(d => d.managerIds && d.managerIds[currentUser.uid]);
}
function myManagedDuties() {
  // 전체관리자는 모든 1인1역을 자동으로 관리함 (별도 관리자 지정 불필요)
  if (isAdmin()) return Object.entries(cache.duties || {});
  return Object.entries(cache.duties || {}).filter(([id, d]) => d.managerIds && d.managerIds[currentUser.uid]);
}
function userName(uid) { return (cache.users[uid] && cache.users[uid].name) || '(삭제된 사용자)'; }
function currentPeriodId() { return cache.settings.currentPeriodId; }
function currentPeriod() { const id = currentPeriodId(); return id ? cache.periods[id] : null; }
function newKey(path) { return db.ref(path).push().key; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
document.addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------------- 더보기 (긴 목록 접기/펼치기) ---------------- */
const expandedLists = {};
function renderExpandable(listKey, htmlItems, limit) {
  limit = limit || 5;
  const expanded = expandedLists[listKey];
  const shown = expanded ? htmlItems : htmlItems.slice(0, limit);
  let out = shown.join('');
  const remaining = htmlItems.length - limit;
  if (!expanded && remaining > 0) {
    out += `<button class="btn ghost small" style="margin-top:8px;" onclick="toggleExpand('${listKey}')">더보기 (+${remaining})</button>`;
  } else if (expanded && htmlItems.length > limit) {
    out += `<button class="btn ghost small" style="margin-top:8px;" onclick="toggleExpand('${listKey}')">접기</button>`;
  }
  return out;
}
function toggleExpand(key) {
  expandedLists[key] = !expandedLists[key];
  renderPage(currentPage);
}

function computeAutoGrade(oCount, total) {
  if (total === 0) return null;
  const ratio = (oCount / total) * 100;
  const th = (cache.settings && cache.settings.gradeThresholds) || { a: 90, b: 75, c: 50 };
  if (ratio >= th.a) return 'A';
  if (ratio >= th.b) return 'B';
  if (ratio >= th.c) return 'C';
  return 'D';
}

function navBadgeCount(id) {
  const pid = currentPeriodId();
  if (id === 'meetings') {
    return Object.entries(cache.meetings || {}).filter(([mid, m]) =>
      m.status === 'setup' && m.moderatorMode === 'vote' &&
      m.participantIds && m.participantIds[currentUser.uid] &&
      !((cache.meetingModeratorVotes[mid] || {})[currentUser.uid])
    ).length;
  }
  if (id === 'memos') {
    return Object.values(cache.memos || {}).filter(m => m.toUid === currentUser.uid && !m.read).length;
  }
  if (id === 'checks') {
    if (!pid) return 0;
    let count = 0;
    myManagedDuties().forEach(([dutyId, d]) => {
      const src = d.memberIds || {};
      Object.keys(src).forEach(uid => {
        const c = (((cache.completions[pid] || {})[dutyId] || {})[uid]) || {};
        if (!c.done) count++;
      });
    });
    return count;
  }
  if (id === 'vote') {
    if (!pid) return 0;
    const others = Object.keys(cache.users || {}).filter(uid => uid !== currentUser.uid);
    const votedCount = others.filter(uid => {
      const v = (cache.votes[pid] || {})[uid] || {};
      return !!v[currentUser.uid];
    }).length;
    return others.length - votedCount;
  }
  if (id === 'complaints') {
    if (!isAdmin()) return 0;
    return Object.values(cache.complaints || {}).filter(c => c.status === 'pending').length;
  }
  if (id === 'apply') {
    if (isAdmin()) {
      let count = 0;
      Object.values(cache.duties || {}).forEach(d => {
        Object.values(d.applications || {}).forEach(a => { if (a.status === 'pending') count++; });
      });
      return count;
    }
    let count = 0;
    Object.entries(cache.duties || {}).forEach(([dutyId, d]) => {
      Object.entries(d.applications || {}).forEach(([applicantUid, a]) => {
        if (a.status !== 'pending' || applicantUid === currentUser.uid) return;
        const myVote = ((cache.applicationVotes[dutyId] || {})[applicantUid] || {})[currentUser.uid];
        if (!myVote) count++;
      });
    });
    return count;
  }
  return 0;
}

function buildNav() {
  const items = navItemsList();
  const nav = document.getElementById('navItems');
  let lastSection = null;
  nav.innerHTML = items.map(it => {
    const count = navBadgeCount(it.id);
    const sectionHeader = it.section !== lastSection ? `<div class="nav-section-label">${esc(it.section)}</div>` : '';
    lastSection = it.section;
    return `${sectionHeader}
    <button class="nav-item" data-nav="${it.id}" onclick="renderPage('${it.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[it.id]}</svg>
      ${it.label}
      ${count > 0 ? `<span class="badge" style="background:var(--danger);color:#fff;margin-left:auto;">${count}</span>` : ''}
    </button>`;
  }).join('');

  // 모바일 하단 탭바: 대표 4개 + "더보기" (전체 메뉴는 더보기 시트에서 접근)
  const primary = items.slice(0, 4);
  const rest = items.slice(4);
  const bn = document.getElementById('bottomNav');
  if (bn) {
    const primaryHtml = primary.map(it => {
      const count = navBadgeCount(it.id);
      return `
      <button data-nav-b="${it.id}" onclick="renderPage('${it.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[it.id]}</svg>
        ${it.label}
        ${count > 0 ? `<span class="bnbadge">${count}</span>` : ''}
      </button>`;
    }).join('');
    const restBadgeTotal = rest.reduce((sum, it) => sum + navBadgeCount(it.id), 0);
    const moreHtml = rest.length ? `
      <button data-nav-b="__more__" onclick="openMoreMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        더보기
        ${restBadgeTotal > 0 ? `<span class="bnbadge">${restBadgeTotal}</span>` : ''}
      </button>` : '';
    bn.innerHTML = primaryHtml + moreHtml;
  }
}
function openMoreMenu() {
  const items = navItemsList();
  const rest = items.slice(4);
  openModal(`
    <h3>더보기</h3>
    <div style="display:flex; flex-direction:column; gap:6px;">
      ${rest.map(it => {
        const count = navBadgeCount(it.id);
        return `<button class="nav-item" style="background:var(--bg-elev2);" onclick="closeModal(); renderPage('${it.id}')">

        </button>`;
      }).join('')}
    </div>`);
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  const pid = currentPeriodId();
  const period = currentPeriod();
  const pendingComplaints = Object.values(cache.complaints || {}).filter(c => c.status === 'pending').length;

  // 히어로 카드: 이번 주기에 내가 받은 O 개수
  let oCount = 0, totalVotes = 0;
  if (pid) {
    const votesForMe = (cache.votes[pid] || {})[currentUser.uid] || {};
    const vals = Object.values(votesForMe);
    totalVotes = vals.length;
    oCount = vals.filter(v => v === 'O').length;
  }
  let myGrade = null;
  if (pid && cache.grades[pid] && cache.grades[pid][currentUser.uid]) {
    const g = cache.grades[pid][currentUser.uid];
    myGrade = g.finalGrade || g.autoGrade;
  }

  // 안내 카드: 오늘 해야 할 일 총량
  const checksBadge = navBadgeCount('checks');
  const voteBadge = navBadgeCount('vote');
  const todoCount = checksBadge + voteBadge + (isAdmin() ? pendingComplaints : 0);

  // 타일: 주요 메뉴 바로가기
  const tileDefs = [
    { id: 'vote', label: '투표' },
    { id: 'complaints', label: '민원' },
    { id: 'memos', label: '메모함' },
    { id: 'meetings', label: '회의' },
    { id: 'groups', label: '모둠 정하기' },
  ];
  if (isManagerOfAny()) tileDefs.unshift({ id: 'checks', label: '임무 확인' });
  if (isAdmin()) {
    tileDefs.push({ id: 'ai', label: 'AI 브리핑' }, { id: 'accounts', label: '계정 관리' }, { id: 'duties', label: '1인1역 관리' }, { id: 'grades', label: '등급 관리' }, { id: 'settings', label: '설정' });
  }

  // 체크리스트: 내가 관리하는 1인1역 대상자들의 완료 현황 (관리자 있을 때만), 없으면 이번 주기 투표 현황
  let listHtml = '';
  let listTitle = '';
  let listDone = 0, listTotal = 0;
  if (isManagerOfAny() && pid) {
    const rows = [];
    myManagedDuties().forEach(([dutyId, d]) => {
      const src = d.memberIds || {};
      Object.keys(src).forEach(uid => {
        const c = (((cache.completions[pid] || {})[dutyId] || {})[uid]) || {};
        rows.push({ name: userName(uid), done: !!c.done, sub: d.title });
      });
    });
    listTitle = '내가 확인할 목록';
    listTotal = rows.length; listDone = rows.filter(r => r.done).length;
    listHtml = rows.length ? renderExpandable('dash-checks', rows.map(r => `
      <div class="list-item">
        <span class="ldot" style="background:${r.done ? 'var(--green-500)' : 'var(--danger)'}"></span>
        <span class="lname">${esc(r.name)} <span style="color:var(--text-dim);font-weight:400;font-size:11.5px;">· ${esc(r.sub)}</span></span>
        <span class="badge ${r.done ? 'resolved' : 'pending'}">${r.done ? '완료' : '대기'}</span>
      </div>`), 5) : `<div class="empty">확인할 대상자가 없어요</div>`;
  } else if (pid) {
    const others = Object.entries(cache.users || {}).filter(([uid]) => uid !== currentUser.uid);
    listTitle = '이번 주기 내 투표 현황';
    listTotal = others.length;
    listDone = others.filter(([uid]) => ((cache.votes[pid] || {})[uid] || {})[currentUser.uid]).length;
    listHtml = others.length ? renderExpandable('dash-votes', others.map(([uid, u]) => {
      const voted = !!((cache.votes[pid] || {})[uid] || {})[currentUser.uid];
      return `<div class="list-item">
        <span class="ldot" style="background:${voted ? 'var(--green-500)' : 'var(--danger)'}"></span>
        <span class="lname">${esc(u.name)}</span>
        <span class="badge ${voted ? 'resolved' : 'pending'}">${voted ? '투표완료' : '대기'}</span>
      </div>`;
    }), 5) : `<div class="empty">투표할 멤버가 없어요</div>`;
  }

  document.getElementById('pageContent').innerHTML = `
    <div class="hero-card">
      <div class="hlabel">이번 주기 받은 O ${period ? '· ' + esc(period.label) : ''}</div>
      <div class="hval"><span class="hicon">🌱</span>${pid ? oCount : '-'}${pid ? `<span style="font-size:14px;font-weight:600;opacity:.85;">/ ${totalVotes}표</span>` : ''}</div>
    </div>
    ${todoCount > 0 ? `
    <div class="notice-card">
      <span class="nemoji">📌</span>
      <div>
        <div class="ntitle">할 일이 있어요!</div>
        <div class="nsub">확인이 필요한 항목 <span class="npill">${todoCount}</span></div>
      </div>
    </div>` : `
    <div class="notice-card" style="background:linear-gradient(135deg,var(--green-500),var(--green-700));">
      <span class="nemoji">🎉</span>
      <div>
        <div class="ntitle">오늘 할 일 다 끝냈어요</div>
        <div class="nsub">여유롭게 둘러봐도 좋아요</div>
      </div>
    </div>`}
    <div class="tile-grid">
      ${tileDefs.map(t => {
        const c = navBadgeCount(t.id);
        return `<button class="tile" onclick="renderPage('${t.id}')">
          ${c > 0 ? `<span class="tbadge">${c}</span>` : ''}
          <span class="ticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[t.id]}</svg></span>
          <span class="tlabel">${t.label}</span>
        </button>`;
      }).join('')}
    </div>
    ${myGrade ? `
    <div class="card">
      <h2>내 이번 주기 등급</h2>
      <span class="badge grade-${myGrade}" style="font-size:14px;padding:6px 14px;">${myGrade}</span>
    </div>` : ''}
    ${!pid ? `<div class="card"><div class="empty">아직 활성화된 주기가 없어요.${isAdmin() ? ' 설정 탭에서 만들어봐.' : ''}</div></div>` : `
    <div class="card">
      <h2>${listTitle} ${listTotal ? `<span style="color:var(--text-dim);font-weight:600;font-size:13px;">${listDone}/${listTotal}</span>` : ''}</h2>
      ${listHtml}
    </div>`}
  `;
}

/* ================= ACCOUNTS (admin) ================= */
function renderAccounts() {
  if (!isAdmin()) return renderNoAccess();
  document.getElementById('topbarActions').innerHTML = `<button class="btn" onclick="openCreateAccountModal()">+ 계정 생성</button>`;
  const rows = Object.entries(cache.users || {}).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
  const limit = 8;
  const expanded = expandedLists['accounts-list'];
  const shownRows = expanded ? rows : rows.slice(0, limit);
  const remaining = rows.length - limit;
  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <table>
        <thead><tr><th>이름</th><th>권한</th><th>가입일</th><th></th></tr></thead>
        <tbody>
        ${shownRows.length ? shownRows.map(([uid, u]) => `
          <tr>
            <td>${esc(u.name)}${uid === currentUser.uid ? ' <span style="color:var(--text-dim);font-size:11px;">(나)</span>' : ''}</td>
            <td>${u.systemRole === 'admin' ? '<span class="badge grade-A">전체관리자</span>' : '<span class="badge" style="background:var(--text-dim)">멤버</span>'}</td>
            <td style="color:var(--text-dim);font-size:12px;">${u.createdAt ? new Date(u.createdAt).toLocaleDateString('ko-KR') : '-'}</td>
            <td>
              <button class="btn ghost small" onclick="toggleAdmin('${uid}')">${u.systemRole === 'admin' ? '관리자 해제' : '관리자 지정'}</button>
              ${uid !== currentUser.uid ? `<button class="btn danger small" onclick="deleteAccount('${uid}')">삭제</button>` : ''}
            </td>
          </tr>`).join('') : `<tr><td colspan="4" class="empty">계정이 없어요</td></tr>`}
        </tbody>
      </table>
      ${!expanded && remaining > 0 ? `<button class="btn ghost small" style="margin-top:10px;" onclick="toggleExpand('accounts-list')">더보기 (+${remaining})</button>` : ''}
      ${expanded && rows.length > limit ? `<button class="btn ghost small" style="margin-top:10px;" onclick="toggleExpand('accounts-list')">접기</button>` : ''}
    </div>`;
}

function openCreateAccountModal() {
  openModal(`
    <h3>계정 생성</h3>
    <div class="field"><label>이름</label><input id="mAccName" placeholder="이름"></div>
    <div class="field"><label>비밀번호</label><input id="mAccPw" type="password" placeholder="비밀번호 (4자 이상)"></div>
    <div class="field"><label>권한</label>
      <select id="mAccRole"><option value="user">멤버</option><option value="admin">전체관리자</option></select>
    </div>
    <div class="err-msg" id="mAccErr"></div>
    <div class="row" style="justify-content:flex-end; margin-top:8px;">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitCreateAccount()">생성</button>
    </div>`);
}
function submitCreateAccount() {
  const name = document.getElementById('mAccName').value.trim();
  const pw = document.getElementById('mAccPw').value;
  const role = document.getElementById('mAccRole').value;
  const errEl = document.getElementById('mAccErr');
  if (!name || !pw) { errEl.textContent = '이름과 비밀번호를 입력해줘'; return; }
  if (pw.length < 4) { errEl.textContent = '비밀번호는 4자 이상'; return; }
  if (Object.values(cache.users).some(u => u.name === name)) { errEl.textContent = '이미 있는 이름이야'; return; }
  const uid = newKey('users');
  db.ref('users/' + uid).set({ name, password: pw, systemRole: role, createdAt: Date.now() })
    .then(() => { toast('계정을 만들었어'); closeModal(); });
}
function toggleAdmin(uid) {
  const u = cache.users[uid];
  db.ref('users/' + uid + '/systemRole').set(u.systemRole === 'admin' ? 'user' : 'admin')
    .then(() => toast('권한을 변경했어'));
}
function deleteAccount(uid) {
  if (!confirm(userName(uid) + ' 계정을 삭제할까?')) return;
  db.ref('users/' + uid).remove().then(() => toast('삭제했어'));
}

function renderNoAccess() {
  document.getElementById('pageContent').innerHTML = `<div class="card"><div class="empty">접근 권한이 없어요</div></div>`;
}

/* ================= APPLY (1인1역 신청 + 동료 투표 + 관리자 승인) ================= */
function dutyApplications(dutyId) {
  return (cache.duties[dutyId] && cache.duties[dutyId].applications) || {};
}
function applicationVoteTally(dutyId, applicantUid) {
  const votes = (cache.applicationVotes[dutyId] || {})[applicantUid] || {};
  const vals = Object.values(votes);
  return { o: vals.filter(v => v === 'O').length, x: vals.filter(v => v === 'X').length, total: vals.length, mine: votes[currentUser.uid] };
}
function applyForDuty(dutyId) {
  db.ref(`duties/${dutyId}/applications/${currentUser.uid}`).set({
    appliedAt: Date.now(), status: 'pending'
  }).then(() => toast('신청했어! 동료들 투표를 기다려줘'));
}
function withdrawApplication(dutyId) {
  if (!confirm('신청을 취소할까?')) return;
  db.ref(`duties/${dutyId}/applications/${currentUser.uid}`).remove()
    .then(() => db.ref(`applicationVotes/${dutyId}/${currentUser.uid}`).remove())
    .then(() => toast('신청을 취소했어'));
}
function castApplicationVote(dutyId, applicantUid, val) {
  db.ref(`applicationVotes/${dutyId}/${applicantUid}/${currentUser.uid}`).set(val)
    .then(() => toast('투표했어'));
}
function approveApplication(dutyId, applicantUid) {
  db.ref(`duties/${dutyId}/memberIds/${applicantUid}`).set(true)
    .then(() => db.ref(`duties/${dutyId}/applications/${applicantUid}/status`).set('approved'))
    .then(() => toast('승인했어. 멤버로 추가됐어'));
}
function rejectApplication(dutyId, applicantUid) {
  db.ref(`duties/${dutyId}/applications/${applicantUid}/status`).set('rejected')
    .then(() => toast('거절 처리했어'));
}

function renderApply() {
  const duties = Object.entries(cache.duties || {});

  // 1) 신청 가능한 1인1역 (아직 멤버도 아니고 신청도 안 한 것)
  const applicable = duties.filter(([id, d]) => !(d.memberIds && d.memberIds[currentUser.uid]) && !(dutyApplications(id)[currentUser.uid]));

  // 2) 내 신청 현황
  const mine = duties.filter(([id]) => dutyApplications(id)[currentUser.uid]);

  // 3) 동료 신청 투표 (다른 사람이 낸 pending 신청들)
  const othersPending = [];
  duties.forEach(([dutyId, d]) => {
    Object.entries(dutyApplications(dutyId)).forEach(([applicantUid, a]) => {
      if (a.status === 'pending' && applicantUid !== currentUser.uid) {
        othersPending.push({ dutyId, duty: d, applicantUid, a });
      }
    });
  });

  // 4) 관리자용: 전체 대기중 신청 + 투표집계
  const adminPending = [];
  if (isAdmin()) {
    duties.forEach(([dutyId, d]) => {
      Object.entries(dutyApplications(dutyId)).forEach(([applicantUid, a]) => {
        if (a.status === 'pending') adminPending.push({ dutyId, duty: d, applicantUid, a });
      });
    });
  }

  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <h2>신청 가능한 1인1역</h2>
      ${applicable.length ? `<div class="tile-grid">
        ${applicable.map(([id, d]) => `
          <button class="tile" onclick="applyForDuty('${id}')">
            <span class="ticon" style="background:${d.color}22;"><span class="chip-color" style="background:${d.color};width:18px;height:18px;border-radius:6px;margin:0;"></span></span>
            <span class="tlabel">${esc(d.title)}</span>
          </button>`).join('')}
      </div>` : `<div class="empty">신청할 수 있는 1인1역이 없어요 (이미 다 신청했거나 멤버로 등록돼 있어요)</div>`}
    </div>

    <div class="card">
      <h2>내 신청 현황</h2>
      ${mine.length ? mine.map(([id, d]) => {
        const a = dutyApplications(id)[currentUser.uid];
        const tally = applicationVoteTally(id, currentUser.uid);
        const statusLabel = a.status === 'pending' ? '투표 진행중' : a.status === 'approved' ? '승인됨' : '거절됨';
        const statusClass = a.status === 'pending' ? 'pending' : a.status === 'approved' ? 'resolved' : 'grade-D';
        return `<div class="list-item">
          <span class="ldot" style="background:${d.color}"></span>
          <span class="lname">${esc(d.title)} <span style="color:var(--text-dim);font-weight:400;font-size:11.5px;">· O ${tally.o} / X ${tally.x}</span></span>
          <span class="badge ${statusClass}">${statusLabel}</span>
          ${a.status === 'pending' ? `<button class="btn ghost small" onclick="withdrawApplication('${id}')">취소</button>` : ''}
        </div>`;
      }).join('') : `<div class="empty">신청한 1인1역이 없어요</div>`}
    </div>

    <div class="card">
      <h2>동료 신청 투표</h2>
      ${othersPending.length ? `<div class="vote-grid">
        ${othersPending.map(({ dutyId, duty, applicantUid, a }) => {
          const tally = applicationVoteTally(dutyId, applicantUid);
          return `<div class="vote-card">
            <div class="name">${esc(userName(applicantUid))}</div>
            <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">${esc(duty.title)} · O ${tally.o} / X ${tally.x}</div>
            <div class="ox-btns">
              <button class="o ${tally.mine === 'O' ? 'sel' : ''}" onclick="castApplicationVote('${dutyId}','${applicantUid}','O')">O</button>
              <button class="x ${tally.mine === 'X' ? 'sel' : ''}" onclick="castApplicationVote('${dutyId}','${applicantUid}','X')">X</button>
            </div>
          </div>`;
        }).join('')}
      </div>` : `<div class="empty">투표할 신청이 없어요</div>`}
    </div>

    ${isAdmin() ? `
    <div class="card">
      <h2>신청 승인 관리</h2>
      <table>
        <thead><tr><th>신청자</th><th>1인1역</th><th>O</th><th>X</th><th></th></tr></thead>
        <tbody>
        ${adminPending.length ? adminPending.map(({ dutyId, duty, applicantUid }) => {
          const tally = applicationVoteTally(dutyId, applicantUid);
          return `<tr>
            <td>${esc(userName(applicantUid))}</td>
            <td><span class="chip-color" style="background:${duty.color}"></span>${esc(duty.title)}</td>
            <td>${tally.o}</td>
            <td>${tally.x}</td>
            <td>
              <button class="btn small" onclick="approveApplication('${dutyId}','${applicantUid}')">승인</button>
              <button class="btn ghost small" onclick="rejectApplication('${dutyId}','${applicantUid}')">거절</button>
            </td>
          </tr>`;
        }).join('') : `<tr><td colspan="5" class="empty">대기중인 신청이 없어요</td></tr>`}
        </tbody>
      </table>
    </div>` : ''}
  `;
}

let aiLog = []; // {topic} 목록. 렌더 시점마다 최신 데이터로 다시 계산해서 항상 최신 상태 유지

const AI_TOPICS = {
  summary: { q: '오늘 전체 요약 브리핑해줘', gen: aiGenFullSummary },
  complaints: { q: '민원 내역 알려줘', gen: aiGenComplaints },

  complaintTargets: { q: '민원 많이 받은 사람 알려줘', gen: aiGenComplaintTargets },
  applications: { q: '1인1역 신청 현황 알려줘', gen: aiGenApplications },
  recommend: { q: '신청 승인/거절 추천해줘', gen: aiGenRecommend },
  applicationHistory: { q: '신청 승인/거절 이력 알려줘', gen: aiGenApplicationHistory },
  checks: { q: '임무 완료 현황 알려줘', gen: aiGenChecks },
  lowestCompletion: { q: '완료율 낮은 1인1역 순위 알려줘', gen: aiGenLowestCompletion },
  votes: { q: '투표 진행 상황 알려줘', gen: aiGenVotes },
  notVoted: { q: '아직 투표 안 한 사람 알려줘', gen: aiGenNotVoted },
  topO: { q: 'O 제일 많이 받은 사람 알려줘', gen: aiGenTopO },
  topX: { q: 'X 제일 많이 받은 사람 알려줘', gen: aiGenTopX },
  grades: { q: '등급 분포 알려줘', gen: aiGenGradeDistribution },
  dutyRoster: { q: '1인1역별 인원 현황 알려줘', gen: aiGenDutyRoster },
  memberOverview: { q: '전체 인원 현황 알려줘', gen: aiGenMemberOverview },
  noMember: { q: '멤버 없는 1인1역 알려줘', gen: aiGenDutiesNoMember },
  adminList: { q: '전체관리자 목록 알려줘', gen: aiGenAdminList },
  recentAccounts: { q: '최근 가입한 멤버 알려줘', gen: aiGenRecentAccounts }
};

function aiTextBlock(lines) {
  return `<div style="white-space:pre-wrap; line-height:1.7;">${esc(lines.join('\n'))}</div>`;
}

function aiGenComplaints() {
  const pending = Object.entries(cache.complaints || {}).filter(([id, c]) => c.status === 'pending');
  if (!pending.length) return aiTextBlock(['지금 대기중인 민원은 없어. 다 처리된 상태야.']);
  const lines = [`지금 대기중인 민원이 ${pending.length}건 있어.`];
  pending.forEach(([id, c]) => {
    const cat = cache.complaintCategories[c.categoryId];
    lines.push(`· [${cat ? cat.title : '분류없음'}] "${c.title}" — ${userName(c.submittedBy)} 제출${c.targetUid ? `, 대상: ${userName(c.targetUid)}` : ''}`);
  });
  return aiTextBlock(lines);
}

function aiGenApplications() {
  const rows = [];
  Object.entries(cache.duties || {}).forEach(([id, d]) => {
    const apps = Object.entries(dutyApplications(id)).filter(([uid, a]) => a.status === 'pending');
    if (apps.length) {
      const names = apps.map(([uid]) => {
        const t = applicationVoteTally(id, uid);
        return `${userName(uid)}(O${t.o}/X${t.x})`;
      }).join(', ');
      rows.push(`· ${d.title}: ${apps.length}명 — ${names}`);
    }
  });
  if (!rows.length) return aiTextBlock(['지금 대기중인 1인1역 신청은 없어.']);
  return aiTextBlock(['대기중인 신청이 있는 1인1역이야.', ...rows]);
}

function aiRecommendRows() {
  const rows = [];
  Object.entries(cache.duties || {}).forEach(([dutyId, d]) => {
    Object.entries(dutyApplications(dutyId)).forEach(([uid, a]) => {
      if (a.status !== 'pending') return;
      const t = applicationVoteTally(dutyId, uid);
      let verdict, cls, dot;
      if (t.total === 0) { verdict = '투표 없음 · 보류'; cls = 'pending'; dot = 'var(--gray-text)'; }
      else if (t.o > t.x) { verdict = '승인 추천'; cls = 'resolved'; dot = 'var(--green-500)'; }
      else if (t.x > t.o) { verdict = '거절 추천'; cls = 'grade-D'; dot = 'var(--danger)'; }
      else { verdict = '동률 · 판단 필요'; cls = 'pending'; dot = 'var(--warn)'; }
      rows.push({ dutyId, dutyTitle: d.title, uid, name: userName(uid), o: t.o, x: t.x, verdict, cls, dot });
    });
  });
  return rows;
}
function aiGenRecommend() {
  const rows = aiRecommendRows();
  if (!rows.length) return `<div class="empty">지금 대기중인 신청이 없어.</div>`;
  return rows.map(r => `
    <div class="list-item">
      <span class="ldot" style="background:${r.dot}"></span>
      <span class="lname">${esc(r.name)} <span style="color:var(--text-dim);font-weight:400;font-size:11.5px;">· ${esc(r.dutyTitle)} · O${r.o}/X${r.x}</span></span>
      <span class="badge ${r.cls}">${r.verdict}</span>
      <button class="btn small" onclick="aiApprove('${r.dutyId}','${r.uid}')">승인</button>
      <button class="btn ghost small" onclick="aiReject('${r.dutyId}','${r.uid}')">거절</button>
    </div>`).join('');
}
function aiApprove(dutyId, uid) { approveApplication(dutyId, uid); }
function aiReject(dutyId, uid) { rejectApplication(dutyId, uid); }

function aiGenChecks() {
  const pid = currentPeriodId();
  if (!pid) return aiTextBlock(['아직 활성화된 주기가 없어서 확인할 게 없어.']);
  const rows = [];
  Object.entries(cache.duties || {}).forEach(([dutyId, d]) => {
    const src = d.memberIds || {};
    const undone = Object.keys(src).filter(uid => {
      const c = (((cache.completions[pid] || {})[dutyId] || {})[uid]) || {};
      return !c.done;
    });
    if (undone.length) rows.push(`· ${d.title}: ${undone.map(uid => userName(uid)).join(', ')} 미완료`);
  });
  if (!rows.length) return aiTextBlock(['이번 주기 임무는 다 완료됐어.']);
  return aiTextBlock(['아직 완료 안 된 임무가 있어.', ...rows]);
}

function aiGenNotVoted() {
  const pid = currentPeriodId();
  if (!pid) return aiTextBlock(['아직 활성화된 투표 주기가 없어.']);
  // "투표 안 함" = 이 사람이 다른 누구에게도 O/X를 아직 안 던진 경우
  const voterActivity = {};

  return aiTextBlock([`아직 한 표도 안 던진 사람이야 (${notVoted.length}명).`, ...notVoted.map(([uid, u]) => `· ${u.name}`)]);

function aiGenTopX() {

function aiGenLowestCompletion() {
  const pid = currentPeriodId();
  if (!pid) return aiTextBlock(['아직 활성화된 주기가 없어.']);

function askAI(topic) {
  aiLog.push({ topic });
  renderPage('ai');
}
function clearAiLog() { aiLog = []; renderPage('ai'); }

function renderAI() {
  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <h2>무엇을 확인할까?</h2>
      <div class="field" style="margin-bottom:12px;">
        <input id="aiSearchInput" list="aiTopicDatalist" placeholder="질문 검색... (예: 민원, 등급, 완료율)"
          oninput="filterAiTopics()" onkeydown="if(event.key==='Enter'){ aiSearchSubmit(); }">
        <datalist id="aiTopicDatalist">
          ${Object.values(AI_TOPICS).map(t => `<option value="${esc(t.q)}"></option>`).join('')}
        </datalist>
      </div>
      <div id="aiTopicButtons" style="display:flex; flex-wrap:wrap; gap:8px;">
        ${aiTopicButtonsHtml('')}
      </div>
      ${aiLog.length ? `<div style="margin-top:10px;"><button class="btn ghost small" onclick="clearAiLog()">대화 지우기</button></div>` : ''}
    </div>
    ${aiLog.length ? aiLog.map(entry => {
      const t = AI_TOPICS[entry.topic];
      return `
      <div class="card">
        <h2>💬 ${esc(t.q)}</h2>
        ${t.gen()}
      </div>`;
    }).join('') : `<div class="card"><div class="empty">위에서 궁금한 걸 눌러보거나 검색해봐. 실시간 데이터로 바로 알려줄게.</div></div>`}
  `;
}

function aiTopicButtonsHtml(query) {
  const q = query.trim().toLowerCase();
  const entries = Object.entries(AI_TOPICS).filter(([key, t]) => !q || t.q.toLowerCase().includes(q));
  if (!entries.length) return `<div style="color:var(--text-dim);font-size:12.5px;">일치하는 질문이 없어. 목록에 있는 표현으로 검색해봐.</div>`;
  return entries.map(([key, t]) => `<button class="btn ghost small" onclick="askAI('${key}')">${esc(t.q)}</button>`).join('');
}
function filterAiTopics() {
  const val = document.getElementById('aiSearchInput').value;
  document.getElementById('aiTopicButtons').innerHTML = aiTopicButtonsHtml(val);
}
function aiSearchSubmit() {
  const val = document.getElementById('aiSearchInput').value.trim().toLowerCase();
  if (!val) return;
  const exact = Object.entries(AI_TOPICS).find(([key, t]) => t.q.toLowerCase() === val);
  const match = exact || Object.entries(AI_TOPICS).find(([key, t]) => t.q.toLowerCase().includes(val));
  if (match) {
    document.getElementById('aiSearchInput').value = '';
    askAI(match[0]);
  } else {
    toast('일치하는 질문을 못 찾았어');
  }
}

        <button class="x ${myAnswer === 'X' ? 'sel' : ''}" onclick="castPollVote('${pollId}','X')">X (${tally.counts['X'] || 0})</button>

        }).join('')}

      ${voteUi}

  const prog = pid ? voteProgress() : null;
  const perfHtml = !pid ? `<div class="card"><div class="empty">활성화된 평가 주기가 없어요</div></div>` : `
    <div class="card">
      <h2>🗳️ ${esc(cache.periods[pid].label)} 동료 평가</h2>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">사용법: 이름 옆 O(잘했어요)나 X(부족했어요)를 눌러줘. 다시 누르면 바뀌고, 관리자는 누가 뭘 눌렀는지 볼 수 있어.</div>
      ${prog ? `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;"><span>내 투표 진행</span><span>${prog.done}/${prog.total}</span></div>
        <div style="height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;"><div style="height:100%;width:${prog.total ? Math.round(prog.done / prog.total * 100) : 0}%;background:var(--green-500);"></div></div>
      </div>` : ''}
      <div class="row" style="margin-bottom:12px; gap:8px;">
        <input id="voteSearchInput" placeholder="이름으로 찾기..." value="${esc(voteFilterText)}" oninput="onVoteSearchInput()" style="flex:1;">
        <button class="btn ${voteOnlyPending ? '' : 'ghost'} small" onclick="toggleVoteOnlyPending()">안 한 사람만</button>
      </div>
      <div id="voteGridContainer">${buildVoteGridHtml()}</div>
      ${prog && prog.total > 0 && prog.done === prog.total ? `<div style="margin-top:12px;font-size:13px;font-weight:700;color:var(--green-600);">🎉 전원 투표 완료했어!</div>` : ''}
    </div>`;

  document.getElementById('pageContent').innerHTML = pollsHtml + perfHtml;
}
function voteProgress() {
  const pid = currentPeriodId();
  const myVotes = cache.votes[pid] || {};
  const others = Object.entries(cache.users || {}).filter(([uid]) => uid !== currentUser.uid);
  const done = others.filter(([uid]) => (myVotes[uid] || {})[currentUser.uid]).length;
  return { done, total: others.length };
}
function buildVoteGridHtml() {
  const pid = currentPeriodId();
  if (!pid) return '';
  const myVotes = cache.votes[pid] || {};
  let others = Object.entries(cache.users || {}).filter(([uid]) => uid !== currentUser.uid);
  if (voteOnlyPending) others = others.filter(([uid]) => !((myVotes[uid] || {})[currentUser.uid]));
  if (voteFilterText.trim()) {
    const q = voteFilterText.trim().toLowerCase();
    others = others.filter(([uid, u]) => u.name.toLowerCase().includes(q));
  }
  if (!others.length) return `<div class="empty">${voteFilterText || voteOnlyPending ? '조건에 맞는 사람이 없어' : '투표할 다른 멤버가 없어요'}</div>`;
  return `<div class="vote-grid">
    ${others.map(([uid, u]) => {
      const my = (myVotes[uid] || {})[currentUser.uid];
      return `<div class="vote-card">
        <div class="name">${esc(u.name)}</div>
        <div class="ox-btns">
          <button class="o ${my === 'O' ? 'sel' : ''}" onclick="castVote('${uid}','O')">O</button>
          <button class="x ${my === 'X' ? 'sel' : ''}" onclick="castVote('${uid}','X')">X</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function onVoteSearchInput() {
  voteFilterText = document.getElementById('voteSearchInput').value;
  document.getElementById('voteGridContainer').innerHTML = buildVoteGridHtml();
}
function toggleVoteOnlyPending() {
  voteOnlyPending = !voteOnlyPending;
  renderPage('vote');
}
function pollTally(pollId) {
  const votes = cache.pollVotes[pollId] || {};
  const vals = Object.values(votes);
  const counts = {};
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  return { counts, total: vals.length };
}
function castPollVote(pollId, answer) {
  db.ref(`pollVotes/${pollId}/${currentUser.uid}`).set(answer).then(() => toast('투표했어'));
}
function castVote(targetUid, val) {
  const pid = currentPeriodId();
  db.ref(`votes/${pid}/${targetUid}/${currentUser.uid}`).set(val)
    .then(() => { toast('투표했어'); recalcGrade(targetUid); });
}
function recalcGrade(targetUid) {
  const pid = currentPeriodId();
  const votesForUser = (cache.votes[pid] || {})[targetUid] || {};
  const vals = Object.values(votesForUser);
  const oCount = vals.filter(v => v === 'O').length;
  const auto = computeAutoGrade(oCount, vals.length);
  const existing = ((cache.grades[pid] || {})[targetUid]) || {};
  if (existing.overridden) {
    db.ref(`grades/${pid}/${targetUid}/autoGrade`).set(auto);
  } else {
    db.ref(`grades/${pid}/${targetUid}`).set({ autoGrade: auto, finalGrade: auto, overridden: false });
  }
}

/* ================= GROUPS (모둠 정하기) ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function openCreateGroupSetModal() {
  openModal(`
    <h3>모둠 만들기</h3>
    <div class="field"><label>제목</label><input id="mGroupTitle" placeholder="예: 체육대회 모둠"></div>
    <div class="field"><label>모둠 개수</label><input id="mGroupCount" type="number" min="2" max="20" value="4"></div>
    <div class="err-msg" id="mGroupErr"></div>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitCreateGroupSet()">만들고 자동배정</button>
    </div>`);
}
function submitCreateGroupSet() {
  const title = document.getElementById('mGroupTitle').value.trim();
  const count = Number(document.getElementById('mGroupCount').value);
  const errEl = document.getElementById('mGroupErr');
  if (!title) { errEl.textContent = '제목을 입력해줘'; return; }
  if (!count || count < 2 || count > 20) { errEl.textContent = '모둠 개수는 2~20 사이로 해줘'; return; }
  const groups = {};
  for (let i = 1; i <= count; i++) groups[String(i)] = { name: `${i}모둠`, memberIds: {} };
  const shuffled = shuffle(Object.keys(cache.users || {}));
  shuffled.forEach((uid, idx) => {
    const gid = String((idx % count) + 1);
    groups[gid].memberIds[uid] = true;
  });
  const id = newKey('groupSets');
  db.ref('groupSets/' + id).set({ title, createdAt: Date.now(), createdBy: currentUser.uid, groups })
    .then(() => { toast('모둠을 만들고 자동배정했어'); closeModal(); });
}
function shuffleGroupSet(setId) {
  const set = cache.groupSets[setId];
  if (!set) return;
  const groupIds = Object.keys(set.groups || {});
  if (!groupIds.length) return;
  const shuffled = shuffle(Object.keys(cache.users || {}));
  const newGroups = {};
  groupIds.forEach(gid => { newGroups[gid] = { name: set.groups[gid].name, memberIds: {} }; });
  shuffled.forEach((uid, idx) => {
    const gid = groupIds[idx % groupIds.length];
    newGroups[gid].memberIds[uid] = true;
  });
  db.ref(`groupSets/${setId}/groups`).set(newGroups).then(() => toast('다시 섞었어'));
}
function moveMemberToGroup(setId, uid, targetGroupId) {
  const set = cache.groupSets[setId];
  if (!set) return;
  const updates = {};
  Object.keys(set.groups || {}).forEach(gid => {
    updates[`groupSets/${setId}/groups/${gid}/memberIds/${uid}`] = (gid === targetGroupId) ? true : null;
  });
  db.ref().update(updates).then(() => toast('모둠을 옮겼어'));
}
function deleteGroupSet(setId) {
  if (!confirm('이 모둠 편성을 삭제할까?')) return;
  db.ref('groupSets/' + setId).remove().then(() => toast('삭제했어'));
}

function renderGroups() {
  const sets = Object.entries(cache.groupSets || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  document.getElementById('pageContent').innerHTML = `

  `;
}

function submitCreateMeeting() {

      </div>`;
    } else {

      Object.values(votes).forEach(c => { tally[c] = (tally[c] || 0) + 1; });
      setupHtml = `<div class="card">
        <h2>사회자 투표</h2>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">참가자 중 사회자를 맡을 사람에게 투표해줘.</div>
        ${isParticipant ? `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
          ${participants.map(uid => `<button class="btn ${myVote === uid ? '' : 'ghost'} small" onclick="castModeratorVote('${meetingId}','${uid}')">${esc(userName(uid))} (${tally[uid] || 0}표)</button>`).join('')}
        </div>` : ''}
        ${isAdmin() ? `<button class="btn small" onclick="finalizeModeratorVote('${meetingId}')">투표 마감하고 확정</button>` : `<div style="font-size:12px;color:var(--text-dim);">관리자가 투표를 마감하면 회의가 시작돼요</div>`}
      </div>`;
    }
  }

  const messages = Object.entries(cache.meetingMessages[meetingId] || {}).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

  const chatHtml = (m.status === 'active' || m.status === 'ended') ? `
    <div class="card">
      <h2>💬 채팅 ${m.moderatorUid ? `<span style="color:var(--text-dim);font-weight:600;font-size:12px;">· 사회자: ${esc(userName(m.moderatorUid))}</span>` : ''}</h2>
      ${m.conclusion ? `<div class="chat-system conclude" style="margin-bottom:10px;">✅ 결론: ${esc(m.conclusion.text)}</div>` : ''}
      <div class="chat-wrap" id="chatWrap">
        ${messages.length ? messages.map(([msgId, msg]) => renderChatMessage(meetingId, msgId, msg)).join('') : `<div class="empty">아직 메시지가 없어요</div>`}
      </div>
      ${m.status === 'active' && isParticipant ? `
        ${isModerator ? `<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">사회자 명령어: @결론 내용 · @공지 내용 · @투표 질문 · @지목 이름 · @종료</div>` : ''}
        <div class="row">
          <input id="meetingChatInput" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter'){ sendMeetingMessage('${meetingId}'); }" style="flex:1;">
          <button class="btn" onclick="sendMeetingMessage('${meetingId}')">전송</button>
        </div>` : m.status === 'ended' ? `<div class="empty">회의가 종료됐어요</div>` : `<div class="empty">참가자만 채팅할 수 있어요</div>`}
    </div>` : '';

  document.getElementById('pageContent').innerHTML = `
