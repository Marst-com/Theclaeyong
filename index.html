<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1인1역 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green-50:#eafcf1; --green-100:#d7f7e3; --green-200:#a9edc4;
  --green-500:#1bb052; --green-600:#159244; --green-700:#0f7536;
  --bg:#eafcf1; --bg-elev:#ffffff; --bg-elev2:#eafaf0;
  --text:#16201a; --text-dim:#7c8b81; --border:#e6f4ec;
  --danger:#ef4444; --danger-soft:#fde8e8; --warn:#f59e0b;
  --gray-soft:#eef1ee; --gray-text:#6b7280;
  --indigo-a:#8b7cf6; --indigo-b:#4f46e5;
  --radius:20px; --radius-sm:14px;
  --shadow:0 10px 26px -8px rgba(27,176,82,.22), 0 3px 10px -2px rgba(27,176,82,.10);
}
[data-theme="dark"]{
  --bg:#0c1712; --bg-elev:#141f19; --bg-elev2:#1a2721;
  --text:#eef4f0; --text-dim:#8ea79a; --border:#223129;
  --green-50:#0e2317; --green-100:#123420; --gray-soft:#1a2721; --gray-text:#8ea79a;
  --shadow:0 10px 26px -8px rgba(0,0,0,.35), 0 3px 10px -2px rgba(27,176,82,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; transition:background .2s, color .2s;
}
button, input, select, textarea{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; }
input, select, textarea{
  background:var(--bg-elev); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px; font-size:14px; width:100%;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--green-500); outline-offset:-1px; }

/* ---------- Layout ---------- */
.app{ display:none; min-height:100vh; }
.app.active{ display:flex; }
.sidebar{
  width:230px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; gap:4px;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 6px 20px; }
.icon-badge{
  width:36px; height:36px; border-radius:12px; background:var(--green-600);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-badge svg{ width:18px; height:18px; stroke:#fff; }
.icon-badge.soft{ background:var(--green-100); }
.icon-badge.soft svg{ stroke:var(--green-600); }
.brand-text{ font-weight:800; font-size:15px; letter-spacing:-.2px; }
.nav-section-label{
  font-size:10.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px;
  padding:14px 12px 4px; opacity:.75;
}
.nav-section-label:first-child{ padding-top:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:14px;
  font-size:14px; font-weight:500; color:var(--text-dim); text-align:left;
}
.nav-item:hover{ background:var(--bg-elev2); color:var(--text); }
.nav-item.active{ background:var(--green-600); color:#fff; font-weight:700; }
.nav-item svg{ width:17px; height:17px; flex-shrink:0; }
.sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
.user-chip{
  display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:var(--bg-elev2);
  font-size:13px; font-weight:600;
}
.user-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--green-500); }

.main{ flex:1; padding:26px 34px 90px; overflow-y:auto; max-height:100vh; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
.topbar h1{ font-size:21px; font-weight:800; letter-spacing:-.3px; }
.topbar .sub{ font-size:13px; color:var(--text-dim); margin-top:2px; }

.theme-toggle{ display:flex; background:var(--bg-elev2); border-radius:12px; padding:3px; gap:2px; }
.theme-toggle button{ padding:6px 10px; border-radius:9px; font-size:12px; color:var(--text-dim); }
.theme-toggle button.active{ background:var(--bg-elev); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); font-weight:600; }

.card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);
}
.card h2{ font-size:15px; font-weight:800; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media(max-width:760px){ .grid2,.grid3{ grid-template-columns:1fr; } }

/* ---------- Hero / notice cards (앱 스타일) ---------- */
.hero-card{
  border-radius:24px; padding:22px 24px; margin-bottom:14px; color:#fff;
  background:linear-gradient(135deg,var(--green-500),var(--green-700));
  box-shadow:var(--shadow);
}
.hero-card .hlabel{ font-size:12px; opacity:.85; font-weight:600; margin-bottom:8px; }
.hero-card .hval{ font-size:32px; font-weight:800; display:flex; align-items:center; gap:10px; }
.hero-card .hicon{
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.22);
  display:inline-flex; align-items:center; justify-content:center; font-size:14px;
}
.notice-card{
  border-radius:24px; padding:18px 22px; margin-bottom:14px; color:#fff;
  background:linear-gradient(135deg,var(--indigo-a),var(--indigo-b));
  display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
}
.notice-card .nemoji{ font-size:22px; }
.notice-card .ntitle{ font-weight:800; font-size:15px; margin-bottom:2px; }
.notice-card .nsub{ font-size:12px; opacity:.85; display:flex; align-items:center; gap:8px; }
.notice-card .npill{ background:rgba(255,255,255,.25); padding:2px 9px; border-radius:99px; font-weight:700; font-size:11px; }

.tile-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
@media(max-width:760px){ .tile-grid{ grid-template-columns:repeat(3,1fr); } }
.tile{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:20px; padding:18px 10px;
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; position:relative;
  box-shadow:var(--shadow);
}
.tile:hover{ transform:translateY(-1px); }
.tile .ticon{
  width:46px; height:46px; border-radius:14px; background:var(--green-100);
  display:flex; align-items:center; justify-content:center;
}
.tile .ticon svg{ width:22px; height:22px; stroke:var(--green-600); }
.tile .tlabel{ font-size:12.5px; font-weight:700; }
.tile .tbadge{
  position:absolute; top:10px; right:14px; background:var(--danger); color:#fff; font-size:10px; font-weight:800;
  min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 4px;
}

.list-item{
  display:flex; align-items:center; gap:10px; padding:13px 6px; border-bottom:1px solid var(--border);
}
.list-item:last-child{ border-bottom:none; }
.list-item .ldot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.list-item .lname{ font-size:13.5px; font-weight:800; color:var(--text); flex:1; }

.btn{
  padding:10px 16px 12px; border-radius:14px; font-size:13px; font-weight:800;
  background:var(--green-500); color:#fff; display:inline-flex; align-items:center; gap:6px;
  border-bottom:3px solid var(--green-700); position:relative; top:0; transition:top .08s, border-bottom-width .08s;
}
.btn:hover{ background:var(--green-500); }
.btn:active{ top:2px; border-bottom-width:1px; }
.btn.ghost{ background:var(--bg-elev2); color:var(--text); border-bottom:3px solid var(--border); }
.btn.ghost:hover{ background:var(--bg-elev2); }
.btn.danger{ background:#f4574f; border-bottom:3px solid #b8362f; }
.btn.small{ padding:6px 10px 8px; font-size:12px; border-radius:11px; border-bottom-width:2px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.row{ display:flex; align-items:center; gap:10px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; padding:8px 10px; color:var(--text-dim); font-weight:600; border-bottom:1px solid var(--border); font-size:12px;}
td{ padding:10px 10px; border-bottom:1px solid var(--border); }
tr:last-child td{ border-bottom:none; }

/* ---------- Pill badges (대기/완료 스타일) ---------- */
.badge{ display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:800; }
.badge.grade-A{ background:#dcf7e6; color:#0f6b30; } .badge.grade-B{ background:#dbeafe; color:#1d4ed8; }
.badge.grade-C{ background:#fef3c7; color:#b45309; } .badge.grade-D{ background:#fde2e2; color:#b91c1c; }
.badge.grade-null{ background:var(--gray-soft); color:var(--gray-text); }
.badge.pending{ background:var(--gray-soft); color:var(--gray-text); }
.badge.resolved{ background:var(--green-100); color:#0f6b30; }
.badge.solid{ color:#fff; }
.badge.solid.grade-A{ background:#16a34a; color:#fff; }

td:first-child{ font-weight:700; color:var(--text); }

.chip-color{ width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:6px; vertical-align:-1px;}

.empty{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px; }
.info-banner{
  background:var(--green-50); border:1px solid var(--green-100); border-radius:14px;
  padding:12px 16px; font-size:13px; font-weight:500; color:var(--green-700);
  margin-bottom:14px; line-height:1.5;
}
[data-theme="dark"] .info-banner{ background:var(--green-50); color:#6ee89a; border-color:var(--border); }

.toast{
  position:fixed; bottom:88px; right:20px; background:var(--text); color:var(--bg);
  padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:999;
  opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateY(0); }

.modal-bg{
  position:fixed; inset:0; background:rgba(20,40,30,.45); display:none; align-items:center; justify-content:center; z-index:900; padding:20px;
}
.modal-bg.show{ display:flex; }
.modal{
  background:var(--bg-elev); border-radius:22px; border:1px solid var(--border); padding:22px; width:100%; max-width:420px;
  max-height:86vh; overflow-y:auto;
}
.modal h3{ font-size:16px; font-weight:800; margin-bottom:16px; }

.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
.login-box{ width:100%; max-width:360px; background:var(--bg-elev); padding:32px 28px; border-radius:24px; box-shadow:var(--shadow); border:1px solid var(--border); }
.login-box h1{ text-align:center; font-size:19px; font-weight:800; margin-bottom:4px; }
.login-box .sub{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:24px; }
.err-msg{ color:var(--danger); font-size:12px; margin-top:6px; min-height:14px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.vote-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.chat-wrap{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; padding:6px 2px; margin-bottom:12px; }
.chat-row{ display:flex; flex-direction:column; max-width:78%; }
.chat-row.mine{ align-self:flex-end; align-items:flex-end; }
.chat-row.theirs{ align-self:flex-start; align-items:flex-start; }
.chat-sender{ font-size:11px; color:var(--text-dim); margin-bottom:3px; padding:0 4px; font-weight:600; }
.chat-bubble{ padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.5; word-break:break-word; }
.chat-row.mine .chat-bubble{ background:var(--green-600); color:#fff; border-bottom-right-radius:4px; }
.chat-row.theirs .chat-bubble{ background:var(--bg-elev2); color:var(--text); border-bottom-left-radius:4px; }
.chat-time{ font-size:10px; color:var(--text-dim); margin-top:3px; padding:0 4px; }
.chat-system{ align-self:center; max-width:90%; text-align:center; padding:8px 14px; border-radius:12px; font-size:12.5px; font-weight:700; }
.chat-system.conclude{ background:var(--green-100); color:#0f6b30; }
.chat-system.notice{ background:#e6e2fd; color:var(--indigo-b); }
.chat-system.end{ background:var(--gray-soft); color:var(--gray-text); }
.chat-system.mention{ background:#fef3c7; color:#b45309; }
.chat-poll{ background:var(--bg-elev2); border:1px solid var(--border); border-radius:14px; padding:10px 12px; align-self:center; max-width:90%; }

/* ---------- Bottom tab bar (모바일) ---------- */
.bottom-nav{ display:none; }

/* ---- 태블릿 (768~1024px): 사이드바 좁게 + 아이콘만 ---- */
@media(max-width:1024px) and (min-width:769px){
  .sidebar{ width:64px; padding:14px 8px; overflow:hidden; }
  .brand-text, .nav-item span:not(.badge), .nav-section-label, .sidebar-foot .theme-toggle, .user-chip span:not(.dot){ display:none; }
  .nav-item{ justify-content:center; padding:12px 0; }
  .nav-item svg{ width:20px; height:20px; margin:0; }
  .sidebar-foot{ gap:6px; }
  .user-chip{ justify-content:center; padding:10px 0; }
  .sidebar-foot button.btn{ display:none; }
  .main{ padding:22px 20px 40px; }
}

/* ---- 모바일 (≤768px): 사이드바 숨김 + 하단탭 ---- */
@media(max-width:768px){
  .sidebar{ display:none; }
  .app.active{ flex-direction:column; }
  .main{ padding:16px 14px 96px; max-height:none; }
  .grid2,.grid3{ grid-template-columns:1fr; }
  .tile-grid{ grid-template-columns:repeat(3,1fr); gap:10px; }
  .card{ padding:16px 14px; }
  table{ font-size:12px; }
  th,td{ padding:7px 6px; }
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg-elev);
    border-top:1px solid var(--border);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    z-index:500; box-shadow:0 -4px 18px rgba(0,0,0,.08);
  }
  .bottom-nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px;
    color:var(--gray-text); font-weight:600; padding:4px 0; position:relative;
    transition:color .15s;
  }
  .bottom-nav button.active{ color:var(--green-600); }
  .bottom-nav button svg{ width:22px; height:22px; stroke-width:1.8; }
  .bottom-nav .bnbadge{
    position:absolute; top:0px; right:calc(50% - 18px); background:var(--danger); color:#fff; font-size:9px; font-weight:800;
    min-width:15px; height:15px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  /* 모달 모바일 최적화 */
  .modal{ max-height:92vh; border-radius:22px 22px 0 0; }
  .modal-bg{ align-items:flex-end; }
  /* 히어로 카드 모바일 */
  .hero-card{ border-radius:18px; padding:18px 18px; }
  .hero-card .hval{ font-size:26px; }
  /* 공지/채팅 인풋 영역 */
  .chat-wrap{ max-height:42vh; }
}

.hidden{ display:none !important; }
::-webkit-scrollbar{ width:6px; height:6px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div class="login-wrap" id="loadingScreen">
  <div style="text-align:center;">
    <div class="icon-badge" style="width:56px;height:56px;border-radius:18px;margin:0 auto 16px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div style="font-weight:800;font-size:18px;margin-bottom:8px;">1인1역 관리 시스템</div>
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:20px;" id="loadingMsg">연결 중...</div>
    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green-500);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;"></div>
  </div>
</div>

<!-- ============ LOADING ============ -->
<div class="login-wrap" id="loadingScreen">
  <div style="text-align:center;">
    <div class="icon-badge" style="width:56px;height:56px;border-radius:18px;margin:0 auto 16px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div style="font-weight:800;font-size:18px;margin-bottom:8px;">1인1역 관리 시스템</div>
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:20px;" id="loadingMsg">연결 중...</div>
    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green-500);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;"></div>
  </div>
</div>

<!-- ============ LOGIN ============ -->
<div class="login-wrap hidden" id="loginScreen">
  <div class="login-box">
    <div class="icon-badge" style="width:52px;height:52px;border-radius:18px;margin:0 auto 16px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>1인1역 관리 시스템</h1>
    <div class="sub">이름과 비밀번호로 로그인해줘</div>
    <div class="field"><label>이름</label><input id="loginName" placeholder="이름 입력" onkeydown="if(event.key==='Enter') document.getElementById('loginPw').focus()"></div>
    <div class="field"><label>비밀번호</label><input id="loginPw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') handleLogin()"></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:4px;" onclick="handleLogin()" id="loginBtn">로그인</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- ============ SETUP (최초 관리자 회원가입) ============ -->
<div class="login-wrap hidden" id="setupScreen">
  <div class="login-box" style="max-width:400px;">
    <div class="icon-badge" style="width:52px;height:52px;border-radius:18px;margin:0 auto 16px;background:#4f46e5;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="stroke:#fff;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    </div>
    <h1 style="font-size:17px;">관리자 계정 만들기</h1>
    <div class="sub">아직 계정이 없어요. 관리자 계정을 먼저 만들어줘.</div>
    <div class="field"><label>이름 <span style="color:var(--danger);">*</span></label><input id="setupName" placeholder="실명 입력"></div>
    <div class="field"><label>이메일 <span style="color:var(--danger);">*</span></label><input id="setupEmail" type="email" placeholder="example@email.com"></div>
    <div class="field"><label>전화번호 <span style="color:var(--danger);">*</span></label><input id="setupPhone" type="tel" placeholder="010-0000-0000" oninput="formatPhone(this)"></div>
    <div class="field"><label>비밀번호 <span style="color:var(--danger);">*</span></label>
      <input id="setupPw" type="password" placeholder="6자 이상" oninput="checkPwStrength(this.value)">
      <div style="height:4px;border-radius:2px;margin-top:4px;background:var(--gray-soft);overflow:hidden;"><div id="setupPwBar" style="height:100%;width:0%;transition:width .3s;"></div></div>
    </div>
    <div class="field"><label>비밀번호 확인 <span style="color:var(--danger);">*</span></label><input id="setupPw2" type="password" placeholder="비밀번호 재입력"></div>
    <button class="btn" style="width:100%;justify-content:center;" onclick="handleSetup()">관리자 계정 만들기</button>
    <div class="err-msg" id="setupErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="brand-text">1인1역</div>
    </div>
    <div id="navItems"></div>
    <div class="sidebar-foot">
      <div class="theme-toggle">

function init() {
  applyTheme(localStorage.getItem('theme') || 'system');

  if (!dbReady) {
    document.getElementById('loadingMsg').textContent =
      'Firebase 초기화 실패: ' + (typeof firebaseInitError !== 'undefined' ? firebaseInitError : '알 수 없는 오류') +

    return;
  }

  // 15초 타임아웃
  const timeout = setTimeout(() => {
    document.getElementById('loadingMsg').textContent =
      '연결이 너무 오래 걸려. 다음을 확인해줘:\n' +
      '1) Firebase Console > Authentication > Sign-in method > 익명 ON\n' +
      '2) Realtime Database > 규칙: ".read": "auth != null", ".write": "auth != null"\n' +
      '3) 브라우저에서 직접 열기 (클로드 미리보기에서는 외부 스크립트 차단됨)';
  }, 15000);

  auth.signInAnonymously()
    .then(() => { document.getElementById('loadingMsg').textContent = '데이터 로드 중...'; })

        ' → Firebase Console > Authentication > Sign-in method > 익명 켜줘.';
    });

  auth.onAuthStateChanged(user => {
    if (!user) return;
    clearTimeout(timeout);
    db.ref('users').once('value').then(snap => {
      const users = snap.val() || {};
      cache.users = users;
      const hasAdmin = Object.values(users).some(u => u.systemRole === 'admin');
      const saved = JSON.parse(localStorage.getItem('session') || 'null');
      if (saved && saved.uid && users[saved.uid]) {
        const u = users[saved.uid];

        attachRealtimeListeners();
        enterApp();
        return;
      }
      showScreen(!hasAdmin ? 'setup' : 'login');
      attachRealtimeListeners();
    }).catch(e => {
      clearTimeout(timeout);

function showScreen(name) {
  ['loadingScreen','loginScreen','setupScreen'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', id !== name + 'Screen');
  });
  document.getElementById('app').classList.remove('active');
}

function attachRealtimeListeners() {
  if (!dbReady) return;
  const paths = ['users', 'duties', 'completions', 'peerEvals', 'peerEvalVotes', 'complaints', 'notices', 'polls', 'pollVotes', 'memos', 'groupSets', 'meetings', 'meetingModeratorVotes', 'settings'];
  paths.forEach(path => {
    db.ref(path).on('value', snap => {
      const val = snap.val() || (path === 'settings' ? { gradeThresholds: { a: 90, b: 75, c: 50 } } : {});
      cache[path] = val;
      afterCacheUpdate(path);
    });
  });
}

let activeMeetingListener = null;
function subscribeMeetingMessages(meetingId) {
  if (activeMeetingListener) { db.ref('meetingMessages/' + activeMeetingListener).off(); activeMeetingListener = null; }
  if (!meetingId) return;
  activeMeetingListener = meetingId;
  db.ref('meetingMessages/' + meetingId).on('value', snap => {
    if (!cache.meetingMessages) cache.meetingMessages = {};
    cache.meetingMessages[meetingId] = snap.val() || {};
    afterCacheUpdate('meetingMessages');
  });
}

function afterCacheUpdate(path) {
  if (!currentUser) return;
  if (path === 'meetingMessages' || path === 'meetingModeratorVotes') {
    if (currentPage === 'meetings' && openMeetingId) {
      const inp = document.getElementById('meetingChatInput');
      if (inp && document.activeElement === inp) {
        const wrap = document.getElementById('chatWrap');
        if (wrap) {
          const msgs = Object.entries((cache.meetingMessages || {})[openMeetingId] || {}).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
          wrap.innerHTML = msgs.length ? msgs.map(([id,msg])=>renderChatMessage(openMeetingId,id,msg)).join('') : '<div class="empty">아직 메시지가 없어요</div>';
          wrap.scrollTop = wrap.scrollHeight;
        }
        return;
      }
    }
  }
  if (currentPage === 'ai') return;
  buildNav();
  renderPage(currentPage);
}

/* ---- 비밀번호 해싱 (Web Crypto / SHA-256) ---- */
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function formatPhone(input) {
  let v = input.value.replace(/\D/g,'').slice(0,11);
  if (v.length <= 3) input.value = v;
  else if (v.length <= 7) input.value = v.slice(0,3)+'-'+v.slice(3);
  else input.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
}

function checkPwStrength(pw) {
  let s = 0;
  if (pw.length>=6) s++; if (pw.length>=10) s++;
  if (/[A-Z]/.test(pw)) s++; if (/[0-9]/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  const colors=['#ef4444','#f59e0b','#eab308','#22c55e','#16a34a'];
  const bar=document.getElementById('setupPwBar');
  if(bar){bar.style.width=(s*20)+'%';bar.style.background=colors[s-1]||'#ef4444';}
}

async function handleSetup() {
  const name=document.getElementById('setupName').value.trim();
  const email=document.getElementById('setupEmail').value.trim();
  const phone=document.getElementById('setupPhone').value.trim();
  const pw=document.getElementById('setupPw').value;
  const pw2=document.getElementById('setupPw2').value;
  const errEl=document.getElementById('setupErr');
  errEl.textContent='';
  if(!name){errEl.textContent='이름을 입력해줘';return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.textContent='올바른 이메일을 입력해줘';return;}
  if(!phone||phone.replace(/\D/g,'').length<10){errEl.textContent='전화번호를 올바르게 입력해줘';return;}
  if(pw.length<6){errEl.textContent='비밀번호는 6자 이상으로 해줘';return;}
  if(pw!==pw2){errEl.textContent='비밀번호가 일치하지 않아';return;}
  const pwHash=await hashPassword(pw);
  const uid=db.ref('users').push().key;
  db.ref('users/'+uid).set({name,email,phone,password:pwHash,systemRole:'admin',createdAt:Date.now()})
    .then(()=>{currentUser={uid,name,systemRole:'admin'};localStorage.setItem('session',JSON.stringify({uid}));enterApp();})
    .catch(e=>{errEl.textContent='생성 실패: '+e.message;});
}

async function handleLogin() {
  const name=document.getElementById('loginName').value.trim();
  const pw=document.getElementById('loginPw').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  errEl.textContent='';
  if(!name||!pw){errEl.textContent='이름과 비밀번호를 입력해줘';return;}
  if(btn) btn.textContent='확인 중...';
  const pwHash=await hashPassword(pw);
  let users=cache.users||{};
  if(!Object.keys(users).length){const snap=await db.ref('users').once('value');users=snap.val()||{};cache.users=users;}
  const entry=Object.entries(users).find(([id,u])=>u.name===name&&u.password===pwHash);
  if(!entry){
    const legacy=Object.entries(users).find(([id,u])=>u.name===name&&u.password===pw);
    if(legacy){
      const[uid,lu]=legacy;
      await db.ref('users/'+uid+'/password').set(pwHash);
      currentUser={uid,name:lu.name,systemRole:lu.systemRole};
      localStorage.setItem('session',JSON.stringify({uid}));
      enterApp();return;
    }
    errEl.textContent='이름 또는 비밀번호가 맞지 않아';
    if(btn) btn.textContent='로그인';return;
  }
  const[uid,u]=entry;
  currentUser={uid,name:u.name,systemRole:u.systemRole};
  localStorage.setItem('session',JSON.stringify({uid}));
  enterApp();
}

function handleLogout() {
  currentUser=null;

function applyTheme(mode) {
  let actual = mode;
  if (mode === 'system') {
    actual = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (actual === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function syncThemeButtons() {
  const mode = localStorage.getItem('theme') || 'system';
  document.querySelectorAll('[data-theme-btn]').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === mode);

  return Object.values(cache.duties || {}).some(d => d.managerIds && d.managerIds[currentUser.uid]);

/* ---------------- 더보기 (긴 목록 접기/펼치기) ---------------- */
const expandedLists = {};
function renderExpandable(listKey, htmlItems, limit) {
  limit = limit || 5;
  const expanded = expandedLists[listKey];
  const shown = expanded ? htmlItems : htmlItems.slice(0, limit);
  let out = shown.join('');
  const remaining = htmlItems.length - limit;
  if (!expanded && remaining > 0) {
    out += `<button class="btn ghost small" style="margin-top:8px;" onclick="toggleExpand('${listKey}')">더보기 (+${remaining})</button>`;
  } else if (expanded && htmlItems.length > limit) {
    out += `<button class="btn ghost small" style="margin-top:8px;" onclick="toggleExpand('${listKey}')">접기</button>`;
  }
  return out;
}
function toggleExpand(key) {
  expandedLists[key] = !expandedLists[key];
  renderPage(currentPage);
}

function computeAutoGrade(oCount, total) {
  if (total === 0) return null;
  const ratio = (oCount / total) * 100;
  const th = (cache.settings && cache.settings.gradeThresholds) || { a: 90, b: 75, c: 50 };
  if (ratio >= th.a) return 'A';
  if (ratio >= th.b) return 'B';
  if (ratio >= th.c) return 'C';
  return 'D';
}

function navBadgeCount(id) {
    if (id === 'notices') {
    const lastSeen = Number(localStorage.getItem('noticesSeen') || 0);
    return Object.values(cache.notices || {}).filter(n => (n.createdAt || 0) > lastSeen).length;
  }
  if (id === 'meetings') {
    return Object.entries(cache.meetings || {}).filter(([mid, m]) =>
      m.status === 'setup' && m.moderatorMode === 'vote' &&
      m.participantIds && m.participantIds[currentUser.uid] &&
      !((cache.meetingModeratorVotes[mid] || {})[currentUser.uid])
    ).length;
  }
  if (id === 'notices') {
    const readNotices = JSON.parse(localStorage.getItem('readNotices') || '[]');
    return Object.keys(cache.notices || {}).filter(id => !readNotices.includes(id)).length;
  }
  if (id === 'memos') {
    return Object.values(cache.memos || {}).filter(m => m.toUid === currentUser.uid && !m.read).length;
  }
  if (id === 'checks') {
    let count = 0;
    myManagedDuties().forEach(([dutyId, d]) => {
      Object.keys(d.memberIds || {}).forEach(uid => {
        const c = ((cache.completions[dutyId] || {})[uid]) || {};
        if (!c.done) count++;
      });
    });
    return count;
  }
  if (id === 'vote') {
    const myUnvoted = Object.entries(cache.polls || {}).filter(([pid, p]) => p.approved && !p.closed && !(cache.pollVotes[pid] || {})[currentUser.uid]).length;
    const pendingApproval = isAdmin() ? Object.values(cache.polls || {}).filter(p => !p.approved && !p.closed).length : 0;
    const peerPending = isAdmin() ? Object.values(cache.peerEvals || {}).filter(p => !p.approved && !p.closed).length : 0;
    return myUnvoted + pendingApproval + peerPending;
  }
  if (id === 'complaints') {
    if (!isAdmin()) return 0;
    return Object.values(cache.complaints || {}).filter(c => c.status === 'pending').length;
  }
  if (id === 'apply') {
    if (isAdmin()) {
      let count = 0;
      Object.values(cache.duties || {}).forEach(d => {
        Object.values(d.applications || {}).forEach(a => { if (a.status === 'pending') count++; });
      });
      return count;
    }
    let count = 0;
    Object.entries(cache.duties || {}).forEach(([dutyId, d]) => {
      Object.entries(d.applications || {}).forEach(([applicantUid, a]) => {
        if (a.status !== 'pending' || applicantUid === currentUser.uid) return;
        const myVote = ((cache.applicationVotes[dutyId] || {})[applicantUid] || {})[currentUser.uid];
        if (!myVote) count++;
      });
    });
    return count;
  }
  return 0;
}

    const count = navBadgeCount(it.id);
    const sectionHeader = it.section !== lastSection ? `<div class="nav-section-label">${esc(it.section)}</div>` : '';

    return `${sectionHeader}
    <button class="nav-item" data-nav="${it.id}" onclick="renderPage('${it.id}')">

async function submitCreateAccount() {
  if (!isAdmin()) { toast('관리자만 계정을 만들 수 있어'); closeModal(); return; }
  const name = document.getElementById('mAccName').value.trim();
  const pw = document.getElementById('mAccPw').value;
  const role = document.getElementById('mAccRole').value;
  const errEl = document.getElementById('mAccErr');
  if (!name || !pw) { errEl.textContent = '이름과 비밀번호를 입력해줘'; return; }
  if (pw.length < 4) { errEl.textContent = '비밀번호는 4자 이상'; return; }
  if (Object.values(cache.users).some(u => u.name === name)) { errEl.textContent = '이미 있는 이름이야'; return; }
  const pwHash = await hashPassword(pw);
  const uid = newKey('users');
  db.ref('users/' + uid).set({ name, password: pwHash, systemRole: role, createdAt: Date.now() })
    .then(() => { toast('계정을 만들었어'); closeModal(); });
}
function toggleAdmin(uid) {
  if (!isAdmin()) { toast('권한 없어'); return; }
  const u = cache.users[uid];
  db.ref('users/' + uid + '/systemRole').set(u.systemRole === 'admin' ? 'user' : 'admin')
    .then(() => toast('권한을 변경했어'));
}
function deleteAccount(uid) {
  if (!isAdmin()) { toast('권한 없어'); return; }
  if (!confirm(userName(uid) + ' 계정을 삭제할까?')) return;
  db.ref('users/' + uid).remove().then(() => toast('삭제했어'));
}

function dutyApplications(dutyId) {
  return (cache.duties[dutyId] && cache.duties[dutyId].applications) || {};
}
function applyForDuty(dutyId) {
  db.ref(`duties/${dutyId}/applications/${currentUser.uid}`).set({
    appliedAt: Date.now(), status: 'pending'
  }).then(() => toast('신청했어! 관리자가 검토할 거야'));
}
function withdrawApplication(dutyId) {
  if (!confirm('신청을 취소할까?')) return;
  db.ref(`duties/${dutyId}/applications/${currentUser.uid}`).remove()
    .then(() => toast('신청을 취소했어'));
}
function approveApplication(dutyId, applicantUid) {
if (!isAdmin()) { toast("권한 없어"); return; }
    db.ref(`duties/${dutyId}/memberIds/${applicantUid}`).set(true)
    .then(() => db.ref(`duties/${dutyId}/applications/${applicantUid}/status`).set('approved'))
    .then(() => toast('승인했어. 멤버로 추가됐어'));
}
function rejectApplication(dutyId, applicantUid) {
if (!isAdmin()) { toast("권한 없어"); return; }
    db.ref(`duties/${dutyId}/applications/${applicantUid}/status`).set('rejected')
    .then(() => toast('거절 처리했어'));
}

function aiNLU(text) {
  const t = text.toLowerCase().replace(/[?？]/g, '');
  const scores = new Map();
  for (const intent of AI_INTENTS) {
    let score = 0;
    for (const k of intent.keys) {
      if (t.includes(k)) score += intent.weight;
    }
    if (score > 0) scores.set(intent, score);
  }
  if (!scores.size) return [];
  // 최고점 기준으로 70% 이상인 인텐트만 선택 (노이즈 필터)
  const maxScore = Math.max(...scores.values());
  const threshold = maxScore * 0.7;
  return [...scores.entries()].filter(([, s]) => s >= threshold).map(([i]) => i.fn);
}

function aiAnswer(text) {
  const t = text.trim();
  if (!t) return aiProse(['질문을 입력해줘!']);
  const fns = aiNLU(t);
  if (!fns.length) return aiUnknown(t);
  if (fns.length === 1) return fns[0](t);
  const parts = fns.map(fn => fn(t));
  return parts.join('<hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">');
}

    `이런 질문을 해봐: <span style="color:var(--green-600);">${suggestions.map(s => `"${s}"`).join(' · ')}</span>`
  ]);
}

  return `<div style="line-height:1.9;font-size:13.5px;">${sentences.join('<br>')}</div>`;

function aiRecommendRows() {
  const rows = [];
  Object.entries(cache.duties || {}).forEach(([dutyId, d]) => {
    Object.entries(dutyApplications(dutyId)).forEach(([uid, a]) => {
      if (a.status !== 'pending') return;
      const t = { o: 0, x: 0, total: 0 }; // 동료투표 제거됨
      let verdict, cls, dot;
      if (t.total === 0) { verdict = '투표 없음 · 보류'; cls = 'pending'; dot = 'var(--gray-text)'; }
      else if (t.o > t.x) { verdict = '승인 추천'; cls = 'resolved'; dot = 'var(--green-500)'; }
      else if (t.x > t.o) { verdict = '거절 추천'; cls = 'grade-D'; dot = 'var(--danger)'; }
      else { verdict = '동률 · 판단 필요'; cls = 'pending'; dot = 'var(--warn)'; }
      rows.push({ dutyId, dutyTitle: d.title, uid, name: userName(uid), o: t.o, x: t.x, verdict, cls, dot });
    });
  });
  return rows;
}

  if (active.length) lines.push(`🟢 진행 중: ${active.map(([, m]) => `<b>${esc(m.title)}</b>`).join(', ')}`);
  if (setup.length) lines.push(`🟡 준비 중: ${setup.map(([, m]) => `<b>${esc(m.title)}</b>`).join(', ')}`);
  if (!active.length && !setup.length) lines.push('현재 진행 중이거나 준비 중인 회의가 없어.');
  lines.push(`전체 ${all.length}개 회의 기록이 있어.`);
  return aiProse(lines);
}

function aiSend() {
  const input = document.getElementById('aiChatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  aiConversation.push({ role: 'user', text, ts: Date.now() });
  // 짧은 딜레이 후 응답 (더 자연스럽게)
  const answerHtml = aiAnswer(text);
  setTimeout(() => {
    aiConversation.push({ role: 'ai', text: '', html: answerHtml, ts: Date.now() });
    renderPage('ai');
    setTimeout(() => {
      const wrap = document.getElementById('aiChatWrap');
      if (wrap) wrap.scrollTop = wrap.scrollHeight;
    }, 50);
  }, 320);

}

function pollTally(pollId) {
  const votes = cache.pollVotes[pollId] || {};
  const vals = Object.values(votes);
  const counts = {};
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  return { counts, total: vals.length };
}

function renderVote() {
  const activePolls = Object.entries(cache.polls || {})
    .filter(([id, p]) => p.approved && !p.closed)
    .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  const pendingPolls = Object.entries(cache.polls || {}).filter(([id, p]) => !p.approved && !p.closed);
  const activePeerEvals = Object.entries(cache.peerEvals || {}).filter(([id, p]) => p.approved && !p.closed);
  const pendingPeerEvals = Object.entries(cache.peerEvals || {}).filter(([id, p]) => !p.approved && !p.closed);

  const pollsHtml = activePolls.map(([pollId, p]) => {
    const votes = cache.pollVotes[pollId] || {};
    const myAnswer = votes[currentUser.uid];
    const tally = pollTally(pollId);
    let voteUi;
    if (p.type === 'ox') {
      voteUi = `<div style="display:flex;gap:12px;max-width:280px;">
        <button onclick="castPollVote('${pollId}','O')" style="flex:1;padding:18px 0;border-radius:16px;font-size:22px;font-weight:900;border:3px solid ${myAnswer==='O'?'var(--green-600)':'var(--border)'};background:${myAnswer==='O'?'var(--green-600)':'var(--bg-elev2)'};color:${myAnswer==='O'?'#fff':'var(--text)'};cursor:pointer;">O<br><span style="font-size:12px;font-weight:600;">${tally.counts['O']||0}표</span></button>
        <button onclick="castPollVote('${pollId}','X')" style="flex:1;padding:18px 0;border-radius:16px;font-size:22px;font-weight:900;border:3px solid ${myAnswer==='X'?'var(--danger)':'var(--border)'};background:${myAnswer==='X'?'var(--danger)':'var(--bg-elev2)'};color:${myAnswer==='X'?'#fff':'var(--text)'};cursor:pointer;">X<br><span style="font-size:12px;font-weight:600;">${tally.counts['X']||0}표</span></button>
      </div>`;
    } else {

              <button onclick="castPeerVote('${evalId}','${uid}','X')" style="flex:1;padding:8px 0;border-radius:10px;font-size:16px;font-weight:900;border:2px solid ${my==='X'?'var(--danger)':'var(--border)'};background:${my==='X'?'var(--danger)':'var(--bg-elev)'};color:${my==='X'?'#fff':'var(--text)'};cursor:pointer;">X</button>

  const approvalHtml = isAdmin() && (pendingPolls.length || pendingPeerEvals.length) ? `

      <h2>📥 승인 대기 <span style="color:var(--text-dim);font-weight:600;font-size:12px;">· ${pendingPolls.length + pendingPeerEvals.length}건</span></h2>

function submitGradeThresholds() {
if (!isAdmin()) { toast("권한 없어"); return; }
    const a = Number(document.getElementById('mThA').value);
  const b = Number(document.getElementById('mThB').value);
  const c = Number(document.getElementById('mThC').value);
  const errEl = document.getElementById('mThErr');
  if ([a, b, c].some(v => isNaN(v) || v < 0 || v > 100)) { errEl.textContent = '0~100 사이 숫자로 입력해줘'; return; }
  if (!(a > b && b > c)) { errEl.textContent = 'A > B > C 순서로 큰 값이어야 해'; return; }
  errEl.textContent = '';
  db.ref('settings/gradeThresholds').set({ a, b, c }).then(() => toast('등급 기준값을 저장했어'));
}
function openCreatePollModal() {
  openModal(`
    <h3>설문 만들기</h3>
    <div class="field"><label>질문</label><input id="mPollQ" placeholder="예: 이번 학기 반장 후보는?"></div>

function submitCreatePoll() {
if (!isAdmin()) { toast("권한 없어"); return; }
    const question = document.getElementById('mPollQ').value.trim();
  const type = document.getElementById('mPollType').value;
  const errEl = document.getElementById('mPollErr');
  if (!question) { errEl.textContent = '질문을 입력해줘'; return; }
  let options = [];
  if (type === 'choice') {
    options = document.getElementById('mPollOptions').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (options.length < 2) { errEl.textContent = '선택지를 2개 이상 입력해줘'; return; }
  }
  const id = newKey('polls');
  db.ref('polls/' + id).set({ question, type, options, createdBy: currentUser.uid, createdAt: Date.now(), closed: false, approved: isAdmin() })
    .then(() => { toast('설문을 만들었어'); closeModal(); });
}
function closePoll(id) {
if (!isAdmin()) { toast("권한 없어"); return; }
    db.ref('polls/' + id + '/closed').set(true).then(() => toast('설문을 마감했어'));
}
function deletePoll(id) {
if (!isAdmin()) { toast("권한 없어"); return; }
    if (!confirm('이 설문을 삭제할까? 투표 기록도 같이 삭제돼.')) return;
  db.ref('polls/' + id).remove()
    .then(() => db.ref('pollVotes/' + id).remove())
    .then(() => toast('삭제했어'));
}


function activatePeriod(id) {

function submitCreateGroupSet() {
if (!isAdmin()) { toast("권한 없어"); return; }
    const title = document.getElementById('mGroupTitle').value.trim();
  const count = Number(document.getElementById('mGroupCount').value);
  const errEl = document.getElementById('mGroupErr');
  if (!title) { errEl.textContent = '제목을 입력해줘'; return; }
  if (!count || count < 2 || count > 20) { errEl.textContent = '모둠 개수는 2~20 사이로 해줘'; return; }
  const groups = {};
  for (let i = 1; i <= count; i++) groups[String(i)] = { name: `${i}모둠`, memberIds: {} };
  const shuffled = shuffle(Object.keys(cache.users || {}));
  shuffled.forEach((uid, idx) => {
    const gid = String((idx % count) + 1);
    groups[gid].memberIds[uid] = true;
  });
  const id = newKey('groupSets');
  db.ref('groupSets/' + id).set({ title, createdAt: Date.now(), createdBy: currentUser.uid, groups })
    .then(() => { toast('모둠을 만들고 자동배정했어'); closeModal(); });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleGroupSet(setId) {
if (!isAdmin()) { toast("권한 없어"); return; }
    const set = cache.groupSets[setId];
  if (!set) return;
  const groupIds = Object.keys(set.groups || {});
  if (!groupIds.length) return;
  const shuffled = shuffle(Object.keys(cache.users || {}));
  const newGroups = {};
  groupIds.forEach(gid => { newGroups[gid] = { name: set.groups[gid].name, memberIds: {} }; });
  shuffled.forEach((uid, idx) => {
    const gid = groupIds[idx % groupIds.length];
    newGroups[gid].memberIds[uid] = true;
  });
  db.ref(`groupSets/${setId}/groups`).set(newGroups).then(() => toast('다시 섞었어'));
}

function deleteGroupSet(setId) {
if (!isAdmin()) { toast("권한 없어"); return; }

}

function renderChatMessage(meetingId, msgId, msg) {
  const mine = msg.uid === currentUser.uid;
  const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  if (msg.type === 'system') {
    const cls = msg.command === '결론' ? 'conclude' : msg.command === '공지' ? 'notice' : msg.command === '지목' ? 'mention' : 'end';
    const emoji = msg.command === '결론' ? '✅' : msg.command === '공지' ? '📢' : msg.command === '지목' ? '👋' : '🔚';
    return `<div class="chat-system ${cls}">${emoji} ${esc(msg.text)}</div>`;
  }
  if (msg.type === 'poll') {
    const votes = msg.pollVotes || {};
    const oCount = Object.values(votes).filter(v => v === 'O').length;
    const xCount = Object.values(votes).filter(v => v === 'X').length;
    const my = votes[currentUser.uid];
    return `<div class="chat-poll">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">📊 ${esc(msg.text)}</div>
      <div class="ox-btns">
        <button class="o ${my === 'O' ? 'sel' : ''}" onclick="castMeetingPollVote('${meetingId}','${msgId}','O')">O (${oCount})</button>
        <button class="x ${my === 'X' ? 'sel' : ''}" onclick="castMeetingPollVote('${meetingId}','${msgId}','X')">X (${xCount})</button>
      </div>
    </div>`;
  }
  return `<div class="chat-row ${mine ? 'mine' : 'theirs'}">
    ${!mine ? `<div class="chat-sender">${esc(userName(msg.uid))}</div>` : ''}
    <div class="chat-bubble">${esc(msg.text)}</div>
    <div class="chat-time">${time}</div>
  </div>`;
}

function finalizeModeratorVote(meetingId) {
if (!isAdmin()) { toast("권한 없어"); return; }
    const votes = cache.meetingModeratorVotes[meetingId] || {};
  const tally = {};
  Object.values(votes).forEach(c => { tally[c] = (tally[c] || 0) + 1; });
  const entries = Object.entries(tally);
  if (!entries.length) { toast('아직 투표가 없어'); return; }
  entries.sort((a, b) => b[1] - a[1]);
  const winner = entries[0][0];
  db.ref(`meetings/${meetingId}`).update({ moderatorUid: winner, status: 'active' }).then(() => toast(userName(winner) + '님이 사회자로 확정됐어'));
}

function sendMeetingMessage(meetingId) {
  const input = document.getElementById('meetingChatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const m = cache.meetings[meetingId];
  if (!m || m.status !== 'active') { toast('종료된 회의야'); return; }
  const isModerator = m.moderatorUid === currentUser.uid;
  const match = text.match(/^@(\S+)\s*([\s\S]*)$/);
  const commandWord = match ? match[1] : null;
  const payload = match ? match[2].trim() : '';

  if (isModerator && commandWord && MEETING_COMMANDS.includes(commandWord)) {
    handleMeetingCommand(meetingId, commandWord, payload);
  } else {
    const id = newKey(`meetingMessages/${meetingId}`);
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text, type: 'message', createdAt: Date.now() });
  }
  input.value = '';
  input.focus();
}

function handleMeetingCommand(meetingId, command, payload) {
  const id = newKey(`meetingMessages/${meetingId}`);
  if (command === '결론') {
    if (!payload) { toast('@결론 뒤에 내용을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'system', command: '결론', createdAt: Date.now() });
    db.ref(`meetings/${meetingId}`).update({ conclusion: { text: payload, decidedBy: currentUser.uid, decidedAt: Date.now() }, status: 'ended' });
    toast('결론을 내리고 회의를 종료했어');
  } else if (command === '공지') {
    if (!payload) { toast('@공지 뒤에 내용을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'system', command: '공지', createdAt: Date.now() });
  } else if (command === '종료') {
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: '회의가 종료됐어요', type: 'system', command: '종료', createdAt: Date.now() });
    db.ref(`meetings/${meetingId}/status`).set('ended');
    toast('회의를 종료했어');
  } else if (command === '지목') {
    const mm = cache.meetings[meetingId];
    const target = Object.keys(mm.participantIds || {}).find(uid => userName(uid) === payload);
    if (!target) { toast('참가자 중에 그 이름을 못 찾았어'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: `${esc(userName(target))}님, 발언해주세요`, type: 'system', command: '지목', mentionUid: target, createdAt: Date.now() });
  } else if (command === '투표') {
    if (!payload) { toast('@투표 뒤에 질문을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'poll', command: '투표', pollOptions: ['O', 'X'], pollVotes: {}, createdAt: Date.now() });
  }
}

function castMeetingPollVote(meetingId, msgId, answer) {
  db.ref(`meetingMessages/${meetingId}/${msgId}/pollVotes/${currentUser.uid}`).set(answer);
}

function renderMe() {
  const info = cache.users[currentUser.uid] || {};
  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <h2>내 정보</h2>
      <table>
        <tbody>
          <tr><td style="width:110px;color:var(--text-dim);">이름</td><td>${esc(info.name)}</td></tr>
          <tr><td style="color:var(--text-dim);">권한</td><td>${info.systemRole === 'admin' ? '전체관리자' : '멤버'}</td></tr>
          <tr><td style="color:var(--text-dim);">가입일</td><td>${info.createdAt ? new Date(info.createdAt).toLocaleDateString('ko-KR') : '-'}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>비밀번호 변경</h2>
      <div class="field"><label>현재 비밀번호</label><input id="mePwCurrent" type="password"></div>
      <div class="field"><label>새 비밀번호</label><input id="mePwNew" type="password" placeholder="4자 이상"></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="mePwNew2" type="password"></div>
      <div class="err-msg" id="mePwErr"></div>
      <button class="btn" onclick="submitChangePassword()">변경하기</button>
    </div>
  `;
}

async function submitChangePassword() {
  const cur = document.getElementById('mePwCurrent').value;
  const next = document.getElementById('mePwNew').value;
  const next2 = document.getElementById('mePwNew2').value;
  const errEl = document.getElementById('mePwErr');
  const info = cache.users[currentUser.uid] || {};
  errEl.textContent = '';
  const curHash = await hashPassword(cur);
  // 해시 비교, 구버전 평문 호환
  if (curHash !== info.password && cur !== info.password) { errEl.textContent = '현재 비밀번호가 맞지 않아'; return; }
  if (next.length < 4) { errEl.textContent = '새 비밀번호는 4자 이상으로 해줘'; return; }
  if (next !== next2) { errEl.textContent = '새 비밀번호 확인이 서로 달라'; return; }
  const nextHash = await hashPassword(next);
  db.ref('users/' + currentUser.uid + '/password').set(nextHash).then(() => {
    toast('비밀번호를 변경했어');
    ['mePwCurrent', 'mePwNew', 'mePwNew2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  });
}

function renderMyDuties() {
  const myDuties = Object.entries(cache.duties || {}).filter(([id, d]) => d.memberIds && d.memberIds[currentUser.uid]);
  const pid = currentPeriodId();
  const pastPeriods = Object.entries(cache.periods || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0)).slice(0, 6);

  document.getElementById('pageContent').innerHTML = `
    <div class="info-banner">🎯 내가 맡은 1인1역이야. 이번 주기 완료 상태를 확인할 수 있어. 역할을 더 맡고 싶으면 <button class="btn small" style="padding:3px 8px;font-size:11px;vertical-align:middle;" onclick="renderPage('apply')">1인1역 신청</button>을 눌러봐.</div>
    ${myDuties.length ? myDuties.map(([dutyId, d]) => {
      const curDone = pid ? !!(((cache.completions[pid] || {})[dutyId] || {})[currentUser.uid] || {}).done : null;
      return `
      <div class="card" style="border-left:4px solid ${d.color};">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="font-size:26px;">${curDone ? '✅' : '⏳'}</div>
          <div style="flex:1;">
            <div style="font-weight:800;font-size:15px;">${esc(d.title)}</div>
            <div style="font-size:12px;color:var(--text-dim);">이번 주기 · ${curDone ? '완료됨' : pid ? '아직 완료 전이야' : '주기 없음'}</div>
          </div>
          ${pid ? `<span class="badge ${curDone ? 'resolved' : 'grade-C'}">${curDone ? '완료' : '대기중'}</span>` : ''}
        </div>
        ${pastPeriods.length > 1 ? `
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">지난 기록</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          ${pastPeriods.map(([pId, p]) => {
            const done = !!(((cache.completions[pId] || {})[dutyId] || {})[currentUser.uid] || {}).done;
            return `<span style="padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:${done?'var(--green-100)':'var(--gray-soft)'};color:${done?'var(--green-700)':'var(--gray-text)'};">${esc(p.label.slice(-4))} ${done?'✓':'·'}</span>`;
          }).join('')}
        </div>` : ''}
      </div>`;
    }).join('') : `
    <div class="card" style="text-align:center;padding:40px 20px;">
      <div style="font-size:40px;margin-bottom:12px;">🌱</div>
      <div style="font-weight:800;font-size:16px;margin-bottom:8px;">아직 맡은 1인1역이 없어요</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">1인1역을 신청하면 동료 투표를 거쳐 배정받을 수 있어요.</div>
      <button class="btn" onclick="renderPage('apply')">1인1역 신청하러 가기</button>
    </div>`}
  `;
}

function toggleNoticePin(id, pinned) {
  if (!isAdmin()) return;

}

function submitNotice() {
  if (!isAdmin()) { toast('권한 없어'); return; }
  const title = document.getElementById('noticeTitle').value.trim();
