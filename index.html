}

function renderChatMessage(meetingId, msgId, msg) {
  const mine = msg.uid === currentUser.uid;
  const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  if (msg.type === 'system') {
    const cls = msg.command === '결론' ? 'conclude' : msg.command === '공지' ? 'notice' : msg.command === '지목' ? 'mention' : 'end';
    const emoji = msg.command === '결론' ? '✅' : msg.command === '공지' ? '📢' : msg.command === '지목' ? '👋' : '🔚';
    return `<div class="chat-system ${cls}">${emoji} ${esc(msg.text)}</div>`;
  }
  if (msg.type === 'poll') {
    const votes = msg.pollVotes || {};
    const oCount = Object.values(votes).filter(v => v === 'O').length;
    const xCount = Object.values(votes).filter(v => v === 'X').length;
    const my = votes[currentUser.uid];
    return `<div class="chat-poll">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">📊 ${esc(msg.text)}</div>
      <div class="ox-btns">
        <button class="o ${my === 'O' ? 'sel' : ''}" onclick="castMeetingPollVote('${meetingId}','${msgId}','O')">O (${oCount})</button>
        <button class="x ${my === 'X' ? 'sel' : ''}" onclick="castMeetingPollVote('${meetingId}','${msgId}','X')">X (${xCount})</button>
      </div>
    </div>`;
  }
  return `<div class="chat-row ${mine ? 'mine' : 'theirs'}">
    ${!mine ? `<div class="chat-sender">${esc(userName(msg.uid))}</div>` : ''}
    <div class="chat-bubble">${esc(msg.text)}</div>
    <div class="chat-time">${time}</div>
  </div>`;
}

function assignModeratorDirect(meetingId, uid) {
  db.ref(`meetings/${meetingId}`).update({ moderatorUid: uid, status: 'active' }).then(() => toast('사회자를 지정하고 회의를 시작했어'));
}
function castModeratorVote(meetingId, candidateUid) {
  db.ref(`meetingModeratorVotes/${meetingId}/${currentUser.uid}`).set(candidateUid).then(() => toast('투표했어'));
}
function finalizeModeratorVote(meetingId) {
  const votes = cache.meetingModeratorVotes[meetingId] || {};
  const tally = {};
  Object.values(votes).forEach(c => { tally[c] = (tally[c] || 0) + 1; });
  const entries = Object.entries(tally);
  if (!entries.length) { toast('아직 투표가 없어'); return; }
  entries.sort((a, b) => b[1] - a[1]);
  const winner = entries[0][0];
  db.ref(`meetings/${meetingId}`).update({ moderatorUid: winner, status: 'active' }).then(() => toast(userName(winner) + '님이 사회자로 확정됐어'));
}

const MEETING_COMMANDS = ['결론', '공지', '종료', '지목', '투표'];
function sendMeetingMessage(meetingId) {
  const input = document.getElementById('meetingChatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const m = cache.meetings[meetingId];
  if (!m || m.status !== 'active') { toast('종료된 회의야'); return; }
  const isModerator = m.moderatorUid === currentUser.uid;
  const match = text.match(/^@(\S+)\s*([\s\S]*)$/);
  const commandWord = match ? match[1] : null;
  const payload = match ? match[2].trim() : '';

  if (isModerator && commandWord && MEETING_COMMANDS.includes(commandWord)) {
    handleMeetingCommand(meetingId, commandWord, payload);
  } else {
    const id = newKey(`meetingMessages/${meetingId}`);
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text, type: 'message', createdAt: Date.now() });
  }
  input.value = '';
  input.focus();
}
function handleMeetingCommand(meetingId, command, payload) {
  const id = newKey(`meetingMessages/${meetingId}`);
  if (command === '결론') {
    if (!payload) { toast('@결론 뒤에 내용을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'system', command: '결론', createdAt: Date.now() });
    db.ref(`meetings/${meetingId}`).update({ conclusion: { text: payload, decidedBy: currentUser.uid, decidedAt: Date.now() }, status: 'ended' });
    toast('결론을 내리고 회의를 종료했어');
  } else if (command === '공지') {
    if (!payload) { toast('@공지 뒤에 내용을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'system', command: '공지', createdAt: Date.now() });
  } else if (command === '종료') {
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: '회의가 종료됐어요', type: 'system', command: '종료', createdAt: Date.now() });
    db.ref(`meetings/${meetingId}/status`).set('ended');
    toast('회의를 종료했어');
  } else if (command === '지목') {
    const mm = cache.meetings[meetingId];
    const target = Object.keys(mm.participantIds || {}).find(uid => userName(uid) === payload);
    if (!target) { toast('참가자 중에 그 이름을 못 찾았어'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: `${userName(target)}님, 발언해주세요`, type: 'system', command: '지목', mentionUid: target, createdAt: Date.now() });
  } else if (command === '투표') {
    if (!payload) { toast('@투표 뒤에 질문을 적어줘'); return; }
    db.ref(`meetingMessages/${meetingId}/${id}`).set({ uid: currentUser.uid, text: payload, type: 'poll', command: '투표', pollOptions: ['O', 'X'], pollVotes: {}, createdAt: Date.now() });
  }
}
function castMeetingPollVote(meetingId, msgId, answer) {
  db.ref(`meetingMessages/${meetingId}/${msgId}/pollVotes/${currentUser.uid}`).set(answer);
}

function renderMe() {
  const info = cache.users[currentUser.uid] || {};
  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <h2>내 정보</h2>
      <table>
        <tbody>
          <tr><td style="width:110px;color:var(--text-dim);">이름</td><td>${esc(info.name)}</td></tr>
          <tr><td style="color:var(--text-dim);">권한</td><td>${info.systemRole === 'admin' ? '전체관리자' : '멤버'}</td></tr>
          <tr><td style="color:var(--text-dim);">가입일</td><td>${info.createdAt ? new Date(info.createdAt).toLocaleDateString('ko-KR') : '-'}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>비밀번호 변경</h2>
      <div class="field"><label>현재 비밀번호</label><input id="mePwCurrent" type="password"></div>
      <div class="field"><label>새 비밀번호</label><input id="mePwNew" type="password" placeholder="4자 이상"></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="mePwNew2" type="password"></div>
      <div class="err-msg" id="mePwErr"></div>
      <button class="btn" onclick="submitChangePassword()">변경하기</button>
    </div>
  `;
}
function submitChangePassword() {
  const cur = document.getElementById('mePwCurrent').value;
  const next = document.getElementById('mePwNew').value;
  const next2 = document.getElementById('mePwNew2').value;
  const errEl = document.getElementById('mePwErr');
  const info = cache.users[currentUser.uid] || {};
  errEl.textContent = '';
  if (cur !== info.password) { errEl.textContent = '현재 비밀번호가 맞지 않아'; return; }
  if (next.length < 4) { errEl.textContent = '새 비밀번호는 4자 이상으로 해줘'; return; }
  if (next !== next2) { errEl.textContent = '새 비밀번호 확인이 서로 달라'; return; }
  db.ref('users/' + currentUser.uid + '/password').set(next).then(() => {
    toast('비밀번호를 변경했어');
    ['mePwCurrent', 'mePwNew', 'mePwNew2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  });
}

function renderSettings() {
  if (!isAdmin()) return renderNoAccess();
  const periods = Object.entries(cache.periods || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  const cats = Object.entries(cache.complaintCategories || {});
  const polls = Object.entries(cache.polls || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  const th = (cache.settings && cache.settings.gradeThresholds) || { a: 90, b: 75, c: 50 };
  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <h2>투표 주기 <button class="btn small" style="margin-left:auto;" onclick="openCreatePeriodModal()">+ 새 주기</button></h2>
      <table>
        <thead><tr><th>이름</th><th>종류</th><th>상태</th><th></th></tr></thead>
        <tbody>
        ${periods.length ? periods.map(([id, p]) => `
          <tr>
            <td>${esc(p.label)}</td>
            <td>${p.type === 'weekly' ? '주간' : '월간'}</td>
            <td>${id === cache.settings.currentPeriodId ? '<span class="badge grade-A">활성</span>' : '-'}</td>
            <td>${id === cache.settings.currentPeriodId ? '' : `<button class="btn ghost small" onclick="activatePeriod('${id}')">활성화</button>`}</td>
          </tr>`).join('') : `<tr><td colspan="4" class="empty">주기가 없어요</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>설문 투표 <button class="btn small" style="margin-left:auto;" onclick="openCreatePollModal()">+ 설문 만들기</button></h2>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">O/X 또는 객관식(1,2,3...) 설문을 만들 수 있어. "주간 투표" 탭에 자동으로 노출돼.</div>
      <table>
        <thead><tr><th>질문</th><th>형식</th><th>참여</th><th>상태</th><th></th></tr></thead>
        <tbody>
        ${polls.length ? polls.map(([id, p]) => {
          const tally = pollTally(id);
          return `<tr>
            <td>${esc(p.question)}</td>
            <td>${p.type === 'ox' ? 'O/X' : `객관식(${p.options.length})`}</td>
            <td>${tally.total}표</td>
            <td>${p.closed ? '<span class="badge pending">마감</span>' : '<span class="badge resolved">진행중</span>'}</td>
            <td>
              ${!p.closed ? `<button class="btn ghost small" onclick="closePoll('${id}')">마감</button>` : ''}
              <button class="btn danger small" onclick="deletePoll('${id}')">삭제</button>
            </td>
          </tr>`;
        }).join('') : `<tr><td colspan="5" class="empty">만든 설문이 없어요</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>민원 카테고리 <button class="btn small" style="margin-left:auto;" onclick="openCreateCategoryModal()">+ 카테고리</button></h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${cats.length ? cats.map(([id, c]) => `
          <span class="badge" style="background:${c.color}">
            ${esc(c.title)}
            <button style="margin-left:6px;font-weight:900;" onclick="deleteCategory('${id}')">×</button>
          </span>`).join('') : `<div class="empty">카테고리가 없어요</div>`}
      </div>
    </div>
    <div class="card">
      <h2>⚙️ 고급 설정</h2>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">O 득표율 기준으로 등급이 자동 산정되는 경계값이야. 예: A값이 90이면 O비율 90% 이상은 A.</div>
      <div class="grid3">
        <div class="field"><label>A 기준 (%)</label><input id="mThA" type="number" min="0" max="100" value="${th.a}"></div>
        <div class="field"><label>B 기준 (%)</label><input id="mThB" type="number" min="0" max="100" value="${th.b}"></div>
        <div class="field"><label>C 기준 (%)</label><input id="mThC" type="number" min="0" max="100" value="${th.c}"></div>
      </div>
      <div class="err-msg" id="mThErr"></div>
      <button class="btn small" onclick="submitGradeThresholds()">저장</button>
    </div>`;
}
function submitGradeThresholds() {
  const a = Number(document.getElementById('mThA').value);
  const b = Number(document.getElementById('mThB').value);
  const c = Number(document.getElementById('mThC').value);
  const errEl = document.getElementById('mThErr');
  if ([a, b, c].some(v => isNaN(v) || v < 0 || v > 100)) { errEl.textContent = '0~100 사이 숫자로 입력해줘'; return; }
  if (!(a > b && b > c)) { errEl.textContent = 'A > B > C 순서로 큰 값이어야 해'; return; }
  errEl.textContent = '';
  db.ref('settings/gradeThresholds').set({ a, b, c }).then(() => toast('등급 기준값을 저장했어'));
}
function openCreatePollModal() {
  openModal(`
    <h3>설문 만들기</h3>
    <div class="field"><label>질문</label><input id="mPollQ" placeholder="예: 이번 학기 반장 후보는?"></div>
    <div class="field"><label>형식</label>
      <select id="mPollType" onchange="document.getElementById('mPollOptWrap').classList.toggle('hidden', this.value==='ox')">
        <option value="ox">O / X</option>
        <option value="choice">객관식 (1, 2, 3...)</option>
      </select>
    </div>
    <div class="field hidden" id="mPollOptWrap">
      <label>선택지 (한 줄에 하나씩)</label>
      <textarea id="mPollOptions" rows="4" placeholder="철수&#10;영희&#10;민수"></textarea>
    </div>
    <div class="err-msg" id="mPollErr"></div>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitCreatePoll()">만들기</button>
    </div>`);
}
function submitCreatePoll() {
  const question = document.getElementById('mPollQ').value.trim();
  const type = document.getElementById('mPollType').value;
  const errEl = document.getElementById('mPollErr');
  if (!question) { errEl.textContent = '질문을 입력해줘'; return; }
  let options = [];
  if (type === 'choice') {
    options = document.getElementById('mPollOptions').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (options.length < 2) { errEl.textContent = '선택지를 2개 이상 입력해줘'; return; }
  }
  const id = newKey('polls');
  db.ref('polls/' + id).set({ question, type, options, createdBy: currentUser.uid, createdAt: Date.now(), closed: false })
    .then(() => { toast('설문을 만들었어'); closeModal(); });
}
function closePoll(id) {
  db.ref('polls/' + id + '/closed').set(true).then(() => toast('설문을 마감했어'));
}
function deletePoll(id) {
  if (!confirm('이 설문을 삭제할까? 투표 기록도 같이 삭제돼.')) return;
  db.ref('polls/' + id).remove()
    .then(() => db.ref('pollVotes/' + id).remove())
    .then(() => toast('삭제했어'));
}
function openCreatePeriodModal() {
  openModal(`
    <h3>새 주기 만들기</h3>
    <div class="field"><label>이름</label><input id="mPeriodLabel" placeholder="예: 7월 3주차"></div>
    <div class="field"><label>종류</label>
      <select id="mPeriodType"><option value="weekly">주간</option><option value="monthly">월간</option></select>
    </div>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitCreatePeriod()">만들고 활성화</button>
    </div>`);
}
function submitCreatePeriod() {
  const label = document.getElementById('mPeriodLabel').value.trim();
  const type = document.getElementById('mPeriodType').value;
  if (!label) { toast('이름을 입력해줘'); return; }
  const id = newKey('periods');
  db.ref('periods/' + id).set({ label, type, createdAt: Date.now() })
    .then(() => db.ref('settings/currentPeriodId').set(id))
    .then(() => db.ref('settings/voteCycle').set(type))
    .then(() => { toast('새 주기를 활성화했어'); closeModal(); });
}
function activatePeriod(id) {
  db.ref('settings/currentPeriodId').set(id).then(() => toast('주기를 활성화했어'));
}
function openCreateCategoryModal() {
  openModal(`
    <h3>민원 카테고리 만들기</h3>
    <div class="field"><label>타이틀</label><input id="mCatTitle" placeholder="예: 업무 태만"></div>
    <div class="field"><label>색상</label><input id="mCatColor" type="color" value="#ef4444"></div>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitCreateCategory()">만들기</button>
    </div>`);
}
function submitCreateCategory() {
  const title = document.getElementById('mCatTitle').value.trim();
  const color = document.getElementById('mCatColor').value;
  if (!title) { toast('타이틀을 입력해줘'); return; }
  const id = newKey('complaintCategories');
  db.ref('complaintCategories/' + id).set({ title, color }).then(() => { toast('카테고리를 만들었어'); closeModal(); });
}
function deleteCategory(id) {
  if (!confirm('이 카테고리를 삭제할까?')) return;
  db.ref('complaintCategories/' + id).remove().then(() => toast('삭제했어'));
}

</script>
</body>
</html>
